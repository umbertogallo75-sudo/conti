            ${perSerie.size > 1 ? `<div class="meta">${[...perSerie.entries()].map(([s, e]) =>
              `<span>serie ${esc(s)}: ${e.length}</span>`).join("")}</div>` : ""}
            <div class="scorri"><table class="dati">
              <thead><tr><th>File</th><th>Serie</th><th>Data</th><th class="num">Saldo finale</th></tr></thead>
              <tbody>${elenco.slice(0, 60).map((d) => `<tr>
                <td>${esc(nomeFile(d))}</td>
                <td>${esc(d.issuer_statement_id ?? "—")}</td>
                <td>${dataBreve(d.document_date)}</td>
                <td class="num">${d.closing_minor !== null && d.closing_minor !== undefined
                  ? formattaCentesimi(d.closing_minor, d.currency ?? "EUR") : "—"}</td>
              </tr>`).join("")}</tbody>
            </table></div>
            ${elenco.length > 60 ? `<div class="note">Mostrati i primi 60 di ${elenco.length}.</div>` : ""}
          </div>`;
      }).join("") : vuoto("Nessun documento collegato.")}

    ${cop.length ? `
      <h2>Periodi coperti <span class="sub">${cop.length}</span></h2>
      <div class="card"><div class="meta">${cop.slice(0, 40).map((c) =>
        `<span>${dataBreve(c.start_date)} → ${dataBreve(c.end_date)}</span>`).join("")}</div></div>` : ""}

    ${attese.length ? `
      <h2>Scadenze <span class="sub">${attese.length}</span></h2>
      <div class="card"><div class="meta">
        ${["overdue", "awaiting", "not_yet_due", "fulfilled", "superseded_by_substitution", "not_expected_closed"]
          .map((s) => { const n = attese.filter((a) => a.state === s).length; return n
            ? `<span>${esc({ overdue: "in ritardo", awaiting: "in attesa", not_yet_due: "non ancora dovuti",
                fulfilled: "arrivati", superseded_by_substitution: "superati da sostituzione",
                not_expected_closed: "non più attesi" }[s])}: ${n}</span>` : ""; }).join("")}
      </div></div>` : ""}
  `;
}

/* ── Solleciti: il punto in cui si chiede della carta sostitutiva ───────── */

function paginaSolleciti() {
  const oggiIso = oggi();
  const inRitardo = dati.attese.filter((a) => a.state === "overdue");
  const attesa = dati.attese.filter((a) => a.state === "awaiting");
  const future = dati.attese.filter((a) => a.state === "not_yet_due");

  if (!dati.attese.length) return vuoto("Nessuna attesa di documenti: non ci sono ancora rapporti con una cadenza riconosciuta.");

  // Raggruppo per rapporto: la domanda sulla sostituzione si fa una volta per
  // rapporto, non una volta per mese mancante.
  const gruppi = new Map();
  for (const a of inRitardo) {
    if (!gruppi.has(a.relationship_id)) gruppi.set(a.relationship_id, []);
    gruppi.get(a.relationship_id).push(a);
  }

  const blocchi = [...gruppi.entries()].map(([idRapporto, elenco]) => {
    const r = perRapporto(idRapporto);
    if (!r) return "";
    const strum = dati.strumenti.filter((s) => s.relationship_id === idRapporto);
    const ordinati = elenco.slice().sort((x, y) => x.due_on < y.due_on ? -1 : 1);
    const primo = ordinati[0], ultimo = ordinati[ordinati.length - 1];
    const ritardo = giorniFra(ultimo.due_on, oggiIso);
    const eCarta = r.entity_kind === "credit_facility" || strum.length > 0;

    return `
      <div class="card">
        <h3>${esc(r.display_name)} <span class="badge stop">${elenco.length} mancant${elenco.length === 1 ? "e" : "i"}</span></h3>
        <p>${esc(r.institution_label || r.institution_key)}</p>
        <div class="meta">
          <span>Dal ${dataBreve(primo.period_start)} al ${dataBreve(ultimo.period_end)}</span>
          <span>l'ultimo era atteso il ${dataBreve(ultimo.due_on)}</span>
          ${ritardo > 0 ? `<span>${ritardo} giorni fa</span>` : ""}
        </div>
        ${strum.length ? `<div class="note">Ultima carta conosciuta: <code>${esc(strum[strum.length - 1].masked_pan)}</code></div>` : ""}

        <div class="note risk">Il documento non è arrivato. Questo, da solo, non significa che il rapporto sia chiuso:
        potrebbe essere solo un documento che non hai ancora caricato.${
          eCarta ? " Oppure la carta è scaduta ed è stata sostituita con una nuova." : ""}</div>

        <div class="actions">
          ${eCarta ? `<button class="act" data-sostituita="${esc(r.id)}">La carta è stata sostituita</button>` : ""}
          <button class="act ghost" data-chiuso="${esc(r.id)}">Il rapporto è chiuso</button>
          <button class="act ghost" data-caricare="${esc(r.id)}">Devo solo caricare il documento</button>
        </div>
        <div id="modulo-${esc(r.id)}"></div>
      </div>`;
  }).join("");

  return `
    ${inRitardo.length ? `<h2>In ritardo <span class="sub">${inRitardo.length} document${inRitardo.length === 1 ? "o" : "i"}</span></h2>${blocchi}`
      : `<h2>In ritardo</h2>${vuoto("Nessun documento in ritardo.")}`}

    ${attesa.length ? `
      <h2>In attesa <span class="sub">${attesa.length}</span></h2>
      <div class="card"><p>Attesi ma ancora dentro la tolleranza: non è il caso di preoccuparsi.</p>
      <div class="meta">${attesa.slice(0, 12).map((a) => {
        const r = perRapporto(a.relationship_id);
        return `<span>${esc(r?.display_name ?? "—")} · ${dataBreve(a.due_on)}</span>`;
      }).join("")}</div></div>` : ""}

    ${future.length ? `
      <h2>Prossimi <span class="sub">${future.length}</span></h2>
      <div class="card"><div class="meta">${future.slice(0, 8).map((a) => {
        const r = perRapporto(a.relationship_id);
        return `<span>${esc(r?.display_name ?? "—")} · atteso il ${dataBreve(a.due_on)}</span>`;
      }).join("")}</div></div>` : ""}
  `;
}

function moduloSostituzione(idRapporto) {
  const r = perRapporto(idRapporto);
  const strum = strumentiDi(idRapporto);
  const ultima = strum.length ? strum[strum.length - 1] : null;

  // Le carte che il sistema conosce gia' presso lo stesso istituto e che non
  // stanno gia' sotto questo rapporto. Sceglierne una e' molto meno soggetto
  // a errore che digitare quattro cifre a memoria — e nove volte su dieci la
  // carta nuova e' gia' nei documenti caricati.
  const altrove = dati.strumenti.filter((s) =>
    s.institution_key === r.institution_key && s.relationship_id !== idRapporto);

  return `
    <div class="card" style="margin-top:0.7rem;background:var(--surface-2)">
      <h3>Carta sostitutiva</h3>
      <p>Il rapporto con ${esc(r.institution_label || r.institution_key)} continua, ma con una carta nuova.
      ${ultima ? `La precedente era <code>${esc(ultima.masked_pan)}</code>.` : ""}</p>

      ${altrove.length ? `
        <p style="color:var(--text);font-size:0.88rem"><strong>È una di queste?</strong>
        Sono carte dello stesso istituto già presenti nei tuoi documenti.</p>
        ${altrove.map((s) => `
          <label class="card" style="display:block;cursor:pointer;margin-bottom:0.4rem">
            <span style="display:flex;gap:0.6rem;align-items:center">
              <input type="radio" name="scelta-${esc(idRapporto)}" value="${esc(s.id)}">
              <span><code>${esc(s.masked_pan)}</code>
                <span class="meta" style="margin-top:0.15rem"><span>${esc(
                  perRapporto(s.relationship_id)?.display_name ?? "—")}</span></span></span>
            </span>
          </label>`).join("")}
        <label class="card" style="display:block;cursor:pointer;margin-bottom:0.4rem">
          <span style="display:flex;gap:0.6rem;align-items:center">
            <input type="radio" name="scelta-${esc(idRapporto)}" value="nuova" checked>
            <span>No, è una carta che non compare ancora nei documenti</span>
          </span>
        </label>` : ""}

      <div id="nuova-${esc(idRapporto)}">
        <label class="campo"><span>Le ultime quattro cifre — quelle <strong>in fondo</strong> al numero</span>
          <input type="text" id="pan-${esc(idRapporto)}" inputmode="numeric" maxlength="4" placeholder="1234"></label>
        <label class="campo"><span>Da quando è in uso (se lo sai)</span>
          <input type="text" id="dal-${esc(idRapporto)}" placeholder="gg.mm.aaaa" inputmode="numeric"></label>
      </div>

      <div class="note">Non chiedo mai il numero completo, né il codice di sicurezza, né il PIN. Le ultime quattro
      cifre bastano a riconoscere la carta nei documenti e non permettono di usarla. Se il numero è lungo,
      come su American Express, sono comunque le <strong>ultime</strong> quattro, non le prime.</div>
      <div class="actions">
        <button class="act" data-salva-sostituzione="${esc(idRapporto)}">Registra la sostituzione</button>
        <button class="act ghost" data-annulla="${esc(idRapporto)}">Annulla</button>
      </div>
      <div id="esito-${esc(idRapporto)}"></div>
    </div>`;
}

const avvisati = new Set();

async function registraSostituzione(idRapporto) {
  const box = document.getElementById(`esito-${idRapporto}`);
  const scelta = document.querySelector(`input[name="scelta-${idRapporto}"]:checked`)?.value ?? "nuova";

  // Se la carta nuova e' una che il sistema conosce gia', non e' una carta da
  // registrare: sono due rapporti che vanno uniti. Registrarla di nuovo
  // creerebbe un doppione e lascerebbe lo storico spezzato lo stesso.
  if (scelta !== "nuova") {
    const s = strumento(scelta);
    box.innerHTML = `<div class="avviso ok">Allora questi due sono lo stesso rapporto: apro l'unione.</div>`;
    setTimeout(() => { location.hash = `#/rapporto/${idRapporto}`; disegna();
      setTimeout(() => mostraUnione(idRapporto, s?.relationship_id ?? ""), 300); }, 700);
    return;
  }

  const pan = (document.getElementById(`pan-${idRapporto}`).value || "").replace(/\D/g, "");
  const dalGrezzo = (document.getElementById(`dal-${idRapporto}`).value || "").trim();

  if (pan.length !== 4) { box.innerHTML = `<div class="avviso err">Servono esattamente quattro cifre.</div>`; return; }

  // Due controlli contro l'errore piu' facile: leggere le cifre dalla parte
  // sbagliata del numero. Sono avvisi, non divieti: una carta puo' davvero
  // finire con quelle cifre, e in quel caso basta ripremere.
  const r0 = perRapporto(idRapporto);
  let sospetto = null;

  const inizioDiUnaNota = dati.strumenti.find((s) =>
    s.institution_key === r0?.institution_key &&
    /^\d{4}/.test(s.masked_pan) && s.masked_pan.slice(0, 4) === pan);
  if (inizioDiUnaNota) {
    sospetto = `<code>${esc(pan)}</code> sono le <strong>prime</strong> quattro cifre di
      <code>${esc(inizioDiUnaNota.masked_pan)}</code>, non le ultime.`;
  } else if (r0?.institution_key === "AMEX" && /^3[47]/.test(pan)) {
    // Le carte American Express cominciano tutte per 34 o 37 e sono lunghe
    // quindici cifre. Quattro cifre che cominciano cosi' sono quasi sempre
    // l'inizio del numero, non la fine.
    sospetto = `Le carte American Express cominciano per 34 o 37: <code>${esc(pan)}</code> sembra
      l'<strong>inizio</strong> del numero, non la fine.`;
  }

  if (sospetto && !avvisati.has(idRapporto)) {
    avvisati.add(idRapporto);
    box.innerHTML = `<div class="avviso err">${sospetto}<br><br>
      Se sono davvero le ultime quattro, premi di nuovo «Registra».</div>`;
    return;
  }
  let dal = null;
  if (dalGrezzo) {
    const m = dalGrezzo.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
    if (!m) { box.innerHTML = `<div class="avviso err">La data va scritta come gg.mm.aaaa.</div>`; return; }
    dal = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }

  const r = perRapporto(idRapporto);
  const strum = dati.strumenti.filter((s) => s.relationship_id === idRapporto);
  const precedente = strum.length ? strum[strum.length - 1] : null;

  try {
    // La carta nuova sostituisce la vecchia. La successione è dichiarata da
    // te, quindi è confermata: non è un'ipotesi dell'algoritmo.
    const nuova = {
      owner: sessione.utente.id, relationship_id: idRapporto,
      institution_key: r.institution_key, masked_pan: `••••${pan}`,
      valid_from: dal, replaces_id: precedente?.id ?? null,
      succession_status: "user_confirmed", succession_rung: "explicit_document",
      succession_proof: "Sostituzione dichiarata dall'intestatario in risposta a un sollecito",
    };
    await scrivi("payment_instrument", [nuova], { fondi: false });

    // La vecchia carta smette di essere valida e non viene più sollecitata.
    if (precedente && dal) {
      await modifica("payment_instrument", `id=eq.${precedente.id}`, { valid_to: dal });
    }
    await modifica(
      "document_expectation",
      `relationship_id=eq.${idRapporto}&state=eq.overdue`,
      { state: "superseded_by_substitution",
        rationale: "Carta sostituita: il documento mancante riguardava lo strumento precedente" },
    );
    await traccia("instrument.succession.confirm", "relationship", idRapporto,
      `Carta sostitutiva ••••${pan}`);

    box.innerHTML = `<div class="avviso ok">Registrata. Non ti chiederò più i documenti della carta precedente.</div>`;
    await ricarica();
    setTimeout(disegna, 900);
  } catch (e) {

async function chiudiRapporto(idRapporto) {

  disegna();

/* ── Le riparazioni ─────────────────────────────────────────────────────────
   Ogni azione qui sposta prove da un rapporto a un altro. Nessuna cancella
   niente: i documenti restano, cambiano solo di appartenenza, e ogni
   spostamento lascia una traccia in audit.
   ─────────────────────────────────────────────────────────────────────────── */

const NOME_GENERE = {
  cash_account: "Conto", credit_facility: "Carta di credito",
  securities_dossier: "Dossier titoli", payment_instrument: "Strumento",
  insurance_policy: "Polizza", loan: "Finanziamento",
};

function box(html) {
  const b = document.getElementById("modulo-azione");
  if (!b) return;
  b.innerHTML = html;
  if (html) b.scrollIntoView({ block: "start", behavior: "smooth" });
}
const esito = (m, ok = false) =>
  document.getElementById("esito-azione").innerHTML = `<div class="avviso ${ok ? "ok" : "err"}">${esc(m)}</div>`;

/** Sposta documenti, e la copertura che ne deriva, da un rapporto a un altro. */
async function spostaDocumenti(daId, aId, idsDocumenti) {
  for (const idDoc of idsDocumenti) {
    await cancella("document_relationship", `relationship_id=eq.${daId}&document_id=eq.${idDoc}`);
    await scrivi("document_relationship", [{
      owner: sessione.utente.id, document_id: idDoc, relationship_id: aId,
      confidence: 1, status: "user_confirmed",
    }], { fondi: true, conflitto: "owner,document_id,relationship_id" });
    await modifica("coverage", `document_id=eq.${idDoc}&relationship_id=eq.${daId}`,
      { relationship_id: aId });
  }
}

/* ── Separare un rapporto che ne contiene due ──────────────────────────── */

      <div class="note">Se non sai a quale numero corrisponde una serie, lascia «non lo so»: la separazione

async function eseguiSeparazione(id) {
  const r = perRapporto(id);
  const docs = documentiDi(id);
  const perSerie = raggruppa(
    docs.filter((d) => d.document_type === "bank_account_statement" && serieDi(d)), (d) => serieDi(d));
  const gruppi = [...perSerie.entries()].sort((a, b) => b[1].length - a[1].length);

  const scelte = gruppi.map(([serie]) => document.getElementById(`sep-${serie}`)?.value || "");
  if (new Set(scelte.filter(Boolean)).size !== scelte.filter(Boolean).length) {
    esito("Hai assegnato lo stesso numero a due serie diverse."); return;
  }

  try {
    esito("Separazione in corso…", true);
    for (let n = 1; n < gruppi.length; n++) {
      const [serie, elenco] = gruppi[n];
      const nuovoId = crypto.randomUUID();
      await scrivi("relationship", [{
        id: nuovoId, owner: sessione.utente.id,
        institution_key: r.institution_key, institution_label: r.institution_label,
        entity_kind: r.entity_kind,
        display_name: `${NOME_GENERE[r.entity_kind]} ${r.institution_label} — serie ${serie}`,
        currency: r.currency, status: "open", confirmation: "proposed",
        origin: "manual", confidence: 0.99, disposition: "needs_confirmation",
        cadence: r.cadence, cadence_status: r.cadence_status,
      }], { fondi: false });

      await spostaDocumenti(id, nuovoId, elenco.map((d) => d.id));
      if (scelte[n]) await modifica("relationship_identifier", `id=eq.${scelte[n]}`, { relationship_id: nuovoId });
      await traccia("relationship.split", "relationship", id,
        `Serie ${serie} separata in un rapporto proprio (${elenco.length} documenti)`);
    }
    if (scelte[0]) await modifica("relationship_identifier", `id=eq.${scelte[0]}`, { relationship_id: id });

    esito(`Separati. Ora sono ${gruppi.length} rapporti distinti.`, true);
    await ricarica();
    setTimeout(disegna, 900);
  } catch (e) { esito(e.message); }
}

/* ── Unire rapporti che sono lo stesso rapporto ────────────────────────────
   Il caso tipico e' la carta che scade e viene rifatta: l'emittente cambia il
   numero, il rapporto resta quello. Tenerli separati spezza in due lo storico
   e fa comparire dal nulla, sul rapporto nuovo, un debito che era gia' li'.
   ─────────────────────────────────────────────────────────────────────────── */

const periodoDi = (id) => {
  const c = dati.copertura.filter((x) => x.relationship_id === id);
  if (!c.length) return { da: null, a: null };
  return { da: c.map((x) => x.start_date).sort()[0], a: c.map((x) => x.end_date).sort().at(-1) };
};

function mostraUnione(id, suggerito = "") {
  const r = perRapporto(id);
  const candidati = dati.rapporti
    .filter((x) => x.id !== id && x.institution_key === r.institution_key && x.confirmation !== "rejected")
    .map((x) => ({ x, p: periodoDi(x.id), docs: documentiDi(x.id).length }))
    .sort((a, b) => (a.p.da ?? "9") < (b.p.da ?? "9") ? -1 : 1);

  if (!candidati.length) {
    box(`<div class="card"><div class="note">Non ci sono altri rapporti di ${esc(r.institution_label)} con cui unirlo.</div></div>`);
    return;
  }

  const mio = periodoDi(id);

  box(`
    <div class="card" style="background:var(--surface-2)">
      <h3>Unisci «${esc(r.display_name)}» a un altro rapporto</h3>
      <p>Diventeranno un rapporto solo. I documenti, i periodi e le scadenze si sommano;
      le carte diventano una successione, ciascuna con il suo periodo di validità.</p>

      <div class="card">
        <h3>Questo <span class="badge mute">${documentiDi(id).length} documenti</span></h3>
        <div class="meta">
          ${mio.da ? `<span>${dataBreve(mio.da)} → ${dataBreve(mio.a)}</span>` : "<span>periodo ignoto</span>"}
          ${strumentiDi(id).map((s) => `<span><code>${esc(s.masked_pan)}</code></span>`).join("")}
        </div>
      </div>

      <p style="color:var(--text);font-size:0.88rem;margin-top:0.8rem"><strong>Da unire con:</strong></p>
      ${candidati.map(({ x, p, docs }) => `
        <label class="card" style="display:block;cursor:pointer">
          <span style="display:flex;gap:0.6rem;align-items:flex-start">
            <input type="checkbox" class="uni" value="${esc(x.id)}"${x.id === suggerito ? " checked" : ""} style="margin-top:0.3rem">
            <span style="flex:1">
              <strong style="font-size:0.93rem">${esc(x.display_name)}</strong>
              <span class="meta" style="margin-top:0.3rem">
                <span>${docs} documenti</span>
                ${p.da ? `<span>${dataBreve(p.da)} → ${dataBreve(p.a)}</span>` : ""}
                ${strumentiDi(x.id).map((s) => `<span><code>${esc(s.masked_pan)}</code></span>`).join("")}
              </span>
            </span>
          </span>
        </label>`).join("")}

      <label class="campo" style="margin-top:0.7rem"><span>Nome del rapporto unito</span>
        <input type="text" id="nome-unito" value="${esc(r.display_name)}"></label>

      <div class="note risk">L'unione non si annulla con un clic: i documenti finiscono tutti sotto un
      rapporto solo e per tornare indietro bisogna separarli. Unisci solo se sei sicuro che siano
      la stessa cosa.</div>
      <div class="actions">
        <button class="act" data-fai-unione="${esc(id)}">Uniscili</button>
        <button class="act ghost" data-chiudi-azione="1">Annulla</button>
      </div>
      <div id="esito-azione"></div>
    </div>`);
}

async function eseguiUnione(id) {
  const assorbiti = [...document.querySelectorAll("input.uni:checked")].map((c) => c.value);
  if (!assorbiti.length) { esito("Non hai scelto nessun rapporto da unire."); return; }
  const nome = (document.getElementById("nome-unito").value || "").trim();
  if (!nome) { esito("Dai un nome al rapporto unito."); return; }

  try {
    esito("Unione in corso…", true);

    // PRIMA di muovere qualunque cosa mi segno da quale rapporto viene ogni
    // carta e che periodo copriva. Dopo l'unione i documenti stanno tutti
    // sotto un rapporto solo e non sarebbe piu' possibile ricostruirlo.
    const periodiCarte = new Map();
    for (const rid of [id, ...assorbiti]) {
      const p = periodoDi(rid);
      for (const s of strumentiDi(rid)) periodiCarte.set(s.id, s.valid_from ? { da: s.valid_from, a: s.valid_to } : p);
    }

    for (const a of assorbiti) {
      await spostaDocumenti(a, id, documentiDi(a).map((d) => d.id));
      // Quello che resta legato al rapporto assorbito passa al principale.
      await modifica("coverage", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("payment_instrument", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("relationship_identifier", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("document_expectation", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("relationship", `id=eq.${a}`,
        { confirmation: "rejected", status: "closed", closure_evidence: "user_confirmed",
          updated_at: new Date().toISOString() });
      await traccia("relationship.merge", "relationship", a,
        `Unito a ${nome}: era lo stesso rapporto`);
    }

    // Le carte diventano una successione ordinata nel tempo. I periodi di
    // validita' vengono dai documenti, non da quello che si immagina: ogni
    // carta vale dal primo al giorno prima della successiva; l'ultima resta
    // aperta perche' e' quella in uso.
    await ricarica();
    const carte = strumentiDi(id)
      .map((s) => ({ s, p: periodiCarte.get(s.id) ?? { da: null, a: null } }))
      .sort((a, b) => (a.p.da ?? "9999") < (b.p.da ?? "9999") ? -1 : 1);

    for (let n = 0; n < carte.length; n++) {
      const { s, p } = carte[n];
      const dopo = carte[n + 1];
      await modifica("payment_instrument", `id=eq.${s.id}`, {
        valid_from: p.da ?? null,
        valid_to: dopo ? (dopo.p.da ?? p.a ?? null) : null,
        replaces_id: n > 0 ? carte[n - 1].s.id : null,
        succession_status: "user_confirmed",
        succession_rung: "explicit_document",
        succession_proof: "Successione confermata dall'intestatario: è sempre stata la stessa carta, rifatta alla scadenza",
      });
    }

    await modifica("relationship", `id=eq.${id}`,
      { display_name: nome, confirmation: "user_confirmed", updated_at: new Date().toISOString() });
    await traccia("relationship.merge", "relationship", id,
      `${assorbiti.length} rapporti assorbiti; ${carte.length} carte messe in successione`);

    esito(`Uniti. Ora è un rapporto solo con ${carte.length} carte in successione.`, true);
    await ricarica();
    setTimeout(disegna, 1000);
  } catch (e) { esito(e.message); }
}

/* ── Togliere una carta inserita per sbaglio ───────────────────────────── */

async function rimuoviCarta(idCarta) {
  const s = strumento(idCarta);
  if (!s) return;
  if (!confirm(`Togliere la carta ${s.masked_pan}?\n\nI documenti restano dove sono: sparisce solo la carta dall'elenco.`)) return;
  try {
    // Chi la indicava come propria antenata resta senza antenata, altrimenti
    // il database rifiuta la cancellazione.
    for (const altro of dati.strumenti.filter((x) => x.replaces_id === idCarta)) {
      await modifica("payment_instrument", `id=eq.${altro.id}`, { replaces_id: s.replaces_id ?? null });
    }
    await cancella("payment_instrument", `id=eq.${idCarta}`);
    await traccia("instrument.remove", "payment_instrument", idCarta,
      `Carta ${s.masked_pan} tolta: inserita per sbaglio`);
    await ricarica();
    disegna();
  } catch (e) { alert(`Non è riuscito: ${e.message}`); }
}

function paginaDocumenti() {
  if (!dati.documenti.length) return vuoto("Nessun documento in archivio.");

  const istituti = [...new Set(dati.documenti.map((d) => d.institution_key).filter(Boolean))].sort();
  const tipi = [...new Set(dati.documenti.map((d) => d.document_type))].sort();

  const elenco = dati.documenti.filter((d) =>
    (!filtroDoc.istituto || d.institution_key === filtroDoc.istituto) &&
    (!filtroDoc.tipo || d.document_type === filtroDoc.tipo));

  const perFile = new Map(dati.file.map((f) => [f.id, f]));

  return `
    <div class="card">
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
        <select id="filtro-istituto" style="flex:1;min-width:150px">
          <option value="">Tutti gli istituti</option>
          ${istituti.map((i) => `<option value="${esc(i)}"${filtroDoc.istituto === i ? " selected" : ""}>${esc(i)}</option>`).join("")}
        </select>
        <select id="filtro-tipo" style="flex:1;min-width:150px">
          <option value="">Tutti i tipi</option>
          ${tipi.map((t) => `<option value="${esc(t)}"${filtroDoc.tipo === t ? " selected" : ""}>${esc(TIPI[t] ?? t)}</option>`).join("")}
        </select>
      </div>
      <div class="meta"><span>${elenco.length} di ${dati.documenti.length}</span></div>
    </div>

    <div class="scorri"><table class="dati">
      <thead><tr><th>Documento</th><th>Tipo</th><th>Data</th><th class="num">Saldo finale</th></tr></thead>
      <tbody>${elenco.slice(0, 300).map((d) => {
        const f = perFile.get(d.source_file_id);
        return `<tr>
          <td>${esc(f?.display_name ?? "—")}${d.ambiguous ? ' <span class="badge warn">ambiguo</span>' : ""}</td>
          <td>${esc(TIPI[d.document_type] ?? d.document_type)}</td>
          <td>${dataBreve(d.document_date)}</td>
          <td class="num">${d.closing_minor !== null ? formattaCentesimi(d.closing_minor, d.currency ?? "EUR") : "—"}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
    ${elenco.length > 300 ? `<div class="note">Mostrati i primi 300. Restringi con i filtri per vedere gli altri.</div>` : ""}
  `;
}

/* ── Movimenti ──────────────────────────────────────────────────────────────
   Qui vale la regola che tiene in piedi tutto: la spesa e' quella e una sola
   volta. Le righe «PayPal» sul conto e gli addebiti delle carte NON sono
   spese — sono lo stesso denaro visto da un'altra parte — e aprendole si
   arriva alla spesa vera.
   ─────────────────────────────────────────────────────────────────────────── */

const EVENTO = {
  expense: { nome: "spesa", badge: "stop" },
  income: { nome: "entrata", badge: "ok" },
  internal_transfer: { nome: "giro interno", badge: "mute" },
  card_settlement: { nome: "saldo carta", badge: "mute" },
  prepaid_top_up: { nome: "ricarica", badge: "mute" },
};
const ECONOMICI = new Set(["expense", "income"]);

/* I filtri sono DUE: quello applicato, che decide che cosa si vede, e la
   bozza, che è quello che si sta scegliendo. Finché non si preme «Applica»
   la lista non si muove — altrimenti selezionare cinque conti vorrebbe dire
   ridisegnare sedicimila movimenti cinque volte, e a metà scelta si vedono
   risultati che non si è chiesto di vedere. «Annulla» butta la bozza. */
const filtroVuoto = () => ({
  verso: "", banche: [], prodotti: [], categorie: [], settori: [], evento: "",
  dal: "", al: "", min: "", max: "", cerca: "",
});
let filtroMov = filtroVuoto();
let bozzaMov = filtroVuoto();
/* Sul telefono il pannello parte chiuso: la prima cosa che si deve vedere
   sono i movimenti, non otto campi da riempire. Su schermo largo lo spazio
   c'è e resta aperto. Una volta aperto, resta aperto. */
let filtriAperti = typeof matchMedia === "function" ? matchMedia("(min-width: 760px)").matches : true;
const copiaFiltro = (f) => JSON.parse(JSON.stringify(f));

/* «2 selezionati» dice quanto si è scelto senza occupare tre righe di elenco. */
/** Che cosa si sta guardando, detto in una riga. */
function descriviFiltro(f) {
  const pezzi = [];
  if (f.verso) pezzi.push({ uscite: "solo uscite", entrate: "solo entrate", interni: "solo giri interni" }[f.verso]);
  if (f.banche.length) pezzi.push(f.banche.join(", "));
  if (f.prodotti.length) pezzi.push(`${f.prodotti.length} prodott${f.prodotti.length === 1 ? "o" : "i"}`);
  if (f.categorie.length) pezzi.push(f.categorie.join(", "));
  if (f.settori?.length) pezzi.push(f.settori.join(", "));
  if (f.dal || f.al) pezzi.push(`${f.dal ? `dal ${dataBreve(f.dal)}` : ""}${f.al ? ` al ${dataBreve(f.al)}` : ""}`.trim());
  if (f.min !== "" || f.max !== "") pezzi.push(`importo ${f.min !== "" ? `da ${f.min} €` : ""}${f.max !== "" ? ` a ${f.max} €` : ""}`.trim());
  if (f.cerca) pezzi.push(`«${f.cerca}»`);
  return pezzi.length ? pezzi.join(" · ") : "Nessun filtro: si vede tutto";
}

function riepilogoScelta(scelti, totale, nomeSingolare) {
  if (!scelti.length) return `Tutt${nomeSingolare === "banca" ? "e le banche" : nomeSingolare === "prodotto" ? "i i prodotti" : "e le categorie"}`;
  if (scelti.length === totale) return "Tutti";
  return scelti.length === 1 ? "1 selezionato" : `${scelti.length} selezionati`;
}

/** Un menù a tendina con le caselle: nativo, funziona anche col dito. */
function tendinaMultipla(id, etichetta, voci, scelti, nomeSingolare) {
  return `
    <label class="campo"><span>${esc(etichetta)}</span>
      <details class="tendina" id="${esc(id)}">
        <summary>${esc(riepilogoScelta(scelti, voci.length, nomeSingolare))}</summary>
        <div class="voci">
          ${voci.map((v) => `
            <label class="voce"><input type="checkbox" value="${esc(v.id)}"${scelti.includes(v.id) ? " checked" : ""}>
              <span>${esc(v.nome)}</span></label>`).join("")}
        </div>
      </details>
    </label>`;
}
let apertoMov = null;

const scrittureDi = (id) => indice.perMovimento.get(id) ?? [];
const contiDi = (id) => scrittureDi(id).map((s) => indice.perConto.get(s.account_id)).filter(Boolean);
const importoSu = (id, filtro) => {
  const s = scrittureDi(id).find((x) => filtro(indice.perConto.get(x.account_id)));
  return s ? BigInt(s.amount_minor) : null;
};
/** L'importo che caratterizza il movimento: quello sul conto o sulla carta. */
const importoMov = (id) => {
  const s = scrittureDi(id).find((x) => ["asset_cash", "liability_credit"].includes(indice.perConto.get(x.account_id)?.kind));
  return s ? BigInt(s.amount_minor) : (BigInt(scrittureDi(id)[0]?.amount_minor ?? 0));
};

function paginaMovimenti() {
  if (!dati.movimenti.length) {
    return `<h2>Movimenti</h2>${vuoto("Non ci sono ancora movimenti. Si caricano da «Impostazioni».")}`;
  }

  const patrimoniali = dati.conti.filter((c) => ["asset_cash", "liability_credit", "asset_securities"].includes(c.kind));
  const prodotti = patrimoniali.map((c) => ({ id: c.id, nome: nomeConto(c) }))
    .sort((a, b) => a.nome.localeCompare(b.nome));

  /* La banca di un prodotto è il rapporto a cui appartiene; per quelli che un
     rapporto non ce l'hanno ancora, il nome dice già di chi sono. */
  const perRapporto = new Map(dati.rapporti.map((r) => [r.id, r]));
  const bancaDi = (c) => {
    const r = c.relationship_id ? perRapporto.get(c.relationship_id) : null;
    if (r) return r.institution_label || r.institution_key;
    const m = c.name.match(/Intesa|Sella|HYPE|Revolut|Trade Republic|Wise|PayPal|American Express|Contanti/i);
    return m ? m[0] : "Altro";
  };
  const banche = [...new Set(patrimoniali.map(bancaDi))].sort()
    .map((b) => ({ id: b, nome: b }));
  const prodottiDellaBanca = (nomi) => new Set(
    patrimoniali.filter((c) => nomi.includes(bancaDi(c))).map((c) => c.id));

  const vociCategorie = [...new Set(dati.conti.filter((c) => ["expense", "income"].includes(c.kind))
    .map((c) => c.category))].filter(Boolean).sort().map((c) => ({ id: c, nome: c }));

  /* I settori che esistono davvero nei dati, con quante controparti ciascuno:
     un elenco di sessanta voci in ordine alfabetico è inutilizzabile, uno con
     accanto il numero si legge. */
  const contaSettori = new Map();
  for (const c of dati.controparti ?? [])
    if (c.settore && c.settore !== "non determinato")
      contaSettori.set(c.settore, (contaSettori.get(c.settore) ?? 0) + 1);
  const vociSettori = [...contaSettori.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([s, n]) => ({ id: s, nome: `${s} (${n})` }));

  const tutteLeDate = dati.movimenti.map((m) => m.economic_date).sort();
  const primoGiorno = tutteLeDate[0] ?? "";
  const ultimoGiorno = tutteLeDate.at(-1) ?? "";

  const scelti = filtroMov.prodotti.length
    ? new Set(filtroMov.prodotti)
    : (filtroMov.banche.length ? prodottiDellaBanca(filtroMov.banche) : null);
  const minCent = filtroMov.min === "" ? null : BigInt(Math.round(Number(filtroMov.min) * 100));
  const maxCent = filtroMov.max === "" ? null : BigInt(Math.round(Number(filtroMov.max) * 100));
  const cerca = filtroMov.cerca.toLowerCase();

  const elenco = dati.movimenti.filter((m) => {
    if (filtroMov.evento && m.event_type !== filtroMov.evento) return false;
    if (filtroMov.dal && m.economic_date < filtroMov.dal) return false;
    if (filtroMov.al && m.economic_date > filtroMov.al) return false;
    if (filtroMov.verso === "uscite" && !(ECONOMICI.has(m.event_type) && m.event_type === "expense")) return false;
    if (filtroMov.verso === "entrate" && m.event_type !== "income") return false;
    if (filtroMov.verso === "interni" && ECONOMICI.has(m.event_type)) return false;
    if (scelti && !scrittureDi(m.id).some((s) => scelti.has(s.account_id))) return false;
    if (filtroMov.categorie.length && !contiDi(m.id).some((c) => filtroMov.categorie.includes(c.category))) return false;
    /* Il settore è più fine della categoria: «utenze» dice poco, «energia
       elettrica» si può cercare. Sta sulla controparte, non sul movimento. */
    if (filtroMov.settori?.length) {
      const cp = controparteDi(m);
      if (!cp || !filtroMov.settori.includes(cp.settore)) return false;
    }
    if (minCent !== null || maxCent !== null) {
      const v = importoMov(m.id) < 0n ? -importoMov(m.id) : importoMov(m.id);
      if (minCent !== null && v < minCent) return false;
      if (maxCent !== null && v > maxCent) return false;
    }
    if (cerca && !m.description.toLowerCase().includes(cerca)) return false;
    return true;
  });

  // I totali si calcolano SEMPRE dai conti economici, mai sommando le righe:
  // sommare le righe rimetterebbe dentro i giri interni.
  let spese = 0n, entrate = 0n, interni = 0;
  for (const m of elenco) {
    if (m.event_type === "expense") spese += scrittureDi(m.id)
      .filter((s) => indice.perConto.get(s.account_id)?.kind === "expense")
      .reduce((s, x) => s + BigInt(x.amount_minor), 0n);
    else if (m.event_type === "income") entrate += scrittureDi(m.id)
      .filter((s) => indice.perConto.get(s.account_id)?.kind === "income")
      .reduce((s, x) => s - BigInt(x.amount_minor), 0n);
    else interni++;
  }

  const righe = elenco.slice(0, 250);

  return `
    <details class="card filtri" id="pannello-filtri"${filtriAperti ? " open" : ""}>
      <summary>
        <span class="che">${esc(descriviFiltro(filtroMov))}</span>
        <span class="apri">Filtra</span>
      </summary>
      <div class="griglia-filtri">
        <label class="campo"><span>Entrate / Uscite</span>
          <select id="m-verso">
            <option value=""${bozzaMov.verso === "" ? " selected" : ""}>Tutte</option>
            <option value="uscite"${bozzaMov.verso === "uscite" ? " selected" : ""}>Solo uscite</option>
            <option value="entrate"${bozzaMov.verso === "entrate" ? " selected" : ""}>Solo entrate</option>
            <option value="interni"${bozzaMov.verso === "interni" ? " selected" : ""}>Solo giri interni</option>
          </select>
        </label>

        ${tendinaMultipla("m-banche", "Banca", banche, bozzaMov.banche, "banca")}
        ${tendinaMultipla("m-prodotti", "Prodotti", prodotti, bozzaMov.prodotti, "prodotto")}
        ${tendinaMultipla("m-categorie", "Categorie", vociCategorie, bozzaMov.categorie, "categoria")}
        ${vociSettori.length ? tendinaMultipla("m-settori", "Settore", vociSettori, bozzaMov.settori, "settore") : ""}

        <label class="campo"><span>Importo</span>
          <div class="coppia">
            <input type="number" id="m-min" inputmode="decimal" placeholder="da €" value="${esc(bozzaMov.min)}">
            <input type="number" id="m-max" inputmode="decimal" placeholder="a €" value="${esc(bozzaMov.max)}">
          </div>
        </label>

        <label class="campo"><span>Periodo</span>
          <div class="coppia">
            <input type="date" id="m-dal" value="${esc(bozzaMov.dal)}" min="${esc(primoGiorno)}" max="${esc(ultimoGiorno)}">
            <input type="date" id="m-al" value="${esc(bozzaMov.al)}" min="${esc(primoGiorno)}" max="${esc(ultimoGiorno)}">
          </div>
        </label>

        <label class="campo larga"><span>Cerca nella descrizione</span>
          <input type="text" id="m-cerca" placeholder="nome del negozio, causale, numero…" value="${esc(bozzaMov.cerca)}">
        </label>
      </div>

      <div class="azioni-filtri">
        <button class="act ghost" id="m-annulla">Annulla</button>
        <span class="note" id="m-stato">${esc(descriviFiltro(filtroMov))}</span>
        <button class="act" id="m-applica">Applica</button>
      </div>
    </details>

    <div class="tiles">
      <div class="tile"><div class="v" style="color:var(--stop)">${formattaCentesimi(spese)}</div><div class="k">spese nel filtro</div></div>
      <div class="tile"><div class="v" style="color:var(--ok)">${formattaCentesimi(entrate)}</div><div class="k">entrate nel filtro</div></div>
      <div class="tile"><div class="v">${interni}</div><div class="k">giri interni, non spesa</div></div>
      <div class="tile"><div class="v">${elenco.length.toLocaleString("it-IT")}</div><div class="k">movimenti</div></div>
    </div>

    <div class="note proof">I giri interni — ricariche di PayPal, saldi delle carte, girocontò — non entrano nelle
    spese: sono lo stesso denaro visto da un'altra parte. Aprili per vedere dov'è finito davvero.</div>

    <h2>Movimenti <span class="sub">${righe.length} di ${elenco.length}</span></h2>
    ${righe.map((m) => {
      const ev = EVENTO[m.event_type] ?? { nome: m.event_type, badge: "mute" };
      const imp = importoMov(m.id);
      const legati = indice.legatiA.get(m.id) ?? [];
      const conti = contiDi(m.id).filter((c) => ["asset_cash", "liability_credit"].includes(c.kind));
      const aperto = apertoMov === m.id;

      const [aa, mm, gg] = m.economic_date.split("-");
      const banca = bancaDelMovimento(m);
      const cat = categoriaDi(m);
      const nota = notaDi(m.id);
      const provvisorio = m.perimeter === "provisional";

      return `
        <div class="riga-mov${aperto ? " aperta" : ""}${provvisorio ? " provvisoria" : ""}" data-movimento="${esc(m.id)}">
          <div class="testa">
            <div class="quando"><b>${esc(gg)}</b><span>${esc(MESE_BREVE[Number(mm) - 1] ?? "")}</span>
              <i>${esc(aa)}</i></div>

            <div class="che-cosa">
              ${(() => {
                const cp = controparteDi(m);
                if (!cp || cp.fiducia === "non trovato")
                  return `<strong>${esc(m.description.slice(0, 110))}</strong>`;
                const f = FIDUCIA[cp.corretta_da_lui ? "confermata" : cp.fiducia] ?? FIDUCIA.certa;
                return `<strong>${esc(cp.nome)}${f.segno
                  ? ` <span class="dubbio ${f.classe}" title="${esc(f.titolo)}">${f.segno}</span>` : ""}</strong>
                  <span class="grezzo" title="Come lo scrive la banca">${esc(m.description.slice(0, 110))}</span>`;
              })()}
              <div class="sotto">
                ${(() => {
                  const cp = controparteDi(m);
                  return cp?.settore && cp.settore !== "non determinato"
                    ? `<span class="settore">${esc(cp.settore)}</span>` : "";
                })()}
                <span class="conto">${conti.map((c) => esc(nomeConto(c))).join(" · ") || "—"}</span>
                ${(nota?.labels ?? []).map((l) => `<span class="etichetta">${esc(l)}</span>`).join("")}
                ${legati.length ? `<span class="badge ok">${legati.length} corrispondenz${legati.length === 1 ? "a" : "e"}</span>` : ""}
              </div>
            </div>

            <div class="istituto">${esc(banca.nome)}</div>

            <div class="genere">
              <span class="tondo">${segno(m)}</span>
              <span>${esc((cat ?? ev.nome).toUpperCase())}</span>
            </div>

            <div class="quanto">
              <b class="${imp < 0n ? "esce" : "entra"}">${formattaCentesimi(imp)}</b>${inValuta(m)}
              ${provvisorio ? `<span class="non-contab">NON CONTABILIZZATO</span>` : ""}
            </div>

            <span class="freccia" aria-hidden="true">${aperto ? "▴" : "▾"}</span>
          </div>
          ${aperto ? dettaglioMovimento(m) : ""}
        </div>`;
    }).join("")}
    ${elenco.length > 250 ? `<div class="note">Mostrati i primi 250. Restringi con i filtri.</div>` : ""}
  `;
}

async function salvaAnnotazione(box) {
  const id = box.dataset.annota;
  const m = dati.movimenti.find((x) => x.id === id);
  const esito = box.querySelector(".a-esito");
  const imp = importoMov(id);
  const assoluto = imp < 0n ? -imp : imp;

  const categoria = box.querySelector(".a-categoria").value.trim();
  const etichette = box.querySelector(".a-etichette").value
    .split(",").map((x) => x.trim()).filter(Boolean);
  const parti = [...box.querySelectorAll(".parte")].map((p) => ({
    minor: Math.round(Number(p.querySelector(".p-importo").value || 0) * 100),
    category: p.querySelector(".p-categoria").value.trim(),
  })).filter((p) => p.minor > 0);

  /* Una suddivisione che non fa il totale non è una suddivisione: è un errore
     che sposterebbe soldi da nessuna parte a qualche categoria. */
  if (parti.length) {
    const somma = BigInt(parti.reduce((s, p) => s + p.minor, 0));
    if (somma !== assoluto) {
      esito.innerHTML = `<div class="avviso err">Le parti fanno ${formattaCentesimi(somma)},
        l'operazione è ${formattaCentesimi(assoluto)}. Mancano ${formattaCentesimi(assoluto - somma)}.</div>`;
      return;
    }
    if (parti.some((p) => !p.category)) {
      esito.innerHTML = `<div class="avviso err">Ogni parte deve avere una categoria.</div>`;
      return;
    }
  }

  try {
    await scrivi("transaction_annotation", [{
      owner: sessione.utente.id, transaction_id: id,
      category: categoria || null, labels: etichette, splits: parti,
      updated_at: new Date().toISOString(),
    }], { fondi: true, conflitto: "owner,transaction_id" });
    await traccia("transaction.annotated", "ledger_transaction", id,
      `Categoria «${categoria || "—"}»${etichette.length ? `, etichette: ${etichette.join(", ")}` : ""}${parti.length ? `, divisa in ${parti.length} parti` : ""}`);
    indice.perNota.set(id, { transaction_id: id, category: categoria || null, labels: etichette, splits: parti });
    const gia = dati.note.findIndex((x) => x.transaction_id === id);
    const riga = { transaction_id: id, category: categoria || null, labels: etichette, splits: parti };
    if (gia >= 0) dati.note[gia] = riga; else dati.note.push(riga);
    esito.innerHTML = `<div class="avviso ok">Salvato.</div>`;
    setTimeout(disegna, 500);
  } catch (e) {
    esito.innerHTML = `<div class="avviso err">${esc(e.message)}</div>`;
  }
}

async function togliAnnotazione(box) {
  const id = box.dataset.annota;
  await cancella("transaction_annotation", `transaction_id=eq.${id}`);
  await traccia("transaction.annotation_removed", "ledger_transaction", id, "Tolte le modifiche manuali");
  indice.perNota.delete(id);
  dati.note = dati.note.filter((x) => x.transaction_id !== id);
  disegna();
}

/* ── Il dettaglio di un addebito di carta ───────────────────────────────────
   «Addebito American Express 10.434,81 €» non dice niente. Le spese che lo
   compongono ci sono: sono quelle della carta fra questo pagamento e il
   precedente. Non serve un legame scritto per ognuna — basta la finestra fra
   due pagamenti, che è un fatto.
   ─────────────────────────────────────────────────────────────────────────── */
function speseCoperteDalSaldo(m) {
  if (m.event_type !== "card_settlement") return null;
  const carta = contiDi(m.id).find((c) => c.kind === "liability_credit");
  if (!carta) return null;

  const saldi = dati.movimenti
    .filter((t) => t.event_type === "card_settlement" &&
      scrittureDi(t.id).some((s) => s.account_id === carta.id))
    .map((t) => t.economic_date).sort();
  const k = saldi.indexOf(m.economic_date);
  const precedente = k > 0 ? saldi[k - 1] : "0000-00-00";

  const spese = dati.movimenti.filter((t) => t.event_type === "expense" &&
    t.economic_date > precedente && t.economic_date <= m.economic_date &&
    scrittureDi(t.id).some((s) => s.account_id === carta.id));
  if (!spese.length) return null;

  const totale = spese.reduce((s, t) => {
    const v = importoMov(t.id);
    return s + (v < 0n ? -v : v);
  }, 0n);
  return { carta, spese, totale, dal: precedente === "0000-00-00" ? null : precedente };
}

/* ── I periodi che mancano ──────────────────────────────────────────────────
   Di un conto non si hanno per forza tutti gli anni, e va bene. Ma un mese
   VUOTO in mezzo a due mesi pieni non è un mese tranquillo: è un mese di cui
   manca il documento. Sugli ultimi due anni quel buco va detto, perché in
   quei mesi le spese risultano zero e sembrano zero davvero.
   ─────────────────────────────────────────────────────────────────────────── */
function periodiMancanti() {
  const oggi = new Date().toISOString().slice(0, 7);
  const meno = (mese, n) => {
    const [a, m] = mese.split("-").map(Number);
    const t = new Date(Date.UTC(a, m - 1 - n, 1));
    return t.toISOString().slice(0, 7);
  };
  const limite = meno(oggi, 23);

  const buchi = [];
  for (const c of dati.conti.filter((x) => ["asset_cash", "liability_credit"].includes(x.kind))) {
    /* perMovimento tiene le SCRITTURE di un movimento, non il movimento:
       cercarci dentro la data restituiva undefined e la pagina non si
       disegnava più. Il movimento sta in dati.movimenti. */
    const mesi = new Set();
    for (const s of dati.scritture) {
      if (s.account_id !== c.id) continue;
      const t = indice.perTransazione.get(s.transaction_id);
      if (t) mesi.add(t.economic_date.slice(0, 7));
    }
    if (mesi.size < 2) continue;
    const ordinati = [...mesi].sort();
    const primo = ordinati[0], ultimo = ordinati.at(-1);

    const mancanti = [];
    let m = primo < limite ? limite : primo;
    while (m <= ultimo) {
      if (!mesi.has(m)) mancanti.push(m);
      const [a, k] = m.split("-").map(Number);
      m = new Date(Date.UTC(a, k, 1)).toISOString().slice(0, 7);
    }
    // Un conto fermo da un pezzo non è un buco: è un conto fermo.
    const fermoDa = ultimo < meno(oggi, 2) ? ultimo : null;
    if (mancanti.length || fermoDa) buchi.push({ conto: c, mancanti, ultimo, fermoDa });
  }
  return buchi;
}

/* ── Analisi ────────────────────────────────────────────────────────────────
   Le domande che uno si fa davvero: dove sono finiti i soldi, da dove sono
   arrivati, quanto si è mosso soltanto da una tasca all'altra.
   Ogni riga porta ai movimenti che la compongono: nessun totale resta
   un numero di cui fidarsi sulla parola.
   ─────────────────────────────────────────────────────────────────────────── */


const saldoConto = (idConto, filtro = () => true) => dati.scritture
  .filter((s) => s.account_id === idConto && filtro(s))
  .reduce((t, s) => t + BigInt(s.amount_minor), 0n);

/** Il mittente di un accredito, quando il documento lo dichiara. */
function mittenteDi(descrizione) {
  const m = descrizione.match(/MITT\.?:\s*(.+?)(?:\s+COD[.\s]|\s+\d{10,}|\s+—|$)/i);
  if (m) return m[1].trim().replace(/\s+/g, " ").slice(0, 44);
  const d = descrizione.match(/disposto da:\s*—?\s*(.+?)(?:\s+COD|\s+\d{6,}|$)/i);
  return d ? d[1].trim().slice(0, 44) : "senza mittente dichiarato";
}

function barra(parte, tutto, colore = "var(--accent)") {
  const q = tutto === 0n ? 0 : Number((parte < 0n ? -parte : parte) * 1000n / (tutto < 0n ? -tutto : tutto)) / 10;
  return `<div style="height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:0.3rem">
    <i style="display:block;height:100%;width:${Math.min(q, 100).toFixed(1)}%;background:${colore}"></i></div>`;
}

/**
 * Uscite classificate come spesa che hanno una gemella in entrata su un altro
 * conto: candidate a essere trasferimenti, non spese.
 *
 * Il caso vero: una carta ricarica un portafoglio, che ricarica un'altra
 * carta. Ogni anello ha lo stesso importo. Se un anello qualsiasi resta
 * «spesa», il denaro compare due volte — e con tre anelli, tre volte.
 */
function possibiliTrasferimenti(movimenti) {
  const PATRIMONIALI = new Set(["asset_cash", "liability_credit"]);
  const gamba = (t, verso) => (indice.perMovimento.get(t.id) ?? []).find((s) => {
    const c = indice.perConto.get(s.account_id);
    return c && PATRIMONIALI.has(c.kind) &&
      (verso === "uscita" ? BigInt(s.amount_minor) < 0n : BigInt(s.amount_minor) > 0n);
  });
  const giorno = (d) => Date.parse(d + "T00:00:00Z") / 86400000;

  // Le entrate, indicizzate per importo: senza indice sarebbero milioni di
  // confronti e la pagina si bloccherebbe.
  const perImporto = new Map();
  for (const t of movimenti) {
    const e = gamba(t, "entrata");
    if (!e) continue;
    const k = e.amount_minor;
    if (!perImporto.has(k)) perImporto.set(k, []);
    perImporto.get(k).push({ t, conto: indice.perConto.get(e.account_id) });
  }

  const fuori = [];
  for (const t of movimenti) {
    if (t.event_type !== "expense") continue;
    const u = gamba(t, "uscita");
    if (!u) continue;
    const importo = -BigInt(u.amount_minor);
    const contoUscita = indice.perConto.get(u.account_id);
    const gemelle = (perImporto.get(importo.toString()) ?? []).filter((x) =>
      x.conto?.id !== contoUscita?.id &&
      Math.abs(giorno(x.t.economic_date) - giorno(t.economic_date)) <= 6);
    if (!gemelle.length) continue;
    fuori.push({ t, importo, da: contoUscita?.name ?? "—",
      a: gemelle[0].conto?.name ?? "—", quando: gemelle[0].t.economic_date });
  }
  return fuori.sort((a, b) => b.importo > a.importo ? 1 : -1);
}

/* ── Il periodo che si sta guardando ────────────────────────────────────────
   Un totale senza un periodo non vuol dire niente, e «tutto lo storico» è il
   periodo meno utile di tutti: mette insieme il 2020 e il mese scorso e ne fa
   una media che non è successa mai.

   Quindi il periodo è la prima cosa della pagina, si sceglie con un dito, e
   ogni periodo porta con sé il PRECEDENTE della stessa lunghezza — perché la
   domanda vera non è «quanto ho speso», è «quanto ho speso rispetto a prima».
   ─────────────────────────────────────────────────────────────────────────── */

let periodoAnalisi = "12m";

const primoDi = (d) => d.toISOString().slice(0, 10);

function risolviPeriodo(chiave, ultimo) {
  const fine = new Date(ultimo + "T00:00:00Z");
  if (chiave === "tutto")
    return { dal: null, al: null, nome: "Tutto lo storico", prec: null };

  if (/^\d{4}$/.test(chiave)) {
    const p = String(Number(chiave) - 1);
    return { dal: `${chiave}-01-01`, al: `${chiave}-12-31`, nome: `Anno ${chiave}`,
             prec: { dal: `${p}-01-01`, al: `${p}-12-31`, nome: `il ${p}` } };
  }
  if (chiave === "ytd") {
    const a = fine.getUTCFullYear();
    const giorni = Math.round((fine - new Date(Date.UTC(a, 0, 1))) / 86400000);
    const finePrec = new Date(Date.UTC(a - 1, fine.getUTCMonth(), fine.getUTCDate()));
    return { dal: `${a}-01-01`, al: ultimo, nome: `${a}, da gennaio`,
             prec: { dal: `${a - 1}-01-01`, al: primoDi(finePrec),
                     nome: `gli stessi ${giorni} giorni del ${a - 1}` } };
  }
  const mesi = Number(chiave.replace("m", "")) || 12;
  const inizio = new Date(Date.UTC(fine.getUTCFullYear(), fine.getUTCMonth() - mesi + 1, 1));
  const finePrec = new Date(Date.UTC(inizio.getUTCFullYear(), inizio.getUTCMonth(), 0));
  const inizioPrec = new Date(Date.UTC(finePrec.getUTCFullYear(), finePrec.getUTCMonth() - mesi + 1, 1));
  return { dal: primoDi(inizio), al: ultimo,
           nome: mesi === 1 ? "Ultimo mese" : `Ultimi ${mesi} mesi`,
           prec: { dal: primoDi(inizioPrec), al: primoDi(finePrec), nome: `i ${mesi} mesi prima` } };
}

/* ── Un giro solo sui dati ──────────────────────────────────────────────────
   Ogni domanda di questa pagina — quanto è uscito, per che cosa, in che mese,
   da chi è arrivato — si risponde con la stessa passeggiata sulle scritture.
   Farne una per domanda voleva dire attraversare trentacinquemila righe sei
   volte per disegnare una pagina sola.
   ─────────────────────────────────────────────────────────────────────────── */
function aggrega(dal, al) {
  const dentro = (d) => (!dal || d >= dal) && (!al || d <= al);
  const spese = new Map(), entrate = new Map(), mesi = new Map();
  const daChi = new Map(), aChi = new Map();
  const interni = new Map();
  let speso = 0n, incassato = 0n, nInterni = 0, n = 0;

  for (const t of dati.movimenti) {
    if (!dentro(t.economic_date)) continue;
    n++;
    const mese = t.economic_date.slice(0, 7);
    if (!mesi.has(mese)) mesi.set(mese, { entrate: 0n, uscite: 0n });
    const m = mesi.get(mese);

    let qSpesa = 0n, qEntrata = 0n;
    for (const s of (indice.perMovimento.get(t.id) ?? [])) {
      const c = indice.perConto.get(s.account_id);
      if (!c) continue;
      const v = BigInt(s.amount_minor);
      if (c.kind === "expense") {
        const k = c.category || c.name;
        spese.set(k, (spese.get(k) ?? 0n) + v);
        qSpesa += v;
      } else if (c.kind === "income") {
        const k = c.category || c.name;
        entrate.set(k, (entrate.get(k) ?? 0n) - v);
        qEntrata -= v;
      }
    }
    speso += qSpesa; incassato += qEntrata;
    m.uscite += qSpesa; m.entrate += qEntrata;

    /* Chi ti paga e a chi paghi. Sono due elenchi diversi e vanno tenuti
       separati: il nome del negozio non è il nome di chi ti fa un bonifico. */
    if (qEntrata > 0n) {
      const k = mittenteDi(t.description);
      if (!daChi.has(k)) daChi.set(k, { n: 0, tot: 0n, ultima: t.economic_date });
      const x = daChi.get(k); x.n++; x.tot += qEntrata;
      if (t.economic_date > x.ultima) x.ultima = t.economic_date;
    }
    if (qSpesa > 0n) {
      const k = nomeControparte(t.description);
      if (!aChi.has(k)) aChi.set(k, { n: 0, tot: 0n, ultima: t.economic_date });
      const x = aChi.get(k); x.n++; x.tot += qSpesa;
      if (t.economic_date > x.ultima) x.ultima = t.economic_date;
    }

    if (!ECONOMICI.has(t.event_type)) {
      nInterni++;
      const k = EVENTO[t.event_type]?.nome ?? t.event_type;
      const q = (indice.perMovimento.get(t.id) ?? [])
        .filter((s) => BigInt(s.amount_minor) < 0n)
        .reduce((a, s) => a - BigInt(s.amount_minor), 0n);
      if (!interni.has(k)) interni.set(k, { n: 0, tot: 0n });
      const x = interni.get(k); x.n++; x.tot += q;
    }
  }

  const perValore = (m) => [...m.entries()].sort((a, b) => (b[1] > a[1] ? 1 : -1));
  return {
    n, speso, incassato, nInterni,
    spese: perValore(spese), entrate: perValore(entrate),
    interni: [...interni.entries()].sort((a, b) => (b[1].tot > a[1].tot ? 1 : -1)),
    daChi: [...daChi.entries()].sort((a, b) => (b[1].tot > a[1].tot ? 1 : -1)),
    aChi: [...aChi.entries()].sort((a, b) => (b[1].tot > a[1].tot ? 1 : -1)),
    mesi: [...mesi.entries()].sort(),
  };
}

/* Il nome del negozio, ripulito da quello che la banca ci attacca intorno:
   il numero d'ordine, la città, il codice del terminale. Serve a raggruppare
   sette righe «AMAZON EU SARL LUXEMBOURG 0012» sotto un nome solo. */
function nomeControparte(descrizione) {
  let t = descrizione.split(" — ")[0];
  t = t.replace(/\b\d{6,}\b/g, " ")
       .replace(/\b(CARTA|OPERAZIONE|POS|PAGAMENTO|ADDEBITO|ADUE|COD\.?|DISP\.?|NR\.?|N\.)\b/gi, " ")
       .replace(/[*#]+/g, " ").replace(/\s+/g, " ").trim();
  return (t || descrizione).slice(0, 40) || "senza descrizione";
}

  "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const meseLungo = (m) => `${MESI_LUNGHI[Number(m.split("-")[1]) - 1]} ${m.slice(0, 4)}`;

        <div class="scorri"><table class="confronto">

          <tbody>${(() => {

            return righe.map((r) => `<tr data-vai="categoria:${esc(r.k)}" style="cursor:pointer">

              <td>${formattaCentesimi(r.prima)}</td>
              <td>${formattaCentesimi(r.ora)}</td>
              <td class="var">${chipDelta(r.ora, r.prima, { comeCosa: P.prec.nome })}</td></tr>`).join("");

        </table></div>
        <div class="note">Le dodici categorie che si sono mosse di più, in valore assoluto.

    ${sezione("Da dove sono arrivati", `${a.daChi.length} mittenti`)}
    ${a.daChi.length ? `<div class="card">

      const movimenti = dati.movimenti.filter((t) =>

async function impronta(file) {
  const buf = await file.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

let cartellaLocale = null;

async function caricaFile(elenco) {
  const box = document.getElementById("esito-carica");
  const files = [...elenco].filter((f) => f.size > 0);
  if (!files.length) return;

  box.innerHTML = `<div class="card"><h3>Caricamento</h3>
    <p id="carica-stato">Preparazione…</p>
    <div class="riga-progresso"><i id="carica-barra"></i></div></div>`;
  const stato = document.getElementById("carica-stato");
  const barra = document.getElementById("carica-barra");

  // Un lotto per ogni caricamento: serve a poterlo annullare per intero.
  const idLotto = crypto.randomUUID();
  await scrivi("import_batch", [{
    id: idLotto, owner: sessione.utente.id, state: "uploading",
    file_count: files.length, note: `Caricamento dall'app, ${files.length} file`,
  }], { fondi: false });

  // Indice per contenuto, non per nome. Un documento gia' conosciuto
  // dall'analisi esiste in banca dati ma senza i byte: in quel caso il
  // caricamento non va saltato, va AGGANCIATO alla riga che c'e' gia'.
  // Saltare, come faceva prima, lasciava il documento senza il suo file.
  const noti = new Map(dati.file.map((f) => [f.content_hash, f]));
  let caricati = 0, agganciati = 0, saltati = 0, falliti = [];

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    stato.textContent = `${i + 1} di ${files.length} — ${f.name}`;
    barra.style.width = `${((i) / files.length) * 100}%`;
    try {
      const hash = await impronta(f);
      const gia = noti.get(hash);
      if (gia?.storage_path) { saltati++; continue; }

      const nome = f.name.replace(/[^\p{L}\p{N}._ -]/gu, "_");
      const percorso = `${sessione.utente.id}/${idLotto}/${hash.slice(0, 12)}-${nome}`;

      const r = await chiama(`/storage/v1/object/${BUCKET}/${percorso}`, {
        method: "POST",
        headers: { "content-type": f.type || "application/octet-stream", "x-upsert": "true" },
        body: f,
      });
      if (!r.ok) throw new Error((await r.text()).slice(0, 200));

      if (gia) {
        await modifica("source_file", `id=eq.${gia.id}`,
          { storage_path: percorso, byte_length: f.size });
        gia.storage_path = percorso;
        agganciati++;
      } else {
        const id = crypto.randomUUID();
        await scrivi("source_file", [{
          id, owner: sessione.utente.id, batch_id: idLotto,
          display_name: f.name, byte_length: f.size, content_hash: hash,
          normalized_hash: null, page_count: 0, storage_path: percorso, state: "queued",
        }], { fondi: false });
        noti.set(hash, { id, content_hash: hash, storage_path: percorso });
        caricati++;
      }

      if (cartellaLocale) await scriviInCartella(f);
    } catch (e) {
      falliti.push(`${f.name}: ${e.message}`);
    }
  }

  barra.style.width = "100%";
  await scrivi("import_batch", [{
    id: idLotto, owner: sessione.utente.id,
    state: falliti.length ? "completed_with_warnings" : "completed",
    finished_at: new Date().toISOString(), file_count: files.length,
    note: `${caricati} nuovi, ${agganciati} agganciati, ${saltati} già completi, ${falliti.length} non riusciti`,
  }]);
  await traccia("batch.upload", "import_batch", idLotto,
    `${caricati} nuovi, ${agganciati} agganciati a documenti già noti`);

  const pezzi = [];
  if (caricati) pezzi.push(`${caricati} nuov${caricati === 1 ? "o" : "i"}`);
  if (agganciati) pezzi.push(`${agganciati} agganciat${agganciati === 1 ? "o" : "i"} a documenti già noti`);
  if (saltati) pezzi.push(`${saltati} già in archivio`);

  box.innerHTML = `
    <div class="avviso ok">${pezzi.length ? pezzi.join(", ") : "niente da fare"}.</div>
    ${falliti.length ? `<div class="avviso err">${falliti.length} non riuscit${falliti.length === 1 ? "o" : "i"}:<br>${
      falliti.slice(0, 5).map(esc).join("<br>")}</div>` : ""}
    <div class="card"><div class="note risk">I file sono in archivio ma non ancora letti: l'estrazione dei
    movimenti è la fase successiva. Non spariscono, restano in attesa.</div></div>`;

  await ricarica();
  disegnaTabs(pagina());
}

async function scriviInCartella(file) {
  try {
    const h = await cartellaLocale.getFileHandle(file.name, { create: true });
    const w = await h.createWritable();
    await w.write(await file.arrayBuffer());
    await w.close();
  } catch { /* la copia locale è un di più: se non riesce, il caricamento vale comunque */ }
}

async function importaAnalisi(file) {
  const box = document.getElementById("esito-analisi");
  box.innerHTML = `<div class="card"><p id="imp-stato">Lettura del file…</p>
    <div class="riga-progresso"><i id="imp-barra"></i></div></div>`;
  const stato = document.getElementById("imp-stato");
  const barra = document.getElementById("imp-barra");

  try {
    const contenuto = JSON.parse(await file.text());
    if (contenuto.versione !== 1 || !contenuto.ordine) throw new Error("Il file non ha il formato atteso.");

    const CONFLITTI = { document_relationship: "owner,document_id,relationship_id",
                        transaction_link: "owner,from_id,to_id,kind",
                        /* Una controparte è identificata dalla sua chiave: ricaricare
                           lo stesso file aggiorna la riga, non ne crea una seconda. */
                        controparte: "owner,chiave" };
    const totale = contenuto.ordine.length;
    let righeTotali = 0;

    for (let i = 0; i < totale; i++) {
      const tabella = contenuto.ordine[i];
      /* PostgREST rifiuta un lotto in cui le righe non hanno tutte gli stessi
         campi. Il file omette i campi vuoti per non pesare: qui si rimettono,
         a null, prima di spedirlo. */
      /* Il file omette cio' che si ricava da solo: le tre date che ripetono
         la data economica, il perimetro, la chiave di idempotenza. */
      /* Una tabella può arrivare in forma compatta: l'intestazione una volta
         sola e poi solo i valori. Serve a non spedire trentaduemila copie dei
         nomi delle colonne. */
      const dato = contenuto.tabelle[tabella] ?? [];
      const elenco = Array.isArray(dato) ? dato
        : dato.righe.map((v) => {
            const o = { ...(dato.impliciti ?? {}) };
            dato.colonne.forEach((c, i) => { o[c] = v[i]; });
            return o;
          });
      const grezze = elenco.map((r) => {
        const x = { ...r, owner: sessione.utente.id };
        if (tabella === "ledger_transaction") {
          x.cash_date ??= x.economic_date;
          x.booking_date ??= x.economic_date;
          x.value_date ??= x.economic_date;
          x.perimeter ??= "verified";
          x.idempotency_key ??= x.id;
        }
        return x;
      });
      const chiavi = new Set();
      for (const r of grezze) for (const k of Object.keys(r)) chiavi.add(k);
      const righe = grezze.map((r) => {
        const piena = {};
        for (const k of chiavi) piena[k] = r[k] === undefined ? null : r[k];
        return piena;
      });
      stato.textContent = `${tabella} — ${righe.length} righe`;
      barra.style.width = `${(i / totale) * 100}%`;
      righeTotali += await scrivi(tabella, righe, { fondi: true, conflitto: CONFLITTI[tabella] ?? "" });
    }

    // Gli esiti di lettura non sono righe nuove: aggiornano i file che ci sono
    // gia'. Vanno applicati per gruppi, altrimenti sono centinaia di chiamate.
    if (Array.isArray(contenuto.esiti_lettura) && contenuto.esiti_lettura.length) {
      stato.textContent = `esiti di lettura — ${contenuto.esiti_lettura.length} documenti`;
      const gruppi = new Map();
      for (const e of contenuto.esiti_lettura) {
        const k = `${e.esito}|${e.layout ?? ""}`;
        if (!gruppi.has(k)) gruppi.set(k, []);
        gruppi.get(k).push(e.impronta);
      }
      for (const [k, impronte] of gruppi) {
        const [esito, layout] = k.split("|");
        for (let i = 0; i < impronte.length; i += 100) {
          const lista = impronte.slice(i, i + 100).map((h) => `"${h}"`).join(",");
          await modifica("source_file", `content_hash=in.(${lista})`,
            { read_outcome: esito, read_note: layout || null });
        }
      }
    }

    barra.style.width = "100%";
    await traccia("import.snapshot", "import_batch", "analisi-iniziale", `${righeTotali} righe importate`);
    box.innerHTML = `<div class="avviso ok">Importate ${righeTotali} righe.</div>`;
    await ricarica();
    setTimeout(() => { location.hash = "#/"; disegna(); }, 800);
  } catch (e) {
    box.innerHTML = `<div class="avviso err">${esc(e.message)}</div>`;
  }
}

async function esci() {
  if (!confirm("Uscire e cancellare ogni traccia dell'app da questo dispositivo?")) return;
  try { await chiama("/auth/v1/logout", { method: "POST" }); } catch { /* la sessione va chiusa comunque */ }
  salvaSessione(null);
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    reg?.active?.postMessage("cp:logout");
  } catch { /* nessun service worker: niente da svuotare */ }
  try { localStorage.clear(); sessionStorage.clear(); } catch { /* modalità privata */ }
  location.hash = "";
  location.reload();
}

const percorso = () => location.hash.replace(/^#\/?/, "").split("/");
const pagina = () => percorso()[0] || "";

function disegna() {
  const [p, arg] = percorso();
  // La scheda di dettaglio resta sotto la linguetta «Rapporti».
  disegnaTabs(p === "rapporto" ? "rapporti" : (p || ""));
  const main = document.getElementById("pagina");
  const corpi = {
    "": paginaSituazione, rapporti: paginaRapporti, analisi: paginaAnalisi,
    movimenti: paginaMovimenti, solleciti: paginaSolleciti, letture: paginaLetture,
    documenti: paginaDocumenti, carica: paginaCarica, impostazioni: paginaImpostazioni,
  };
  main.innerHTML = p === "rapporto" ? paginaRapporto(arg) : (corpi[p] ?? paginaSituazione)();
  window.scrollTo(0, 0);
  collega(p, arg);
}

      bParola.disabled = true; bParola.textContent = "Salvo…";
      try {
        const r = await chiama("/auth/v1/user", { method: "PUT",

        document.getElementById("imp-parola2").value = "";

          await modifica("ledger_account", `id=eq.${c.id}`, { alias: nuovo });
          c.alias = nuovo; cambiati++;
        }
        box.innerHTML = cambiati
          ? `<div class="avviso ok">${cambiati} nom${cambiati === 1 ? "e" : "i"} aggiornat${cambiati === 1 ? "o" : "i"}.</div>`
          : `<div class="note">Non è cambiato niente.</div>`;

    const parti = box.querySelector(".parti");

      d.querySelector(".p-importo").focus();

    parti.addEventListener("click", (e) => {
      if (!e.target.classList.contains("p-togli")) return;
      e.preventDefault();
      e.target.closest(".parte").remove();
      aggiornaResto();
    });

    box.querySelector(".a-salva").onclick = () => salvaAnnotazione(box);
    const via = box.querySelector(".a-cancella");
    if (via) via.onclick = () => togliAnnotazione(box);
  }

  if (p === "letture") {

      b.onclick = () => chiediRielaborazione(b.dataset.rielabora);
    for (const b of document.querySelectorAll("[data-archivia]"))
      b.onclick = () => archiviaDocumento(b.dataset.archivia);
    for (const b of document.querySelectorAll("[data-riprendi]"))
      b.onclick = () => archiviaDocumento(b.dataset.riprendi, true);
    const copia = document.getElementById("copia-richiesta");
    if (copia) copia.onclick = async () => {

      catch { t.select(); copia.textContent = "Selezionata: copiala con ctrl+C."; }

  if (p === "rapporti") {
    const aggiorna = (campo) => (e) => { filtroRap[campo] = e.target.value; disegna(); };
    document.getElementById("f-istituto").onchange = aggiorna("istituto");
    document.getElementById("f-genere").onchange = aggiorna("genere");
    document.getElementById("f-stato").onchange = aggiorna("stato");
    const cerca = document.getElementById("f-cerca");
    let attesa;
    cerca.oninput = (e) => {
      clearTimeout(attesa);
      const v = e.target.value;
      attesa = setTimeout(() => {
        filtroRap.cerca = v;
        disegna();
        const c = document.getElementById("f-cerca");
        c.focus(); c.setSelectionRange(v.length, v.length);

  if (p === "carica") {

    const input = document.getElementById("input-file");
    document.getElementById("scegli").onclick = () => input.click();
    input.onchange = () => caricaFile(input.files);

       sedicimila movimenti. */
