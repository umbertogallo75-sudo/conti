/* ── Analisi ────────────────────────────────────────────────────────────────
   Le domande che uno si fa davvero: dove sono finiti i soldi, da dove sono
   arrivati, quanto si è mosso soltanto da una tasca all'altra.
   Ogni riga porta ai movimenti che la compongono: nessun totale resta
   un numero di cui fidarsi sulla parola.
   ─────────────────────────────────────────────────────────────────────────── */

let annoAnalisi = "";

const saldoConto = (idConto, filtro = () => true) => dati.scritture
  .filter((s) => s.account_id === idConto && filtro(s))
  .reduce((t, s) => t + BigInt(s.amount_minor), 0n);

/** Il mittente di un accredito, quando il documento lo dichiara. */
function mittenteDi(descrizione) {
  const m = descrizione.match(/MITT\.?:\s*(.+?)(?:\s+COD[.\s]|\s+\d{10,}|\s+—|$)/i);
  if (m) return m[1].trim().replace(/\s+/g, " ").slice(0, 44);
  const d = descrizione.match(/disposto da:\s*—?\s*(.+?)(?:\s+COD|\s+\d{6,}|$)/i);
  return d ? d[1].trim().slice(0, 44) : "senza mittente dichiarato";
}

function barra(parte, tutto, colore = "var(--accent)") {
  const q = tutto === 0n ? 0 : Number((parte < 0n ? -parte : parte) * 1000n / (tutto < 0n ? -tutto : tutto)) / 10;
  return `<div style="height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:0.3rem">
    <i style="display:block;height:100%;width:${Math.min(q, 100).toFixed(1)}%;background:${colore}"></i></div>`;
}

/**
 * Uscite classificate come spesa che hanno una gemella in entrata su un altro
 * conto: candidate a essere trasferimenti, non spese.
 *
 * Il caso vero: una carta ricarica un portafoglio, che ricarica un'altra
 * carta. Ogni anello ha lo stesso importo. Se un anello qualsiasi resta
 * «spesa», il denaro compare due volte — e con tre anelli, tre volte.
 */
function possibiliTrasferimenti(movimenti) {
  const PATRIMONIALI = new Set(["asset_cash", "liability_credit"]);
  const gamba = (t, verso) => (indice.perMovimento.get(t.id) ?? []).find((s) => {
    const c = indice.perConto.get(s.account_id);
    return c && PATRIMONIALI.has(c.kind) &&
      (verso === "uscita" ? BigInt(s.amount_minor) < 0n : BigInt(s.amount_minor) > 0n);
  });
  const giorno = (d) => Date.parse(d + "T00:00:00Z") / 86400000;

  // Le entrate, indicizzate per importo: senza indice sarebbero milioni di
  // confronti e la pagina si bloccherebbe.
  const perImporto = new Map();
  for (const t of movimenti) {
    const e = gamba(t, "entrata");
    if (!e) continue;
    const k = e.amount_minor;
    if (!perImporto.has(k)) perImporto.set(k, []);
    perImporto.get(k).push({ t, conto: indice.perConto.get(e.account_id) });
  }

  const fuori = [];
  for (const t of movimenti) {
    if (t.event_type !== "expense") continue;
    const u = gamba(t, "uscita");
    if (!u) continue;
    const importo = -BigInt(u.amount_minor);
    const contoUscita = indice.perConto.get(u.account_id);
    const gemelle = (perImporto.get(importo.toString()) ?? []).filter((x) =>
      x.conto?.id !== contoUscita?.id &&
      Math.abs(giorno(x.t.economic_date) - giorno(t.economic_date)) <= 6);
    if (!gemelle.length) continue;
    fuori.push({ t, importo, da: contoUscita?.name ?? "—",
      a: gemelle[0].conto?.name ?? "—", quando: gemelle[0].t.economic_date });
  }
  return fuori.sort((a, b) => b.importo > a.importo ? 1 : -1);
}

function paginaAnalisi() {
  if (!dati.movimenti.length) {
    return `<h2>Analisi</h2>${vuoto("Non ci sono ancora movimenti da analizzare.")}`;
  }

  const anni = [...new Set(dati.movimenti.map((m) => m.economic_date.slice(0, 4)))].sort().reverse();
  const nelPeriodo = (t) => !annoAnalisi || t.economic_date.startsWith(annoAnalisi);
  const movimenti = dati.movimenti.filter(nelPeriodo);
  const idsPeriodo = new Set(movimenti.map((m) => m.id));
  const scritturePeriodo = dati.scritture.filter((s) => idsPeriodo.has(s.transaction_id));

  const perGenere = (kind) => {
    const m = new Map();
    for (const s of scritturePeriodo) {
      const c = indice.perConto.get(s.account_id);
      if (c?.kind !== kind) continue;
      const k = c.category || c.name;
      m.set(k, (m.get(k) ?? 0n) + BigInt(s.amount_minor));
    }
    return [...m.entries()].sort((a, b) => (a[1] < 0n ? -a[1] : a[1]) > (b[1] < 0n ? -b[1] : b[1]) ? -1 : 1);
  };

  const spesePerCat = perGenere("expense");
  const entratePerCat = perGenere("income").map(([k, v]) => [k, -v]);
  const speseTot = spesePerCat.reduce((t, [, v]) => t + v, 0n);
  const entrateTot = entratePerCat.reduce((t, [, v]) => t + v, 0n);

  // Le entrate, una per una, raggruppate per chi le ha mandate.
  const perMittente = new Map();
  for (const t of movimenti.filter((x) => x.event_type === "income")) {
    const q = (indice.perMovimento.get(t.id) ?? [])
      .filter((s) => indice.perConto.get(s.account_id)?.kind === "income")
      .reduce((a, s) => a - BigInt(s.amount_minor), 0n);
    if (q === 0n) continue;
    const k = mittenteDi(t.description);
    if (!perMittente.has(k)) perMittente.set(k, { n: 0, tot: 0n, ultima: t.economic_date });
    const x = perMittente.get(k);
    x.n++; x.tot += q;
    if (t.economic_date > x.ultima) x.ultima = t.economic_date;
  }
  const mittenti = [...perMittente.entries()].sort((a, b) => b[1].tot > a[1].tot ? 1 : -1);

  // Quanto si è soltanto spostato, senza essere né speso né incassato.
  const interni = movimenti.filter((t) => !ECONOMICI.has(t.event_type));
  const perTipoInterno = new Map();
  for (const t of interni) {
    const q = (indice.perMovimento.get(t.id) ?? [])
      .filter((s) => BigInt(s.amount_minor) < 0n)
      .reduce((a, s) => a - BigInt(s.amount_minor), 0n);
    const k = EVENTO[t.event_type]?.nome ?? t.event_type;
    if (!perTipoInterno.has(k)) perTipoInterno.set(k, { n: 0, tot: 0n });
    const x = perTipoInterno.get(k); x.n++; x.tot += q;
  }

  const patrimoniali = dati.conti.filter((c) => ["asset_cash", "liability_credit"].includes(c.kind));
  const sospeso = dati.conti.find((c) => c.kind === "suspense");

  return `
    <div class="card">
      <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
        <span style="font-size:0.86rem;color:var(--muted)">Periodo</span>
        <select id="a-anno" style="flex:0 0 130px">
          <option value="">Tutto</option>
          ${anni.map((a) => `<option value="${esc(a)}"${annoAnalisi === a ? " selected" : ""}>${esc(a)}</option>`).join("")}
        </select>
        <span class="meta" style="margin:0"><span>${movimenti.length} movimenti</span></span>
      </div>
    </div>

    <div class="tiles">
      <a class="tile" href="#/movimenti" data-vai="evento:expense">
        <div class="v">${formattaCentesimi(speseTot).replace(" €", "")}</div><div class="k">speso</div></a>
      <a class="tile" href="#/movimenti" data-vai="evento:income">
        <div class="v">${formattaCentesimi(entrateTot).replace(" €", "")}</div><div class="k">incassato</div></a>
      <div class="tile"><div class="v">${formattaCentesimi(entrateTot - speseTot).replace(" €", "")}</div>
        <div class="k">differenza</div></div>
      <div class="tile"><div class="v">${interni.length}</div><div class="k">giri interni</div></div>
    </div>

    <h2>Dove sono finiti i soldi <span class="sub">${spesePerCat.length} categorie</span></h2>
    ${spesePerCat.length ? spesePerCat.map(([cat, v]) => `
      <div class="card" data-vai="categoria:${esc(cat)}" style="cursor:pointer">
        <h3 style="justify-content:space-between">
          <span>${esc(cat)}</span>
          <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(v)}</span></h3>
        ${barra(v, speseTot, "var(--stop)")}
        <div class="meta"><span>${speseTot === 0n ? "0" : (Number(v * 1000n / speseTot) / 10).toFixed(1)}% del totale</span>
          <span>apri i movimenti</span></div>
      </div>`).join("") : vuoto("Nessuna spesa nel periodo.")}

    <h2>Da dove sono arrivati <span class="sub">${mittenti.length} mittenti</span></h2>
    ${entratePerCat.length ? `<div class="card">
      <div class="meta">${entratePerCat.map(([k, v]) =>
        `<span>${esc(k)}: <strong>${formattaCentesimi(v)}</strong></span>`).join("")}</div>
    </div>` : ""}
    ${mittenti.length ? mittenti.slice(0, 40).map(([chi, x]) => `
      <div class="card" data-vai="cerca:${esc(chi.slice(0, 22))}" style="cursor:pointer">
        <h3 style="justify-content:space-between">
          <span>${esc(chi)}</span>
          <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(x.tot)}</span></h3>
        ${barra(x.tot, entrateTot, "var(--ok)")}
        <div class="meta"><span>${x.n} accredit${x.n === 1 ? "o" : "i"}</span>
          <span>ultimo il ${dataBreve(x.ultima)}</span>
          <span>${entrateTot === 0n ? "0" : (Number(x.tot * 1000n / entrateTot) / 10).toFixed(1)}%</span></div>
      </div>`).join("") : vuoto("Nessun accredito nel periodo.")}
    ${mittenti.length > 40 ? `<div class="note">Mostrati i primi 40 di ${mittenti.length}.</div>` : ""}

    <h2>Quanto si è solo spostato <span class="sub">non è né speso né incassato</span></h2>
    <div class="card">
      <div class="scorri"><table class="dati">
        <thead><tr><th>Tipo</th><th class="num">Quante volte</th><th class="num">Importo</th></tr></thead>
        <tbody>${[...perTipoInterno.entries()].sort((a, b) => b[1].tot > a[1].tot ? 1 : -1).map(([k, x]) =>
          `<tr><td>${esc(k)}</td><td class="num">${x.n}</td><td class="num">${formattaCentesimi(x.tot)}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="note proof">Questi importi non compaiono nelle spese, ed è voluto: sono lo stesso denaro
      visto due volte. Se comparissero, la spesa risulterebbe più che raddoppiata.</div>
    </div>

    ${(() => {
      /* Le uscite che potrebbero non essere spese ma trasferimenti.
         Una ricarica di una carta con un'altra carta, o di un portafoglio
         con una carta, appare come uscita da una parte e entrata dall'altra:
         lo STESSO importo, a pochi giorni. Se l'uscita resta classificata
         come spesa, quel denaro viene contato due volte.
         Il sistema NON decide da solo: propone, e la conferma è tua. Una
         fusione sbagliata fa più danno di una mancata. */
      const sospetti = possibiliTrasferimenti(movimenti);
      if (!sospetti.length) return "";
      const tot = sospetti.reduce((s, x) => s + x.importo, 0n);
      return `
        <h2>Potrebbero non essere spese <span class="sub">${sospetti.length} da verificare</span></h2>
        <div class="card">
          <p>Queste uscite hanno, entro pochi giorni, un'entrata di <strong>importo identico</strong>

          di una carta con un'altra carta, o di un portafoglio.</p>
          <div class="meta"><span>valore complessivo <strong>${formattaCentesimi(tot)}</strong></span>
            <span>${speseTot === 0n ? "0" : (Number(tot * 1000n / speseTot) / 10).toFixed(2)}% delle spese</span></div>
          <div class="note risk">Non le ho riclassificate da sola: un importo uguale a pochi giorni di
          distanza è un indizio, non una prova. Una commissione di 0,80 € che coincide con un movimento
          di 0,80 € su PayPal resta una commissione.</div>
        </div>
        ${sospetti.slice(0, 25).map((x) => `
          <div class="card" data-vai="cerca:${esc(x.t.description.slice(0, 20))}" style="cursor:pointer">
            <h3 style="justify-content:space-between">
              <span>${esc(x.t.description.slice(0, 70))}</span>
              <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(x.importo)}</span></h3>
            <div class="meta">
              <span>${dataBreve(x.t.economic_date)}</span>
              <span>${esc(x.da)} → ${esc(x.a)}</span>
              <span>entrata il ${dataBreve(x.quando)}</span>
            </div>
          </div>`).join("")}
        ${sospetti.length > 25 ? `<div class="note">Mostrati i primi 25 di ${sospetti.length}.</div>` : ""}
      `;
    })()}

    <h2>I conti e le carte</h2>
    ${patrimoniali.map((c) => {
      const saldo = saldoConto(c.id);
      const suoi = dati.scritture.filter((s) => s.account_id === c.id).length;
      return `<div class="card" data-vai="conto:${esc(c.id)}" style="cursor:pointer">
        <h3 style="justify-content:space-between">
          <span>${esc(nomeConto(c))}</span>
          <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(saldo)}</span></h3>
        <div class="meta">
          ${c.alias ? `<span>${esc(c.name)}</span>` : ""}
          <span>${esc(c.kind === "liability_credit" ? "debito di carta" : "liquidità")}</span>
          <span>${suoi} movimenti</span>
          <span>apri</span></div>
      </div>`;
    }).join("")}

    ${sospeso ? `
      <h2>Da attribuire <span class="sub">quello che manca per chiudere il cerchio</span></h2>
      <div class="card" data-vai="conto:${esc(sospeso.id)}" style="cursor:pointer">
        <h3 style="justify-content:space-between"><span>Denaro uscito verso conti di cui non ho i documenti</span>
          <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(saldoConto(sospeso.id))}</span></h3>
        <div class="note risk">Non è spesa e non finge di esserlo. Caricando gli estratti dei conti di
        destinazione — Sella, Wise, Revolut — questa cifra si chiude da sola.</div>
      </div>` : ""}
  `;
}

async function impronta(file) {
  const buf = await file.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

let cartellaLocale = null;

async function caricaFile(elenco) {
  const box = document.getElementById("esito-carica");
  const files = [...elenco].filter((f) => f.size > 0);
  if (!files.length) return;

  box.innerHTML = `<div class="card"><h3>Caricamento</h3>
    <p id="carica-stato">Preparazione…</p>
    <div class="riga-progresso"><i id="carica-barra"></i></div></div>`;
  const stato = document.getElementById("carica-stato");
  const barra = document.getElementById("carica-barra");

  // Un lotto per ogni caricamento: serve a poterlo annullare per intero.
  const idLotto = crypto.randomUUID();
  await scrivi("import_batch", [{
    id: idLotto, owner: sessione.utente.id, state: "uploading",
    file_count: files.length, note: `Caricamento dall'app, ${files.length} file`,
  }], { fondi: false });

  // Indice per contenuto, non per nome. Un documento gia' conosciuto
  // dall'analisi esiste in banca dati ma senza i byte: in quel caso il
  // caricamento non va saltato, va AGGANCIATO alla riga che c'e' gia'.
  // Saltare, come faceva prima, lasciava il documento senza il suo file.
  const noti = new Map(dati.file.map((f) => [f.content_hash, f]));
  let caricati = 0, agganciati = 0, saltati = 0, falliti = [];

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    stato.textContent = `${i + 1} di ${files.length} — ${f.name}`;
    barra.style.width = `${((i) / files.length) * 100}%`;
    try {
      const hash = await impronta(f);
      const gia = noti.get(hash);
      if (gia?.storage_path) { saltati++; continue; }

      const nome = f.name.replace(/[^\p{L}\p{N}._ -]/gu, "_");
      const percorso = `${sessione.utente.id}/${idLotto}/${hash.slice(0, 12)}-${nome}`;

      const r = await chiama(`/storage/v1/object/${BUCKET}/${percorso}`, {
        method: "POST",
        headers: { "content-type": f.type || "application/octet-stream", "x-upsert": "true" },
        body: f,
      });
      if (!r.ok) throw new Error((await r.text()).slice(0, 200));

      if (gia) {
        await modifica("source_file", `id=eq.${gia.id}`,
          { storage_path: percorso, byte_length: f.size });
        gia.storage_path = percorso;
        agganciati++;
      } else {
        const id = crypto.randomUUID();
        await scrivi("source_file", [{
          id, owner: sessione.utente.id, batch_id: idLotto,
          display_name: f.name, byte_length: f.size, content_hash: hash,
          normalized_hash: null, page_count: 0, storage_path: percorso, state: "queued",
        }], { fondi: false });
        noti.set(hash, { id, content_hash: hash, storage_path: percorso });
        caricati++;
      }

      if (cartellaLocale) await scriviInCartella(f);
    } catch (e) {
      falliti.push(`${f.name}: ${e.message}`);
    }
  }

  barra.style.width = "100%";
  await scrivi("import_batch", [{
    id: idLotto, owner: sessione.utente.id,
    state: falliti.length ? "completed_with_warnings" : "completed",
    finished_at: new Date().toISOString(), file_count: files.length,
    note: `${caricati} nuovi, ${agganciati} agganciati, ${saltati} già completi, ${falliti.length} non riusciti`,
  }]);
  await traccia("batch.upload", "import_batch", idLotto,
    `${caricati} nuovi, ${agganciati} agganciati a documenti già noti`);

  const pezzi = [];
  if (caricati) pezzi.push(`${caricati} nuov${caricati === 1 ? "o" : "i"}`);
  if (agganciati) pezzi.push(`${agganciati} agganciat${agganciati === 1 ? "o" : "i"} a documenti già noti`);
  if (saltati) pezzi.push(`${saltati} già in archivio`);

  box.innerHTML = `
    <div class="avviso ok">${pezzi.length ? pezzi.join(", ") : "niente da fare"}.</div>
    ${falliti.length ? `<div class="avviso err">${falliti.length} non riuscit${falliti.length === 1 ? "o" : "i"}:<br>${
      falliti.slice(0, 5).map(esc).join("<br>")}</div>` : ""}
    <div class="card"><div class="note risk">I file sono in archivio ma non ancora letti: l'estrazione dei
    movimenti è la fase successiva. Non spariscono, restano in attesa.</div></div>`;

  await ricarica();
  disegnaTabs(pagina());
}

async function scriviInCartella(file) {
  try {
    const h = await cartellaLocale.getFileHandle(file.name, { create: true });
    const w = await h.createWritable();
    await w.write(await file.arrayBuffer());
    await w.close();
  } catch { /* la copia locale è un di più: se non riesce, il caricamento vale comunque */ }
}

async function importaAnalisi(file) {
  const box = document.getElementById("esito-analisi");
  box.innerHTML = `<div class="card"><p id="imp-stato">Lettura del file…</p>
    <div class="riga-progresso"><i id="imp-barra"></i></div></div>`;
  const stato = document.getElementById("imp-stato");
  const barra = document.getElementById("imp-barra");

  try {
    const contenuto = JSON.parse(await file.text());
    if (contenuto.versione !== 1 || !contenuto.ordine) throw new Error("Il file non ha il formato atteso.");

    const CONFLITTI = { document_relationship: "owner,document_id,relationship_id",
                        transaction_link: "owner,from_id,to_id,kind" };
    const totale = contenuto.ordine.length;
    let righeTotali = 0;

    for (let i = 0; i < totale; i++) {
      const tabella = contenuto.ordine[i];
      /* PostgREST rifiuta un lotto in cui le righe non hanno tutte gli stessi
         campi. Il file omette i campi vuoti per non pesare: qui si rimettono,
         a null, prima di spedirlo. */
      /* Il file omette cio' che si ricava da solo: le tre date che ripetono
         la data economica, il perimetro, la chiave di idempotenza. */
      const grezze = (contenuto.tabelle[tabella] ?? []).map((r) => {
        const x = { ...r, owner: sessione.utente.id };
        if (tabella === "ledger_transaction") {
          x.cash_date ??= x.economic_date;
          x.booking_date ??= x.economic_date;
          x.value_date ??= x.economic_date;
          x.perimeter ??= "verified";
          x.idempotency_key ??= x.id;
        }
        return x;
      });
      const chiavi = new Set();
      for (const r of grezze) for (const k of Object.keys(r)) chiavi.add(k);
      const righe = grezze.map((r) => {
        const piena = {};
        for (const k of chiavi) piena[k] = r[k] === undefined ? null : r[k];
        return piena;
      });
      stato.textContent = `${tabella} — ${righe.length} righe`;
      barra.style.width = `${(i / totale) * 100}%`;
      righeTotali += await scrivi(tabella, righe, { fondi: true, conflitto: CONFLITTI[tabella] ?? "" });
    }

    // Gli esiti di lettura non sono righe nuove: aggiornano i file che ci sono
    // gia'. Vanno applicati per gruppi, altrimenti sono centinaia di chiamate.
    if (Array.isArray(contenuto.esiti_lettura) && contenuto.esiti_lettura.length) {
      stato.textContent = `esiti di lettura — ${contenuto.esiti_lettura.length} documenti`;
      const gruppi = new Map();
      for (const e of contenuto.esiti_lettura) {
        const k = `${e.esito}|${e.layout ?? ""}`;
        if (!gruppi.has(k)) gruppi.set(k, []);
        gruppi.get(k).push(e.impronta);
      }
      for (const [k, impronte] of gruppi) {
        const [esito, layout] = k.split("|");
        for (let i = 0; i < impronte.length; i += 100) {
          const lista = impronte.slice(i, i + 100).map((h) => `"${h}"`).join(",");
          await modifica("source_file", `content_hash=in.(${lista})`,
            { read_outcome: esito, read_note: layout || null });
        }
      }
    }

    barra.style.width = "100%";
    await traccia("import.snapshot", "import_batch", "analisi-iniziale", `${righeTotali} righe importate`);
    box.innerHTML = `<div class="avviso ok">Importate ${righeTotali} righe.</div>`;
    await ricarica();
    setTimeout(() => { location.hash = "#/"; disegna(); }, 800);
  } catch (e) {
    box.innerHTML = `<div class="avviso err">${esc(e.message)}</div>`;
  }
}

async function esci() {
  if (!confirm("Uscire e cancellare ogni traccia dell'app da questo dispositivo?")) return;
  try { await chiama("/auth/v1/logout", { method: "POST" }); } catch { /* la sessione va chiusa comunque */ }
  salvaSessione(null);
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    reg?.active?.postMessage("cp:logout");
  } catch { /* nessun service worker: niente da svuotare */ }
  try { localStorage.clear(); sessionStorage.clear(); } catch { /* modalità privata */ }
  location.hash = "";
  location.reload();
}

/* ═══════════════════════════════════════════════════════════════════════════
   INTERFACCIA
   ═══════════════════════════════════════════════════════════════════════════ */

const percorso = () => location.hash.replace(/^#\/?/, "").split("/");
const pagina = () => percorso()[0] || "";

function disegna() {
  const [p, arg] = percorso();
  // La scheda di dettaglio resta sotto la linguetta «Rapporti».
  disegnaTabs(p === "rapporto" ? "rapporti" : (p || ""));
  const main = document.getElementById("pagina");
  const corpi = {
    "": paginaSituazione, rapporti: paginaRapporti, analisi: paginaAnalisi,
    movimenti: paginaMovimenti, solleciti: paginaSolleciti, letture: paginaLetture,
    documenti: paginaDocumenti, carica: paginaCarica, impostazioni: paginaImpostazioni,
  };
  main.innerHTML = p === "rapporto" ? paginaRapporto(arg) : (corpi[p] ?? paginaSituazione)();
  window.scrollTo(0, 0);
  collega(p, arg);
}

function collega(p, arg) {
  if (p === "impostazioni") {
    const salva = document.getElementById("salva-alias");
    if (salva) salva.onclick = async () => {
      const box = document.getElementById("esito-alias");
      try {
        let cambiati = 0;
        for (const i of document.querySelectorAll("[data-alias]")) {
          const c = dati.conti.find((x) => x.id === i.dataset.alias);
          const nuovo = i.value.trim() || null;
          if (!c || (c.alias ?? null) === nuovo) continue;
          await modifica("ledger_account", `id=eq.${c.id}`, { alias: nuovo });
          c.alias = nuovo; cambiati++;
        }
        box.innerHTML = cambiati
          ? `<div class="avviso ok">${cambiati} nom${cambiati === 1 ? "e" : "i"} aggiornat${cambiati === 1 ? "o" : "i"}.</div>`
          : `<div class="note">Non è cambiato niente.</div>`;
        if (cambiati) await traccia("account.renamed", "ledger_account", "alias", `${cambiati} conti rinominati`);
      } catch (e) { box.innerHTML = `<div class="avviso err">${esc(e.message)}</div>`; }
    };
  }

  if (p === "letture") {
    for (const b of document.querySelectorAll("[data-rielabora]"))
      b.onclick = () => chiediRielaborazione(b.dataset.rielabora);
    for (const b of document.querySelectorAll("[data-archivia]"))
      b.onclick = () => archiviaDocumento(b.dataset.archivia);
    for (const b of document.querySelectorAll("[data-riprendi]"))
      b.onclick = () => archiviaDocumento(b.dataset.riprendi, true);
    const copia = document.getElementById("copia-richiesta");
    if (copia) copia.onclick = async () => {
      const t = document.getElementById("richiesta");
      try { await navigator.clipboard.writeText(t.value); copia.textContent = "Copiata."; }
      catch { t.select(); copia.textContent = "Selezionata: copiala con ctrl+C."; }
    };
  }

  if (p === "rapporti") {
    const aggiorna = (campo) => (e) => { filtroRap[campo] = e.target.value; disegna(); };
    document.getElementById("f-istituto").onchange = aggiorna("istituto");
    document.getElementById("f-genere").onchange = aggiorna("genere");
    document.getElementById("f-stato").onchange = aggiorna("stato");
    const cerca = document.getElementById("f-cerca");
    let attesa;
    cerca.oninput = (e) => {
      clearTimeout(attesa);
      const v = e.target.value;
      attesa = setTimeout(() => {
        filtroRap.cerca = v;
        disegna();
        const c = document.getElementById("f-cerca");
        c.focus(); c.setSelectionRange(v.length, v.length);
      }, 350);
    };
  }

  if (p === "carica") {
    const zona = document.getElementById("zona");
    const input = document.getElementById("input-file");
    document.getElementById("scegli").onclick = () => input.click();
    input.onchange = () => caricaFile(input.files);
    for (const ev of ["dragenter", "dragover"])
      zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add("sopra"); });
    for (const ev of ["dragleave", "drop"])
      zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.remove("sopra"); });
    zona.addEventListener("drop", (e) => { e.preventDefault(); caricaFile(e.dataTransfer.files); });

    const bottone = document.getElementById("scegli-cartella");
    const stato = document.getElementById("stato-cartella");
    if (!window.showDirectoryPicker) {
      bottone.disabled = true;
      stato.textContent = "Questo browser non sa scrivere in una cartella del computer. Su Chrome o Edge da computer funziona.";
    } else {
      if (cartellaLocale) stato.textContent = `Copia attiva nella cartella «${cartellaLocale.name}».`;
      bottone.onclick = async () => {
        try {
          cartellaLocale = await window.showDirectoryPicker({ mode: "readwrite" });
          stato.textContent = `Copia attiva nella cartella «${cartellaLocale.name}». Vale finché la scheda resta aperta.`;
        } catch { /* scelta annullata */ }
      };
    }
  }

  if (p === "analisi") {
    document.getElementById("a-anno").onchange = (e) => { annoAnalisi = e.target.value; disegna(); };
  }

  if (p === "movimenti") {
    const agg = (campo) => (e) => { filtroMov[campo] = e.target.value; apertoMov = null; disegna(); };
    for (const [id, campo] of [["m-conto", "conto"], ["m-evento", "evento"],
                               ["m-categoria", "categoria"], ["m-anno", "anno"]])
      document.getElementById(id).onchange = agg(campo);
    const c = document.getElementById("m-cerca");
    let att;
    c.oninput = (e) => {
      clearTimeout(att);
      const v = e.target.value;
      att = setTimeout(() => {
        filtroMov.cerca = v; apertoMov = null; disegna();
        const q = document.getElementById("m-cerca");
        q.focus(); q.setSelectionRange(v.length, v.length);
      }, 350);
    };
  }

  if (p === "documenti") {
    document.getElementById("filtro-istituto").onchange = (e) => { filtroDoc.istituto = e.target.value; disegna(); };
    document.getElementById("filtro-tipo").onchange = (e) => { filtroDoc.tipo = e.target.value; disegna(); };
  }

  if (p === "impostazioni") {
    document.getElementById("cambia-password").onclick = cambiaPassword;
    document.getElementById("esci").onclick = esci;
    const inp = document.getElementById("input-analisi");
    document.getElementById("scegli-analisi").onclick = () => inp.click();
    inp.onchange = () => inp.files[0] && importaAnalisi(inp.files[0]);
  }

  document.getElementById("pagina").onclick = async (e) => {
    // Dall'analisi ai movimenti che compongono quel numero: un totale che
    // non si può aprire è un totale di cui bisogna fidarsi sulla parola.
    const salto = e.target.closest("[data-vai]");
    if (salto) {
      e.preventDefault();
      const [che, ...resto] = salto.dataset.vai.split(":");
      const valore = resto.join(":");
      filtroMov = { conto: "", evento: "", categoria: "", anno: annoAnalisi, cerca: "" };
      if (che === "conto") filtroMov.conto = valore;
      if (che === "evento") filtroMov.evento = valore;
      if (che === "categoria") filtroMov.categoria = valore;
      if (che === "cerca") filtroMov.cerca = valore;
      apertoMov = null;
      location.hash = "#/movimenti";
      return;
    }

    const scheda = e.target.closest("[data-movimento]");
    if (scheda && !e.target.closest("button")) {
      apertoMov = apertoMov === scheda.dataset.movimento ? null : scheda.dataset.movimento;
      disegna();
      if (apertoMov) document.querySelector(`[data-movimento="${apertoMov}"]`)
        ?.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }

    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;

    if (d.conferma) {
      await modifica("relationship", `id=eq.${d.conferma}`,
        { confirmation: "user_confirmed", updated_at: new Date().toISOString() });
      await modifica("relationship_identifier",
        `relationship_id=eq.${d.conferma}&strength=eq.strong`, { status: "verified" });
      await traccia("relationship.confirm", "relationship", d.conferma, "Confermato dall'intestatario");
      await ricarica(); disegna();
    }
    if (d.rifiuta) {
      if (!confirm("Segnare questo rapporto come non tuo? Resterà in archivio, escluso da tutto il resto.")) return;
      await modifica("relationship", `id=eq.${d.rifiuta}`,
        { confirmation: "rejected", updated_at: new Date().toISOString() });
      await traccia("relationship.reject", "relationship", d.rifiuta, "Non riconosciuto dall'intestatario");
      await ricarica(); disegna();
    }
    if (d.separa) mostraSeparazione(d.separa);
    if (d.unisci) mostraUnione(d.unisci, d.con ?? "");
    if (d.faiUnione) await eseguiUnione(d.faiUnione);
    if (d.rimuoviCarta) await rimuoviCarta(d.rimuoviCarta);
    if (d.estranei) mostraEstranei(d.estranei);
    if (d.archivia) mostraArchiviazione(d.archivia);
    if (d.tipo) mostraCambioTipo(d.tipo);
    if (d.chiudiAzione) box("");
    if (d.faiSeparazione) await eseguiSeparazione(d.faiSeparazione);
    if (d.faiSpostamento) await eseguiSpostamento(d.faiSpostamento);
    if (d.faiArchiviazione) await eseguiArchiviazione(d.faiArchiviazione);
    if (d.faiTipo) await eseguiCambioTipo(d.faiTipo);

    if (d.sostituita) document.getElementById(`modulo-${d.sostituita}`).innerHTML = moduloSostituzione(d.sostituita);
    if (d.annulla) document.getElementById(`modulo-${d.annulla}`).innerHTML = "";
    if (d.salvaSostituzione) await registraSostituzione(d.salvaSostituzione);
    if (d.chiuso) await chiudiRapporto(d.chiuso);
    if (d.caricare) {
      document.getElementById(`modulo-${d.caricare}`).innerHTML =
        `<div class="note proof">Va bene: il sollecito resta finché il documento non arriva.
         Caricalo dalla scheda «Carica» quando ce l'hai.</div>`;
    }
  };
}

function mostraAccesso() {
  document.getElementById("app").hidden = true;
  document.getElementById("accesso").hidden = false;
}

async function mostraApp() {
  document.getElementById("accesso").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("sottotitolo").textContent = sessione.utente.email;
  try {
    await ricarica();
  } catch (e) {
    document.getElementById("pagina").innerHTML =
      `<div class="avviso err">Non riesco a leggere i dati: ${esc(e.message)}</div>`;
    return;
  }
  disegna();
}

document.getElementById("modulo-accesso").onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById("pulsante-accesso");
  const avviso = document.getElementById("accesso-avviso");
  b.disabled = true; b.textContent = "Verifico…"; avviso.innerHTML = "";
  try {
    await autentica(document.getElementById("email").value.trim(),
                    document.getElementById("password").value);
    document.getElementById("password").value = "";
    await mostraApp();
  } catch (err) {
    avviso.innerHTML = `<div class="avviso err">${esc(err.message)}</div>`;
  } finally {
    b.disabled = false; b.textContent = "Entra";
  }
};

document.getElementById("aggiorna").onclick = async () => {
  const b = document.getElementById("aggiorna");
  b.disabled = true; b.textContent = "…";
  try { await ricarica(); disegna(); } catch { /* la pagina resta com'è */ }
  b.disabled = false; b.textContent = "Aggiorna";
};

window.addEventListener("hashchange", () => { if (sessione) disegna(); });

caricaSessione();
if (!sessione) {
  mostraAccesso();
} else if (Date.now() < sessione.scade - 60000) {
  // Il gettone e' ancora buono: non lo si rinnova.
  // Ogni rinnovo consuma quello di ricambio e ne emette uno nuovo; due
  // rinnovi ravvicinati — due schede, un ricaricamento durante il primo —
  // presentano un ricambio gia' speso e la sessione salta. Rinnovare a ogni
  // apertura era proprio il modo di far cadere una sessione valida.
  mostraApp();
} else {
  rinnova().then(mostraApp).catch(mostraAccesso);
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => { /* l'app funziona lo stesso */ });
}
</script>
