<script type="module">
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   CONFIGURAZIONE
   La chiave `anon` è pubblica per costruzione: non è un segreto e non protegge
   nulla. La protezione reale è la row-level security sul database, che lega
   ogni riga all'utenza che ha effettuato l'accesso.
   ═══════════════════════════════════════════════════════════════════════════ */

const BASE = "https://dvkkxqfcxeebqlmtryxi.supabase.co";
const ANON = "sb_publishable_PIvO1WmssAHUXXwy6nmz_w_W_tPxtNG";
const BUCKET = "documenti";
const CHIAVE_SESSIONE = "conti.sessione";

/* ═══════════════════════════════════════════════════════════════════════════
   IMPORTI — mai virgola mobile, mai Intl.NumberFormat
   Intl con it-IT non raggruppa i numeri di quattro cifre: 1234,56 invece di
   1.234,56. Il raggruppamento è fatto a mano. Gli importi arrivano in centesimi
   e restano interi fino alla stampa.
   ═══════════════════════════════════════════════════════════════════════════ */

function formattaCentesimi(centesimi, valuta = "EUR") {
  if (centesimi === null || centesimi === undefined) return "—";
  const n = BigInt(centesimi);
  const negativo = n < 0n;
  const assoluto = negativo ? -n : n;
  const intero = (assoluto / 100n).toString();
  const decimali = (assoluto % 100n).toString().padStart(2, "0");
  let gruppi = "";
  for (let i = 0; i < intero.length; i++) {
    if (i > 0 && (intero.length - i) % 3 === 0) gruppi += ".";
    gruppi += intero[i];
  }
  const simbolo = { EUR: "€", USD: "$", GBP: "£", CNY: "¥" }[valuta] ?? valuta;
  return `${negativo ? "−" : ""}${gruppi},${decimali} ${simbolo}`;
}

const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno",
              "luglio","agosto","settembre","ottobre","novembre","dicembre"];

function dataBreve(iso) {
  if (!iso) return "—";
  const [a, m, g] = iso.slice(0, 10).split("-");
  return `${g}.${m}.${a}`;
}
function dataLunga(iso) {
  if (!iso) return "—";
  const [a, m, g] = iso.slice(0, 10).split("-");
  return `${Number(g)} ${MESI[Number(m) - 1]} ${a}`;
}
function oggi() {
  // Europe/Rome, non il fuso del dispositivo: le scadenze sono italiane.
  const f = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/Rome", year: "numeric", month: "2-digit", day: "2-digit",
  });
  return f.format(new Date());
}
function giorniFra(da, a) {
  return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(da + "T00:00:00Z")) / 86400000);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ═══════════════════════════════════════════════════════════════════════════
   SESSIONE E RETE
   Tutte le richieste di dati sono `no-store`: nulla finisce nella cache del
   browser né in quella del service worker.
   ═══════════════════════════════════════════════════════════════════════════ */

let sessione = null;

function caricaSessione() {
  try {
    const grezza = localStorage.getItem(CHIAVE_SESSIONE);
    sessione = grezza ? JSON.parse(grezza) : null;
  } catch { sessione = null; }
}
function salvaSessione(s) {
  sessione = s;
  try {
    if (s) localStorage.setItem(CHIAVE_SESSIONE, JSON.stringify(s));
    else localStorage.removeItem(CHIAVE_SESSIONE);
  } catch { /* modalità privata: la sessione resta solo in memoria */ }
}

async function autentica(email, password) {
  const r = await fetch(`${BASE}/auth/v1/token?grant_type=password`, {
    method: "POST", cache: "no-store",
    headers: { apikey: ANON, "content-type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Accesso non riuscito");
  salvaSessione({
    access_token: j.access_token, refresh_token: j.refresh_token,
    scade: Date.now() + (j.expires_in ?? 3600) * 1000,
    utente: { id: j.user.id, email: j.user.email },
  });
  return sessione;
}

async function rinnova() {
  if (!sessione?.refresh_token) throw new Error("nessuna sessione");
  const r = await fetch(`${BASE}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST", cache: "no-store",
    headers: { apikey: ANON, "content-type": "application/json" },
    body: JSON.stringify({ refresh_token: sessione.refresh_token }),
  });
  if (!r.ok) { salvaSessione(null); throw new Error("sessione scaduta"); }
  const j = await r.json();
  salvaSessione({
    access_token: j.access_token, refresh_token: j.refresh_token,
    scade: Date.now() + (j.expires_in ?? 3600) * 1000,
    utente: { id: j.user.id, email: j.user.email },
  });
  return sessione;
}

async function token() {
  if (!sessione) throw new Error("nessuna sessione");
  if (Date.now() > sessione.scade - 60000) await rinnova();
  return sessione.access_token;
}

async function chiama(percorso, opzioni = {}) {
  const t = await token();
  const r = await fetch(`${BASE}${percorso}`, {
    ...opzioni, cache: "no-store",
    headers: {
      apikey: ANON, authorization: `Bearer ${t}`,
      "cache-control": "no-store", ...(opzioni.headers ?? {}),
    },
  });
  if (r.status === 401) { salvaSessione(null); mostraAccesso(); throw new Error("sessione scaduta"); }
  return r;
}

/**
 * Legge una tabella per intero.
 *
 * Il database restituisce al massimo mille righe per volta. Fermarsi li'
 * significherebbe mostrare i primi mille movimenti e chiamarli «tutti»: i
 * totali sarebbero sbagliati senza che niente lo segnali. Si legge a blocchi
 * finche' non arriva un blocco corto.
 */
async function leggi(tabella, query = "") {
  const BLOCCO = 1000;
  const tutto = [];
  for (let da = 0; ; da += BLOCCO) {
    const r = await chiama(`/rest/v1/${tabella}?${query}`, {
      headers: { range: `${da}-${da + BLOCCO - 1}`, "range-unit": "items" },
    });
    if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
    const blocco = await r.json();
    tutto.push(...blocco);
    if (blocco.length < BLOCCO) return tutto;
    if (da > 200000) return tutto;   // rete di sicurezza contro un ciclo infinito
  }
}

async function scrivi(tabella, righe, { fondi = true, conflitto = "" } = {}) {
  if (!righe.length) return 0;
  let scritte = 0;
  for (let i = 0; i < righe.length; i += 200) {
    const blocco = righe.slice(i, i + 200);
    const q = conflitto ? `?on_conflict=${conflitto}` : "";
    const r = await chiama(`/rest/v1/${tabella}${q}`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        prefer: fondi ? "resolution=merge-duplicates,return=minimal" : "return=minimal",
      },
      body: JSON.stringify(blocco),
    });
    if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
    scritte += blocco.length;
  }
  return scritte;
}

async function modifica(tabella, filtro, campi) {
  const r = await chiama(`/rest/v1/${tabella}?${filtro}`, {
    method: "PATCH",
    headers: { "content-type": "application/json", prefer: "return=minimal" },
    body: JSON.stringify(campi),
  });
  if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
}

async function cancella(tabella, filtro) {
  const r = await chiama(`/rest/v1/${tabella}?${filtro}`, {
    method: "DELETE", headers: { prefer: "return=minimal" },
  });
  if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
}

async function traccia(azione, genere, soggetto, motivo) {
  // L'audit è append-only: il database rifiuta modifiche e cancellazioni.
  await scrivi("audit_event", [{
    owner: sessione.utente.id, actor_kind: "user", actor_id: sessione.utente.email,
    action: azione, subject_kind: genere, subject_id: soggetto,
    origin: "manual", reason: motivo ?? null,
  }], { fondi: false }).catch(() => { /* l'audit non deve bloccare l'azione */ });
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATO IN MEMORIA
   I dati non vengono mai scritti su disco dal lato applicazione: vivono
   nella pagina finché è aperta e spariscono alla chiusura.
   ═══════════════════════════════════════════════════════════════════════════ */

const dati = {
  rapporti: [], identificativi: [], strumenti: [], documenti: [],
  file: [], copertura: [], attese: [], legami: [], sconosciuti: [],
  conti: [], movimenti: [], scritture: [], nessi: [],
};

async function ricarica() {
  const [rapporti, identificativi, strumenti, documenti, file, copertura, attese, legami, sconosciuti,
         conti, movimenti, scritture, nessi] =
    await Promise.all([
      leggi("relationship", "select=*&order=institution_label,display_name"),
      leggi("relationship_identifier", "select=*"),
      leggi("payment_instrument", "select=*"),
      leggi("document", "select=*&order=document_date.desc.nullslast"),
      leggi("source_file", "select=*&order=display_name"),
      leggi("coverage", "select=*&order=start_date"),
      leggi("document_expectation", "select=*&order=due_on"),
      leggi("document_relationship", "select=*"),
      leggi("undocumented_relationship", "select=*"),
      leggi("ledger_account", "select=*&order=kind,name"),
      leggi("ledger_transaction", "select=*&order=economic_date.desc"),
      leggi("ledger_posting", "select=*"),
      leggi("transaction_link", "select=*"),
    ]);
  Object.assign(dati, { rapporti, identificativi, strumenti, documenti, file, copertura, attese, legami, sconosciuti,
    conti, movimenti, scritture, nessi });

  // Indici: con qualche migliaio di movimenti, cercare ogni volta a scansione
  // rende la pagina lenta a ogni battuta nel campo di ricerca.
  indice.perMovimento = new Map();
  for (const s of scritture) {
    if (!indice.perMovimento.has(s.transaction_id)) indice.perMovimento.set(s.transaction_id, []);
    indice.perMovimento.get(s.transaction_id).push(s);
  }
  indice.perConto = new Map(conti.map((c) => [c.id, c]));
  indice.legatiA = new Map();
  for (const l of nessi) {
    for (const [a, b] of [[l.from_id, l.to_id], [l.to_id, l.from_id]]) {
      if (!indice.legatiA.has(a)) indice.legatiA.set(a, []);
      indice.legatiA.get(a).push({ id: b, kind: l.kind, rationale: l.rationale });
    }
  }
}

const indice = { perMovimento: new Map(), perConto: new Map(), legatiA: new Map() };

const perRapporto = (id) => dati.rapporti.find((r) => r.id === id);
const scadute = () => dati.attese.filter((a) => a.state === "overdue");
const daConfermare = () => dati.rapporti.filter((r) => r.confirmation === "proposed");

/* ═══════════════════════════════════════════════════════════════════════════
   PAGINE
   ═══════════════════════════════════════════════════════════════════════════ */

const PAGINE = [
  { id: "",           nome: "Situazione", conta: () => null },
  { id: "rapporti",   nome: "Rapporti",   conta: () => dati.rapporti.length },
  { id: "analisi",    nome: "Analisi",    conta: () => null },
  { id: "movimenti",  nome: "Movimenti",  conta: () => dati.movimenti.length || null },
  { id: "solleciti",  nome: "Solleciti",  conta: () => scadute().length },
  { id: "letture",    nome: "Letture",    conta: () => daGuardare().length || null },
  { id: "documenti",  nome: "Documenti",  conta: () => dati.documenti.length },
  { id: "carica",     nome: "Carica",     conta: () => null },
  { id: "impostazioni", nome: "Impostazioni", conta: () => null },
];

function disegnaTabs(attiva) {
  document.getElementById("tabs").innerHTML = PAGINE.map((p) => {
    const n = p.conta();
    return `<a href="#/${p.id}"${p.id === attiva ? ' aria-current="page"' : ""}>${esc(p.nome)}${
      n !== null && n !== undefined ? `<span class="n">${n}</span>` : ""}</a>`;
  }).join("");
}

function vuoto(testo) { return `<div class="empty">${esc(testo)}</div>`; }

/* ── Le operazioni fatte in un'altra valuta ─────────────────────────────────
   L'euro che si vede e' quello addebitato, ed e' giusto che sia quello a
   contare. Ma «1.080,06 €» a Istanbul non si spiega da solo: era un conto in
   lire turche. L'asterisco non aggiunge rumore all'elenco — è un carattere —
   e chi vuole sapere ci passa sopra.
   ─────────────────────────────────────────────────────────────────────────── */

const NOME_VALUTA = {
  TRY: "lire turche", USD: "dollari statunitensi", EGP: "sterline egiziane",
  AED: "dirham degli Emirati", MAD: "dirham marocchini", MUR: "rupie mauriziane",
  BSD: "dollari delle Bahamas", GBP: "sterline", CHF: "franchi svizzeri",
  JPY: "yen", CAD: "dollari canadesi", AUD: "dollari australiani",
  SEK: "corone svedesi", NOK: "corone norvegesi", DKK: "corone danesi",
  PLN: "zloty", HUF: "fiorini", RON: "lei",
};

function inValuta(m) {
  if (!m || !m.original_currency) return "";
  const v = m.original_currency;
  const nome = NOME_VALUTA[v] ?? v;
  const q = m.original_amount_minor != null && m.original_amount_minor !== "0"
    ? formattaCentesimi(BigInt(m.original_amount_minor), "").trim() : null;
  const pezzi = [];
  if (q) pezzi.push(`Operazione di ${q} ${nome} (${v})`);
  else pezzi.push(`Operazione in ${nome} (${v})`);
  if (m.fx_rate) pezzi.push(`cambio ${m.fx_rate}`);
  if (m.fx_fee_minor && m.fx_fee_minor !== "0")
    pezzi.push(`commissione ${formattaCentesimi(BigInt(m.fx_fee_minor))}`);
  pezzi.push(m.fx_source === "documento"
    ? "cambio dichiarato dalla banca sul documento"
    : m.fx_source === "cambio_storico"
      ? "convertito al cambio del giorno dell'operazione"
      : "cambio non disponibile: l'euro qui non è confermato da nessun documento");
  const titolo = pezzi.join(" · ");
  const colore = m.fx_source === "non_disponibile" ? "var(--stop)" : "var(--muted)";
  return `<abbr title="${esc(titolo)}" style="text-decoration:none;cursor:help;color:${colore};font-weight:700">*</abbr>`;
}

/* ── Che fine ha fatto ogni documento ───────────────────────────────────────
   Le banche cambiano il formato degli export senza dirlo. Quando succede, il
   lettore non va in errore: smette semplicemente di trovare le righe, e il
   totale scende. Un numero più basso del vero è il guasto peggiore, perché
   sembra giusto.
   Per questo ogni documento porta un esito, e gli esiti che significano
   «non è entrato» diventano un avviso che non si può non vedere.
   ─────────────────────────────────────────────────────────────────────────── */

const ESITO = {

    spiega: "Le sue righe sono nel libro mastro." },
  senza_movimenti:    { nome: "Senza movimenti", badge: "mute", guarda: false,
    spiega: "È un documento informativo: non contiene movimenti, e non deve contenerne." },
  usato_per_verifica: { nome: "Usato per verifica", badge: "mute", guarda: false,
    spiega: "Serve a confermare i totali di un altro documento." },
  gia_sul_conto:      { nome: "Già sul conto", badge: "mute", guarda: false,
    spiega: "Le operazioni sono già sul conto corrente. Caricarle anche da qui vorrebbe dire contarle due volte." },
  gia_altrove:        { nome: "Già in un altro documento", badge: "mute", guarda: false,
    spiega: "Le stesse operazioni sono in un'estrazione più ampia dello stesso rapporto." },
  conto_vuoto:        { nome: "Conto fermo", badge: "mute", guarda: false,
    spiega: "Nel periodo non c'è nessuna operazione. Il conto esiste ma non è stato usato." },
  doppione:           { nome: "Doppione", badge: "mute", guarda: false,
    spiega: "Stesso contenuto di un altro file già letto. Non viene contato due volte." },
  non_quadra:         { nome: "Non quadra", badge: "warn", guarda: true,
    spiega: "Il documento è stato riconosciuto, ma le righe lette non ricostruiscono i totali che dichiara. "
          + "È stato tenuto fuori apposta: meglio un periodo in meno che un periodo sbagliato." },
  formato_sconosciuto:{ nome: "Formato non riconosciuto", badge: "err", guarda: true,
    spiega: "Nessun formato conosciuto riconosce questo documento. Se è un estratto conto, "
          + "la banca ha cambiato l'export e serve un lettore nuovo." },
  illeggibile:        { nome: "Illeggibile", badge: "err", guarda: true,
    spiega: "Non se ne ricava testo: può essere la scansione di un foglio, o un file protetto." },
  archiviato:         { nome: "Messo da parte", badge: "mute", guarda: false,
    spiega: "L'hai archiviato tu: non è un documento di transazioni." },
  null:               { nome: "Non ancora esaminato", badge: "mute", guarda: false,
    spiega: "Questo file non è ancora passato dal controllo di lettura." },
};
/* «Conto Intesa 5044» e' esatto e non dice niente. «Conto di casa» dice tutto.
   Il nome tecnico non si butta — serve a ritrovare il conto sui documenti —
   ma passa in secondo piano. */
const nomeConto = (c) => (c && (c.alias || c.name)) || "—";
const nomeRapporto = (r) => (r && (r.alias || r.display_name)) || "—";

const esitoDi = (f) => ESITO[f.read_outcome] ?? ESITO.null;
/* Un contratto caricato per sbaglio non e' un guasto del lettore: e' un
   documento che non c'entra. Archiviarlo lo toglie dagli avvisi senza
   cancellarlo — resta in archivio, con scritto perche' e' li'. */
const daGuardare = () => dati.file.filter((f) => esitoDi(f).guarda && !f.archived_at);
const archiviati = () => dati.file.filter((f) => f.archived_at);

function paginaLetture() {
  const problemi = daGuardare();
  /* Un file archiviato non e' piu' «formato non riconosciuto»: e' un
     documento messo da parte. Continuare a contarlo per il vecchio esito
     lasciava l'avviso in cima alla pagina anche dopo averlo tolto. */
  const perEsito = new Map();
  for (const f of dati.file) {
    const k = f.archived_at ? "archiviato" : (f.read_outcome ?? "null");
    perEsito.set(k, (perEsito.get(k) ?? 0) + 1);
  }

  const chiesti = problemi.filter((f) => f.reprocess_requested_at).length;

  return `
    <div class="card">
      <h2>Che fine ha fatto ogni documento</h2>
      <p class="note">Un documento che non entra nei conti deve dirlo. Qui c'è l'esito di
      lettura di tutti i ${dati.file.length} file dell'archivio: quelli in fondo alla lista
      sono quelli su cui vale la pena guardare.</p>
      <div class="meta">${[...perEsito.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([k, n]) => `<span>${esc((ESITO[k] ?? ESITO.null).nome)} <strong>${n}</strong></span>`).join("")}</div>
    </div>

    ${problemi.length ? `
      <div class="avviso ${problemi.some((f) => esitoDi(f).badge === "err") ? "err" : "warn"}">
        <strong>${problemi.length} document${problemi.length === 1 ? "o non è entrato" : "i non sono entrati"} nei conti.</strong>
        Finché restano fuori, le spese e le entrate di quei periodi sono più basse del vero.
        ${chiesti ? `Per ${chiesti} hai già chiesto la rielaborazione.` : ""}
      </div>

      ${problemi.map((f) => {
        const e = esitoDi(f);
        return `
        <div class="card">
          <h3><span class="badge ${e.badge}">${esc(e.nome)}</span> ${esc(f.display_name)}</h3>
          <div class="meta">
            <span>${(f.byte_length / 1024).toFixed(0)} kB</span>
            ${f.read_note ? `<span>formato riconosciuto: ${esc(f.read_note)}</span>` : ""}
            ${f.reprocess_requested_at ? `<span>rielaborazione chiesta il ${dataBreve(f.reprocess_requested_at.slice(0, 10))}</span>` : ""}
          </div>
          <p class="note risk">${esc(e.spiega)}</p>
          <div class="actions">
            ${f.reprocess_requested_at
              ? `<span class="badge ok">rielaborazione chiesta</span>`
              : `<button class="act ghost" data-rielabora="${esc(f.id)}">Chiedi di riprovare a leggerlo</button>`}
            <button class="act ghost" data-archivia="${esc(f.id)}">Non è un estratto: archivia</button>
          </div>
          ${f.reprocess_requested_at
            ? `<div class="note proof">Segnato. Quando il lettore sarà pronto, questo documento rientra da solo:
               è già nell'archivio, non devi ricaricarlo.</div>` : ""}
        </div>`;
      }).join("")}

      <div class="card">
        <h3>La richiesta da mandare</h3>
        <p class="note">Questo testo dice esattamente che cosa non si riesce a leggere.
        Copialo e mandalo a chi cura il programma: serve a scrivere il lettore mancante.</p>
        <textarea id="richiesta" rows="${Math.min(14, problemi.length + 4)}" readonly
          style="width:100%;font-family:ui-monospace,monospace;font-size:0.8rem">${esc(testoRichiesta(problemi))}</textarea>
        <div class="actions"><button class="act ghost" id="copia-richiesta">Copia la richiesta</button></div>
      </div>
    ` : `
      <div class="avviso ok">
        <strong>Nessun documento è rimasto fuori senza una ragione dichiarata.</strong>
        Ogni file dell'archivio o è nei conti, o non doveva esserci.
      </div>`}

    ${archiviati().length ? `
      <h2>Archiviati <span class="sub">non sono estratti conto</span></h2>
      <div class="card">
        <p class="note">Questi documenti li hai messi da parte tu: restano nell'archivio
        e non compaiono più fra gli avvisi. Se ti sei sbagliato, puoi rimetterli in lista.</p>
        <div class="scorri"><table class="dati">
          <thead><tr><th>Documento</th><th>Messo da parte il</th><th></th></tr></thead>
          <tbody>${archiviati().map((f) => `
            <tr><td>${esc(f.display_name)}</td>
                <td>${dataBreve(f.archived_at.slice(0, 10))}</td>
                <td><button class="act ghost" data-riprendi="${esc(f.id)}">Rimetti in lista</button></td></tr>`).join("")}
          </tbody>
        </table></div>
      </div>` : ""}`;
}

function testoRichiesta(problemi) {
  const righe = [
    "Documenti che il programma non riesce a portare nei conti.",
    `Archivio di ${dati.file.length} file, aggiornato al ${new Date().toISOString().slice(0, 10)}.`,
    "",
  ];
  for (const f of problemi) {
    const e = esitoDi(f);
    righe.push(`- [${e.nome}] ${f.display_name}${f.read_note ? `  (formato: ${f.read_note})` : ""}`);
    righe.push(`  ${e.spiega}`);
  }
  return righe.join("\n");
}

async function archiviaDocumento(idFile, riprendi = false) {
  const f = dati.file.find((x) => x.id === idFile);
  if (!f) return;
  const quando = riprendi ? null : new Date().toISOString();
  await modifica("source_file", `id=eq.${idFile}`,
    { archived_at: quando, archived_reason: riprendi ? null : "Non è un documento di transazioni" });
  await traccia(riprendi ? "document.unarchived" : "document.archived", "source_file", idFile,
    `${riprendi ? "Rimesso in lista" : "Archiviato"}: «${f.display_name}»`);
  f.archived_at = quando;
  disegna();
}

async function chiediRielaborazione(idFile) {
  const f = dati.file.find((x) => x.id === idFile);
  if (!f) return;
  await modifica("source_file", `id=eq.${idFile}`, { reprocess_requested_at: new Date().toISOString() });
  await traccia("document.reprocess_requested", "source_file", idFile,
    `Chiesta la rielaborazione di «${f.display_name}» (${f.read_outcome})`);
  f.reprocess_requested_at = new Date().toISOString();
  disegna();
}

/* ── Rapporti: elenco, diagnosi, dettaglio ──────────────────────────────── */

const GENERE = {
  cash_account: "conto", credit_facility: "carta di credito",
  securities_dossier: "dossier titoli", payment_instrument: "strumento di pagamento",
  insurance_policy: "polizza", loan: "finanziamento",
};

const ETICHETTA_IDENT = {
  iban: "IBAN", account_number: "numero di conto", contract_number: "numero di contratto",
  dossier_number: "numero di dossier", card_masked_pan: "carta",
  issuer_statement_id: "serie di estratto conto",
};

/* Quali documenti ci si aspetta di trovare sotto un rapporto di ciascun
   genere. Un documento fuori da questo insieme non prova che il rapporto sia
   sbagliato, ma e' il segnale che qualcosa e' finito nel posto sbagliato. */
const TIPI_ATTESI = {
  cash_account: new Set(["bank_account_statement", "debit_card_movement_list", "transfer_receipt",
    "summary_document", "service_notice", "contract_change", "tax_receipt", "unknown"]),
  credit_facility: new Set(["credit_card_statement", "card_settlement_notice", "expense_summary",
    "debit_card_movement_list", "summary_document", "service_notice", "contract_change", "unknown"]),
  securities_dossier: new Set(["securities_statement", "securities_order_note", "advisory_report",
    "summary_document", "service_notice", "contract_change", "tax_receipt", "unknown"]),
};

/* Documenti che, da soli, non bastano a dimostrare che esista un rapporto.
   Il documento di sintesi in particolare viene emesso per OGNI prodotto —
   conto, carta, dossier, fido — quindi trovarne uno non significa aver
   trovato un conto. */
const PROVE_DEBOLI = new Set(["summary_document", "service_notice", "contract_change",
  "transfer_receipt", "tax_receipt", "unknown"]);

const identDi = (id) => dati.identificativi.filter((i) => i.relationship_id === id);
const strumentiDi = (id) => dati.strumenti.filter((s) => s.relationship_id === id);
const strumento = (id) => dati.strumenti.find((s) => s.id === id);
const documentiDi = (id) => {
  const ids = new Set(dati.legami.filter((l) => l.relationship_id === id).map((l) => l.document_id));
  return dati.documenti.filter((d) => ids.has(d.id));
};
const fileDi = (idDocumento) => dati.file.find((f) => f.id === idDocumento);
const nomeFile = (d) => dati.file.find((f) => f.id === d.source_file_id)?.display_name ?? "—";
const serieDi = (d) => (d.issuer_statement_id ? d.issuer_statement_id.slice(0, 2) : null);

function raggruppa(elenco, chiave) {
  const m = new Map();
  for (const x of elenco) {
    const k = chiave(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
}

/**
 * Cosa non torna in questo rapporto.
 *
 * Non decide niente: espone le contraddizioni fra quello che il rapporto
 * dichiara di essere e le prove che ha sotto. La decisione resta all'intestatario.
 */
function diagnosi(r) {
  const avvisi = [];
  const ident = identDi(r.id);
  const docs = documentiDi(r.id);

  // Piu' identificativi FORTI dello stesso tipo: quasi sempre due rapporti
  // distinti tenuti insieme per errore. E' l'errore piu' grave dei due,
  // perche' somma fra loro conti che non c'entrano niente.
  for (const [tipo, elenco] of raggruppa(ident.filter((i) => i.strength === "strong"), (i) => i.type)) {
    if (elenco.length > 1) {
      avvisi.push({
        gravita: "stop", genere: "fusione",
        titolo: `Tiene insieme ${elenco.length} ${ETICHETTA_IDENT[tipo] ?? tipo} diversi`,
        dettaglio: elenco.map((i) => i.masked).join("  ·  "),
        spiegazione: "Se sono conti distinti, qui sono stati sommati in uno solo: ogni numero che ne uscirebbe sarebbe la somma di due conti diversi.",
      });
    }
  }

  // Piu' serie di estratto conto sotto lo stesso rapporto: stessa cosa,
  // vista dal lato dei documenti invece che degli identificativi.
  const serie = raggruppa(docs.filter((d) => d.document_type === "bank_account_statement" && serieDi(d)),
    (d) => serieDi(d));
  if (serie.size > 1) {
    avvisi.push({
      gravita: "stop", genere: "serie",
      titolo: `Gli estratti conto appartengono a ${serie.size} serie diverse`,
      dettaglio: [...serie.entries()].map(([s, e]) => `serie ${s}: ${e.length} documenti`).join("  ·  "),
      spiegazione: "Una banca numera gli estratti conto per rapporto. Serie diverse quasi sempre vogliono dire rapporti diversi.",
    });
  }

  // Un solo documento, e per giunta di quelli che non provano granche'.
  if (docs.length === 1 && PROVE_DEBOLI.has(docs[0].document_type)) {
    avvisi.push({
      gravita: "warn", genere: "fantasma",
      titolo: `Poggia su un solo ${TIPI[docs[0].document_type] ?? docs[0].document_type}`,
      dettaglio: nomeFile(docs[0]),
      spiegazione: docs[0].document_type === "summary_document"
        ? "Il documento di sintesi viene emesso per ogni prodotto — conto, carta, dossier — non solo per i conti. Trovarne uno non dimostra che esista un conto a sé."
        : "Un documento di questo tipo cita un numero di rapporto, ma non basta a dimostrare che sia un rapporto separato.",
    });
  }

  // Una successione di carte che ATTRAVERSA due rapporti: il motore ha
  // riconosciuto che la carta nuova continua quella vecchia, ma le due carte
  // stanno sotto rapporti diversi. Se e' davvero la stessa linea di credito,
  // tenerli separati spezza in due lo storico e fa comparire dal nulla un
  // debito che invece era gia' li'.
  for (const s of strumentiDi(r.id)) {
    const prec = s.replaces_id ? strumento(s.replaces_id) : null;
    if (prec && prec.relationship_id && prec.relationship_id !== r.id) {
      avvisi.push({
        gravita: "stop", genere: "successione", altroId: prec.relationship_id,
        titolo: `La carta ${s.masked_pan} continua ${prec.masked_pan}, che sta in un altro rapporto`,
        dettaglio: perRapporto(prec.relationship_id)?.display_name ?? "—",
        spiegazione: s.succession_proof || "Le due serie si susseguono senza sovrapposizione.",
      });
    }
  }
  for (const s of dati.strumenti) {
    const prec = s.replaces_id ? strumento(s.replaces_id) : null;
    if (prec && prec.relationship_id === r.id && s.relationship_id && s.relationship_id !== r.id) {
      avvisi.push({
        gravita: "stop", genere: "successione", altroId: s.relationship_id,
        titolo: `La carta ${prec.masked_pan} sembra proseguire in ${s.masked_pan}, sotto un altro rapporto`,
        dettaglio: perRapporto(s.relationship_id)?.display_name ?? "—",
        spiegazione: s.succession_proof || "Le due serie si susseguono senza sovrapposizione.",
      });
    }
  }

  // Documenti che non c'entrano con il genere dichiarato.
  const attesi = TIPI_ATTESI[r.entity_kind];
  const estranei = attesi ? docs.filter((d) => !attesi.has(d.document_type)) : [];
  if (estranei.length) {
    avvisi.push({
      gravita: "warn", genere: "estranei",
      titolo: `${estranei.length} document${estranei.length === 1 ? "o" : "i"} di tipo estraneo`,
      dettaglio: [...new Set(estranei.map((d) => TIPI[d.document_type] ?? d.document_type))].join(", "),
      spiegazione: `Sotto un ${GENERE[r.entity_kind]} non ci si aspetta questi documenti: appartengono probabilmente a un altro rapporto.`,
    });
  }

  return avvisi;
}

let filtroRap = { istituto: "", genere: "", stato: "", cerca: "" };

function paginaRapporti() {
  if (!dati.rapporti.length) return vuoto("Nessun rapporto. Carica dei documenti per cominciare.");

  const istituti = [...new Set(dati.rapporti.map((r) => r.institution_label || r.institution_key))].sort();
  const generi = [...new Set(dati.rapporti.map((r) => r.entity_kind))].sort();

  const conDiagnosi = dati.rapporti.map((r) => ({
    r, avvisi: diagnosi(r), docs: documentiDi(r.id).length,
  }));

  const elenco = conDiagnosi.filter(({ r, avvisi }) =>
    (!filtroRap.istituto || (r.institution_label || r.institution_key) === filtroRap.istituto) &&
    (!filtroRap.genere || r.entity_kind === filtroRap.genere) &&
    (filtroRap.stato !== "confermati" || r.confirmation === "user_confirmed") &&
    (filtroRap.stato !== "da_confermare" || r.confirmation === "proposed") &&
    (filtroRap.stato !== "da_rivedere" || avvisi.length > 0) &&
    (!filtroRap.cerca || `${r.display_name} ${identDi(r.id).map((i) => i.masked).join(" ")}`
      .toLowerCase().includes(filtroRap.cerca.toLowerCase())));

  elenco.sort((a, b) => b.docs - a.docs || a.r.display_name.localeCompare(b.r.display_name));

  const daRivedere = conDiagnosi.filter((x) => x.avvisi.length).length;

  return `
    <div class="card">
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
        <select id="f-istituto" style="flex:1;min-width:145px">
          <option value="">Tutti gli istituti</option>
          ${istituti.map((i) => `<option value="${esc(i)}"${filtroRap.istituto === i ? " selected" : ""}>${esc(i)}</option>`).join("")}
        </select>
        <select id="f-genere" style="flex:1;min-width:145px">
          <option value="">Tutti i tipi</option>
          ${generi.map((g) => `<option value="${esc(g)}"${filtroRap.genere === g ? " selected" : ""}>${esc(GENERE[g] ?? g)}</option>`).join("")}
        </select>
        <select id="f-stato" style="flex:1;min-width:145px">
          <option value="">Tutti gli stati</option>
          <option value="da_rivedere"${filtroRap.stato === "da_rivedere" ? " selected" : ""}>Da rivedere (${daRivedere})</option>
          <option value="da_confermare"${filtroRap.stato === "da_confermare" ? " selected" : ""}>Da confermare</option>
          <option value="confermati"${filtroRap.stato === "confermati" ? " selected" : ""}>Confermati</option>
        </select>
      </div>
      <input type="text" id="f-cerca" placeholder="Cerca per nome o per numero…" value="${esc(filtroRap.cerca)}">
      <div class="meta"><span>${elenco.length} di ${dati.rapporti.length}</span>
        ${daRivedere ? `<span>${daRivedere} con qualcosa che non torna</span>` : ""}</div>
    </div>

    ${elenco.length ? elenco.map(({ r, avvisi, docs }) => {
      const ident = identDi(r.id);
      const strum = dati.strumenti.filter((s) => s.relationship_id === r.id);
      const cop = dati.copertura.filter((c) => c.relationship_id === r.id);
      const inizi = cop.map((c) => c.start_date).sort();
      const fini = cop.map((c) => c.end_date).sort();

      const stato = r.confirmation === "user_confirmed" ? '<span class="badge ok">confermato</span>'
        : r.confirmation === "rejected" ? '<span class="badge mute">archiviato</span>'
        : r.disposition === "preselected" ? '<span class="badge warn">da confermare</span>'
        : '<span class="badge stop">da verificare a mano</span>';

      const peggiore = avvisi.some((a) => a.gravita === "stop") ? "stop" : avvisi.length ? "warn" : null;

      return `
        <div class="card">
          <h3>${esc(nomeRapporto(r))} ${stato}
            ${r.status === "closed" ? '<span class="badge mute">chiuso</span>' : ""}
            ${peggiore ? `<span class="badge ${peggiore}">${avvisi.length} da rivedere</span>` : ""}</h3>
          <p>${esc(r.institution_label || r.institution_key)} · ${esc(GENERE[r.entity_kind] ?? r.entity_kind)}${
            r.currency ? ` · ${esc(r.currency)}` : ""}</p>
          <div class="meta">
            <span>${docs} document${docs === 1 ? "o" : "i"}</span>
            ${inizi.length ? `<span>${dataBreve(inizi[0])} → ${dataBreve(fini[fini.length - 1])}</span>` : ""}
            ${r.cadence ? `<span>cadenza ${esc(CADENZA[r.cadence] ?? r.cadence)}</span>` : ""}
          </div>
          ${ident.length ? `<div class="meta">${ident.slice(0, 6).map((i) =>
            `<span><code>${esc(i.masked)}</code></span>`).join("")}${
            ident.length > 6 ? `<span>e altri ${ident.length - 6}</span>` : ""}</div>` : ""}
          ${strum.length ? `<div class="note proof">Carte: ${strum.map((s) => esc(s.masked_pan)).join(" → ")}</div>` : ""}
          ${avvisi.map((a) => `<div class="note ${a.gravita === "stop" ? "stop" : "risk"}"><strong>${esc(a.titolo)}</strong> — ${esc(a.dettaglio)}</div>`).join("")}
          <div class="actions">
            <a class="tile" style="padding:0.45rem 0.85rem;border-color:var(--accent);color:var(--accent);font-weight:600;font-size:0.83rem;display:inline-block"
               href="#/rapporto/${esc(r.id)}">Apri e verifica</a>
          </div>
        </div>`;
    }).join("") : vuoto("Nessun rapporto con questi filtri.")}

    ${dati.sconosciuti.length && !filtroRap.istituto && !filtroRap.genere && !filtroRap.stato ? `
      <h2>Nominati ma senza documenti <span class="sub">${dati.sconosciuti.length}</span></h2>
      ${dati.sconosciuti.map((s) => `
        <div class="card">
          <h3>${esc(s.identifier_mask)} <span class="badge mute">nessun documento</span></h3>
          <p>${esc(s.institution_key)} · citato in ${s.mentioned_in} documenti di altri rapporti</p>
          <div class="note">${esc(s.rationale)}</div>
        </div>`).join("")}` : ""}
  `;
}

const CADENZA = { monthly: "mensile", quarterly: "trimestrale", yearly: "annuale", irregular: "irregolare" };

/* ── Dettaglio di un rapporto: tutte le prove, e le azioni per rimetterlo a posto ── */

function paginaRapporto(id) {
  const r = perRapporto(id);
  if (!r) return vuoto("Rapporto non trovato.");

  const ident = identDi(id);
  const docs = documentiDi(id);
  const avvisi = diagnosi(r);
  const strum = dati.strumenti.filter((s) => s.relationship_id === id);
  const cop = dati.copertura.filter((c) => c.relationship_id === id);
  const attese = dati.attese.filter((a) => a.relationship_id === id);

  const perTipo = raggruppa(docs, (d) => d.document_type);
  const attesi = TIPI_ATTESI[r.entity_kind];

  return `
    <div class="actions" style="margin-top:0.9rem">
      <a class="tile" style="padding:0.4rem 0.8rem;font-size:0.83rem;display:inline-block" href="#/rapporti">← Tutti i rapporti</a>
    </div>

    <h2>${esc(nomeRapporto(r))}</h2>
    <div class="card">
      <div class="meta">
        <span>${esc(r.institution_label || r.institution_key)}</span>
        <span>${esc(GENERE[r.entity_kind] ?? r.entity_kind)}</span>
        ${r.currency ? `<span>${esc(r.currency)}</span>` : ""}
        <span>${docs.length} documenti</span>
        <span>attendibilità ${(r.confidence * 100).toFixed(0)}%</span>
        <span>${esc(r.origin === "strong_key" ? "riconosciuto da identificativo forte" : r.origin === "medium_key" ? "riconosciuto da identificativo medio" : "inserito a mano")}</span>
      </div>
      ${r.confirmation === "proposed" ? `
        <div class="actions">
          <button class="act" data-conferma="${esc(r.id)}">Confermo, è mio</button>
          <button class="act ghost" data-rifiuta="${esc(r.id)}">Non è mio</button>
        </div>` : `<div class="note proof">Stato: ${esc(
          r.confirmation === "user_confirmed" ? "confermato da te" : "archiviato")}</div>`}
      <div class="actions">
        <button class="act ghost" data-unisci="${esc(r.id)}">Unisci a un altro rapporto</button>
        <button class="act ghost" data-tipo="${esc(r.id)}">Cambia tipo</button>
      </div>
    </div>
    <div id="modulo-azione"></div>

    ${avvisi.length ? `
      <h2>Cosa non torna <span class="sub">${avvisi.length}</span></h2>
      ${avvisi.map((a) => `
        <div class="card">
          <h3>${esc(a.titolo)} <span class="badge ${a.gravita}">${esc(a.gravita === "stop" ? "grave" : "da rivedere")}</span></h3>
          <p>${esc(a.dettaglio)}</p>
          <div class="note ${a.gravita === "stop" ? "stop" : "risk"}">${esc(a.spiegazione)}</div>
          ${a.genere === "fusione" || a.genere === "serie" ? `
            <div class="actions"><button class="act" data-separa="${esc(r.id)}">Separali</button></div>` : ""}
          ${a.genere === "successione" ? `
            <div class="actions"><button class="act" data-unisci="${esc(r.id)}" data-con="${esc(a.altroId)}">Sì, è lo stesso rapporto</button></div>` : ""}
          ${a.genere === "estranei" ? `
            <div class="actions"><button class="act" data-estranei="${esc(r.id)}">Sposta i documenti estranei</button></div>` : ""}
          ${a.genere === "fantasma" ? `
            <div class="actions">
              <button class="act ghost" data-archivia="${esc(r.id)}">Non è un rapporto a sé, archivialo</button>
              <button class="act ghost" data-tipo="${esc(r.id)}">È un altro tipo di rapporto</button>
            </div>` : ""}
        </div>`).join("")}
    ` : `<div class="note proof" style="margin-top:1rem">Nessuna contraddizione fra quello che questo rapporto dichiara di essere e i documenti che ha sotto.</div>`}

    <h2>Identificativi <span class="sub">${ident.length}</span></h2>
    <div class="card"><div class="scorri"><table class="dati">
      <thead><tr><th>Tipo</th><th>Valore</th><th>Forza</th><th>Stato</th></tr></thead>
      <tbody>${ident.map((i) => `<tr>
        <td>${esc(ETICHETTA_IDENT[i.type] ?? i.type)}</td>
        <td><code>${esc(i.masked)}</code></td>
        <td>${esc(i.strength === "strong" ? "forte" : i.strength === "medium" ? "medio" : "debole")}</td>
        <td>${esc(i.status === "verified" ? "verificato" : i.status === "user_confirmed" ? "confermato" : "dedotto")}</td>
      </tr>`).join("")}</tbody>
    </table></div></div>

    ${strum.length ? `
      <h2>Carte <span class="sub">${strum.length}</span></h2>
      ${strum.map((s) => `<div class="card">
        <h3><code>${esc(s.masked_pan)}</code> ${s.succession_status === "user_confirmed" ? '<span class="badge ok">sostituzione confermata</span>' : ""}</h3>
        <div class="meta">
          ${s.valid_from ? `<span>dal ${dataBreve(s.valid_from)}</span>` : ""}
          ${s.valid_to ? `<span>al ${dataBreve(s.valid_to)}</span>` : ""}
          ${s.replaces_id ? `<span>sostituisce <code>${esc(dati.strumenti.find((x) => x.id === s.replaces_id)?.masked_pan ?? "—")}</code></span>` : ""}
        </div>
        ${s.succession_proof ? `<div class="note">${esc(s.succession_proof)}</div>` : ""}
        <div class="actions"><button class="act ghost" data-rimuovi-carta="${esc(s.id)}">Questa carta non esiste, toglila</button></div>
      </div>`).join("")}` : ""}

    <h2>Documenti <span class="sub">${docs.length}</span></h2>
    ${docs.length ? [...perTipo.entries()]
      .sort((a, b) => b[1].length - a[1].length)
      .map(([tipo, elenco]) => {
        const estraneo = attesi && !attesi.has(tipo);
        const perSerie = raggruppa(elenco, (d) => serieDi(d) ?? "—");
        return `
          <div class="card">
            <h3>${esc(TIPI[tipo] ?? tipo)} <span class="badge ${estraneo ? "stop" : "mute"}">${elenco.length}</span>
              ${estraneo ? '<span class="badge stop">non dovrebbe stare qui</span>' : ""}</h3>
            ${perSerie.size > 1 ? `<div class="meta">${[...perSerie.entries()].map(([s, e]) =>
              `<span>serie ${esc(s)}: ${e.length}</span>`).join("")}</div>` : ""}
            <div class="scorri"><table class="dati">
              <thead><tr><th>File</th><th>Serie</th><th>Data</th><th class="num">Saldo finale</th></tr></thead>
              <tbody>${elenco.slice(0, 60).map((d) => `<tr>
                <td>${esc(nomeFile(d))}</td>
                <td>${esc(d.issuer_statement_id ?? "—")}</td>
                <td>${dataBreve(d.document_date)}</td>
                <td class="num">${d.closing_minor !== null && d.closing_minor !== undefined
                  ? formattaCentesimi(d.closing_minor, d.currency ?? "EUR") : "—"}</td>
              </tr>`).join("")}</tbody>
            </table></div>
            ${elenco.length > 60 ? `<div class="note">Mostrati i primi 60 di ${elenco.length}.</div>` : ""}
          </div>`;
      }).join("") : vuoto("Nessun documento collegato.")}

    ${cop.length ? `
      <h2>Periodi coperti <span class="sub">${cop.length}</span></h2>
      <div class="card"><div class="meta">${cop.slice(0, 40).map((c) =>
        `<span>${dataBreve(c.start_date)} → ${dataBreve(c.end_date)}</span>`).join("")}</div></div>` : ""}

    ${attese.length ? `
      <h2>Scadenze <span class="sub">${attese.length}</span></h2>
      <div class="card"><div class="meta">
        ${["overdue", "awaiting", "not_yet_due", "fulfilled", "superseded_by_substitution", "not_expected_closed"]
          .map((s) => { const n = attese.filter((a) => a.state === s).length; return n
            ? `<span>${esc({ overdue: "in ritardo", awaiting: "in attesa", not_yet_due: "non ancora dovuti",
                fulfilled: "arrivati", superseded_by_substitution: "superati da sostituzione",
                not_expected_closed: "non più attesi" }[s])}: ${n}</span>` : ""; }).join("")}
      </div></div>` : ""}
  `;
}

/* ── Solleciti: il punto in cui si chiede della carta sostitutiva ───────── */

function paginaSolleciti() {
  const oggiIso = oggi();
  const inRitardo = dati.attese.filter((a) => a.state === "overdue");
  const attesa = dati.attese.filter((a) => a.state === "awaiting");
  const future = dati.attese.filter((a) => a.state === "not_yet_due");

  if (!dati.attese.length) return vuoto("Nessuna attesa di documenti: non ci sono ancora rapporti con una cadenza riconosciuta.");

  // Raggruppo per rapporto: la domanda sulla sostituzione si fa una volta per
  // rapporto, non una volta per mese mancante.
  const gruppi = new Map();
  for (const a of inRitardo) {
    if (!gruppi.has(a.relationship_id)) gruppi.set(a.relationship_id, []);
    gruppi.get(a.relationship_id).push(a);
  }

  const blocchi = [...gruppi.entries()].map(([idRapporto, elenco]) => {
    const r = perRapporto(idRapporto);
    if (!r) return "";
    const strum = dati.strumenti.filter((s) => s.relationship_id === idRapporto);
    const ordinati = elenco.slice().sort((x, y) => x.due_on < y.due_on ? -1 : 1);
    const primo = ordinati[0], ultimo = ordinati[ordinati.length - 1];
    const ritardo = giorniFra(ultimo.due_on, oggiIso);
    const eCarta = r.entity_kind === "credit_facility" || strum.length > 0;

    return `
      <div class="card">
        <h3>${esc(r.display_name)} <span class="badge stop">${elenco.length} mancant${elenco.length === 1 ? "e" : "i"}</span></h3>
        <p>${esc(r.institution_label || r.institution_key)}</p>
        <div class="meta">
          <span>Dal ${dataBreve(primo.period_start)} al ${dataBreve(ultimo.period_end)}</span>
          <span>l'ultimo era atteso il ${dataBreve(ultimo.due_on)}</span>
          ${ritardo > 0 ? `<span>${ritardo} giorni fa</span>` : ""}
        </div>
        ${strum.length ? `<div class="note">Ultima carta conosciuta: <code>${esc(strum[strum.length - 1].masked_pan)}</code></div>` : ""}

        <div class="note risk">Il documento non è arrivato. Questo, da solo, non significa che il rapporto sia chiuso:
        potrebbe essere solo un documento che non hai ancora caricato.${
          eCarta ? " Oppure la carta è scaduta ed è stata sostituita con una nuova." : ""}</div>

        <div class="actions">
          ${eCarta ? `<button class="act" data-sostituita="${esc(r.id)}">La carta è stata sostituita</button>` : ""}
          <button class="act ghost" data-chiuso="${esc(r.id)}">Il rapporto è chiuso</button>
          <button class="act ghost" data-caricare="${esc(r.id)}">Devo solo caricare il documento</button>
        </div>
        <div id="modulo-${esc(r.id)}"></div>
      </div>`;
  }).join("");

  return `
    ${inRitardo.length ? `<h2>In ritardo <span class="sub">${inRitardo.length} document${inRitardo.length === 1 ? "o" : "i"}</span></h2>${blocchi}`
      : `<h2>In ritardo</h2>${vuoto("Nessun documento in ritardo.")}`}

    ${attesa.length ? `
      <h2>In attesa <span class="sub">${attesa.length}</span></h2>
      <div class="card"><p>Attesi ma ancora dentro la tolleranza: non è il caso di preoccuparsi.</p>
      <div class="meta">${attesa.slice(0, 12).map((a) => {
        const r = perRapporto(a.relationship_id);
        return `<span>${esc(r?.display_name ?? "—")} · ${dataBreve(a.due_on)}</span>`;
      }).join("")}</div></div>` : ""}

    ${future.length ? `
      <h2>Prossimi <span class="sub">${future.length}</span></h2>
      <div class="card"><div class="meta">${future.slice(0, 8).map((a) => {
        const r = perRapporto(a.relationship_id);
        return `<span>${esc(r?.display_name ?? "—")} · atteso il ${dataBreve(a.due_on)}</span>`;
      }).join("")}</div></div>` : ""}
  `;
}

function moduloSostituzione(idRapporto) {
  const r = perRapporto(idRapporto);
  const strum = strumentiDi(idRapporto);
  const ultima = strum.length ? strum[strum.length - 1] : null;

  // Le carte che il sistema conosce gia' presso lo stesso istituto e che non
  // stanno gia' sotto questo rapporto. Sceglierne una e' molto meno soggetto
  // a errore che digitare quattro cifre a memoria — e nove volte su dieci la
  // carta nuova e' gia' nei documenti caricati.
  const altrove = dati.strumenti.filter((s) =>
    s.institution_key === r.institution_key && s.relationship_id !== idRapporto);

  return `
    <div class="card" style="margin-top:0.7rem;background:var(--surface-2)">
      <h3>Carta sostitutiva</h3>
      <p>Il rapporto con ${esc(r.institution_label || r.institution_key)} continua, ma con una carta nuova.
      ${ultima ? `La precedente era <code>${esc(ultima.masked_pan)}</code>.` : ""}</p>

      ${altrove.length ? `
        <p style="color:var(--text);font-size:0.88rem"><strong>È una di queste?</strong>
        Sono carte dello stesso istituto già presenti nei tuoi documenti.</p>
        ${altrove.map((s) => `
          <label class="card" style="display:block;cursor:pointer;margin-bottom:0.4rem">
            <span style="display:flex;gap:0.6rem;align-items:center">
              <input type="radio" name="scelta-${esc(idRapporto)}" value="${esc(s.id)}">
              <span><code>${esc(s.masked_pan)}</code>
                <span class="meta" style="margin-top:0.15rem"><span>${esc(
                  perRapporto(s.relationship_id)?.display_name ?? "—")}</span></span></span>
            </span>
          </label>`).join("")}
        <label class="card" style="display:block;cursor:pointer;margin-bottom:0.4rem">
          <span style="display:flex;gap:0.6rem;align-items:center">
            <input type="radio" name="scelta-${esc(idRapporto)}" value="nuova" checked>
            <span>No, è una carta che non compare ancora nei documenti</span>
          </span>
        </label>` : ""}

      <div id="nuova-${esc(idRapporto)}">
        <label class="campo"><span>Le ultime quattro cifre — quelle <strong>in fondo</strong> al numero</span>
          <input type="text" id="pan-${esc(idRapporto)}" inputmode="numeric" maxlength="4" placeholder="1234"></label>
        <label class="campo"><span>Da quando è in uso (se lo sai)</span>
          <input type="text" id="dal-${esc(idRapporto)}" placeholder="gg.mm.aaaa" inputmode="numeric"></label>
      </div>

      <div class="note">Non chiedo mai il numero completo, né il codice di sicurezza, né il PIN. Le ultime quattro
      cifre bastano a riconoscere la carta nei documenti e non permettono di usarla. Se il numero è lungo,
      come su American Express, sono comunque le <strong>ultime</strong> quattro, non le prime.</div>
      <div class="actions">
        <button class="act" data-salva-sostituzione="${esc(idRapporto)}">Registra la sostituzione</button>
        <button class="act ghost" data-annulla="${esc(idRapporto)}">Annulla</button>
      </div>
      <div id="esito-${esc(idRapporto)}"></div>
    </div>`;
}

const avvisati = new Set();

async function registraSostituzione(idRapporto) {
  const box = document.getElementById(`esito-${idRapporto}`);
  const scelta = document.querySelector(`input[name="scelta-${idRapporto}"]:checked`)?.value ?? "nuova";

  // Se la carta nuova e' una che il sistema conosce gia', non e' una carta da
  // registrare: sono due rapporti che vanno uniti. Registrarla di nuovo
  // creerebbe un doppione e lascerebbe lo storico spezzato lo stesso.
  if (scelta !== "nuova") {
    const s = strumento(scelta);
    box.innerHTML = `<div class="avviso ok">Allora questi due sono lo stesso rapporto: apro l'unione.</div>`;
    setTimeout(() => { location.hash = `#/rapporto/${idRapporto}`; disegna();
      setTimeout(() => mostraUnione(idRapporto, s?.relationship_id ?? ""), 300); }, 700);
    return;
  }

  const pan = (document.getElementById(`pan-${idRapporto}`).value || "").replace(/\D/g, "");
  const dalGrezzo = (document.getElementById(`dal-${idRapporto}`).value || "").trim();

  if (pan.length !== 4) { box.innerHTML = `<div class="avviso err">Servono esattamente quattro cifre.</div>`; return; }

  // Due controlli contro l'errore piu' facile: leggere le cifre dalla parte
  // sbagliata del numero. Sono avvisi, non divieti: una carta puo' davvero
  // finire con quelle cifre, e in quel caso basta ripremere.
  const r0 = perRapporto(idRapporto);
  let sospetto = null;

  const inizioDiUnaNota = dati.strumenti.find((s) =>
    s.institution_key === r0?.institution_key &&
    /^\d{4}/.test(s.masked_pan) && s.masked_pan.slice(0, 4) === pan);
  if (inizioDiUnaNota) {
    sospetto = `<code>${esc(pan)}</code> sono le <strong>prime</strong> quattro cifre di
      <code>${esc(inizioDiUnaNota.masked_pan)}</code>, non le ultime.`;
  } else if (r0?.institution_key === "AMEX" && /^3[47]/.test(pan)) {
    // Le carte American Express cominciano tutte per 34 o 37 e sono lunghe
    // quindici cifre. Quattro cifre che cominciano cosi' sono quasi sempre
    // l'inizio del numero, non la fine.
    sospetto = `Le carte American Express cominciano per 34 o 37: <code>${esc(pan)}</code> sembra
      l'<strong>inizio</strong> del numero, non la fine.`;
  }

  if (sospetto && !avvisati.has(idRapporto)) {
    avvisati.add(idRapporto);
    box.innerHTML = `<div class="avviso err">${sospetto}<br><br>
      Se sono davvero le ultime quattro, premi di nuovo «Registra».</div>`;
    return;
  }
  let dal = null;
  if (dalGrezzo) {
    const m = dalGrezzo.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
    if (!m) { box.innerHTML = `<div class="avviso err">La data va scritta come gg.mm.aaaa.</div>`; return; }
    dal = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }

  const r = perRapporto(idRapporto);
  const strum = dati.strumenti.filter((s) => s.relationship_id === idRapporto);
  const precedente = strum.length ? strum[strum.length - 1] : null;

  try {
    // La carta nuova sostituisce la vecchia. La successione è dichiarata da
    // te, quindi è confermata: non è un'ipotesi dell'algoritmo.
    const nuova = {
      owner: sessione.utente.id, relationship_id: idRapporto,
      institution_key: r.institution_key, masked_pan: `••••${pan}`,
      valid_from: dal, replaces_id: precedente?.id ?? null,
      succession_status: "user_confirmed", succession_rung: "explicit_document",
      succession_proof: "Sostituzione dichiarata dall'intestatario in risposta a un sollecito",
    };
    await scrivi("payment_instrument", [nuova], { fondi: false });

    // La vecchia carta smette di essere valida e non viene più sollecitata.
    if (precedente && dal) {
      await modifica("payment_instrument", `id=eq.${precedente.id}`, { valid_to: dal });
    }
    await modifica(
      "document_expectation",
      `relationship_id=eq.${idRapporto}&state=eq.overdue`,
      { state: "superseded_by_substitution",
        rationale: "Carta sostituita: il documento mancante riguardava lo strumento precedente" },
    );
    await traccia("instrument.succession.confirm", "relationship", idRapporto,
      `Carta sostitutiva ••••${pan}`);

    box.innerHTML = `<div class="avviso ok">Registrata. Non ti chiederò più i documenti della carta precedente.</div>`;
    await ricarica();
    setTimeout(disegna, 900);
  } catch (e) {
    box.innerHTML = `<div class="avviso err">${esc(e.message)}</div>`;
  }
}

async function chiudiRapporto(idRapporto) {
  const r = perRapporto(idRapporto);
  if (!confirm(`Confermi che «${r.display_name}» è chiuso?\n\nSmetterò di chiedere i suoi documenti. Quelli già caricati restano.`)) return;
  await modifica("relationship", `id=eq.${idRapporto}`,
    { status: "closed", closed_on: oggi(), closure_evidence: "user_confirmed", updated_at: new Date().toISOString() });
  await modifica("document_expectation",
    `relationship_id=eq.${idRapporto}&state=in.(overdue,awaiting,not_yet_due)`,
    { state: "not_expected_closed", rationale: "Rapporto dichiarato chiuso dall'intestatario" });
  await traccia("relationship.close", "relationship", idRapporto, "Chiusura dichiarata dall'intestatario");
  await ricarica();
  disegna();
}

/* ── Le riparazioni ─────────────────────────────────────────────────────────
   Ogni azione qui sposta prove da un rapporto a un altro. Nessuna cancella
   niente: i documenti restano, cambiano solo di appartenenza, e ogni
   spostamento lascia una traccia in audit.
   ─────────────────────────────────────────────────────────────────────────── */

const NOME_GENERE = {
  cash_account: "Conto", credit_facility: "Carta di credito",
  securities_dossier: "Dossier titoli", payment_instrument: "Strumento",
  insurance_policy: "Polizza", loan: "Finanziamento",
};

function box(html) {
  const b = document.getElementById("modulo-azione");
  if (!b) return;
  b.innerHTML = html;
  if (html) b.scrollIntoView({ block: "start", behavior: "smooth" });
}
const esito = (m, ok = false) =>
  document.getElementById("esito-azione").innerHTML = `<div class="avviso ${ok ? "ok" : "err"}">${esc(m)}</div>`;

/** Sposta documenti, e la copertura che ne deriva, da un rapporto a un altro. */
async function spostaDocumenti(daId, aId, idsDocumenti) {
  for (const idDoc of idsDocumenti) {
    await cancella("document_relationship", `relationship_id=eq.${daId}&document_id=eq.${idDoc}`);
    await scrivi("document_relationship", [{
      owner: sessione.utente.id, document_id: idDoc, relationship_id: aId,
      confidence: 1, status: "user_confirmed",
    }], { fondi: true, conflitto: "owner,document_id,relationship_id" });
    await modifica("coverage", `document_id=eq.${idDoc}&relationship_id=eq.${daId}`,
      { relationship_id: aId });
  }
}

/* ── Separare un rapporto che ne contiene due ──────────────────────────── */

  const docs = documentiDi(id);

          <div class="meta">${elenco.slice(0, 4).map((d) => `<span>${esc(nomeFile(d))}</span>`).join("")}${
            elenco.length > 4 ? `<span>e altri ${elenco.length - 4}</span>` : ""}</div>
          <label class="campo" style="margin-top:0.5rem"><span>Quale numero è questo?</span>
            <select id="sep-${esc(serie)}">

              ${forti.map((i) => `<option value="${esc(i.id)}">${esc(ETICHETTA_IDENT[i.type] ?? i.type)} ${esc(i.masked)}</option>`).join("")}
            </select></label>
        </div>`).join("")}

      ${senzaSerie ? `<div class="note risk">${senzaSerie} document${senzaSerie === 1 ? "o" : "i"} non
        hanno una serie e restano dove sono. Li puoi spostare a mano dopo.</div>` : ""}
      <div class="note">Se non sai a quale numero corrisponde una serie, lascia «non lo so»: la separazione
      avviene lo stesso e assegni i numeri più tardi. Meglio due rapporti giusti senza etichetta che uno
      solo che somma conti diversi.</div>

      <div class="actions">
        <button class="act" data-fai-separazione="${esc(id)}">Separa</button>

async function eseguiSeparazione(id) {
  const r = perRapporto(id);
  const docs = documentiDi(id);
  const perSerie = raggruppa(
    docs.filter((d) => d.document_type === "bank_account_statement" && serieDi(d)), (d) => serieDi(d));
  const gruppi = [...perSerie.entries()].sort((a, b) => b[1].length - a[1].length);

  const scelte = gruppi.map(([serie]) => document.getElementById(`sep-${serie}`)?.value || "");
  if (new Set(scelte.filter(Boolean)).size !== scelte.filter(Boolean).length) {
    esito("Hai assegnato lo stesso numero a due serie diverse."); return;
  }

  try {
    esito("Separazione in corso…", true);
    for (let n = 1; n < gruppi.length; n++) {
      const [serie, elenco] = gruppi[n];
      const nuovoId = crypto.randomUUID();
      await scrivi("relationship", [{
        id: nuovoId, owner: sessione.utente.id,
        institution_key: r.institution_key, institution_label: r.institution_label,
        entity_kind: r.entity_kind,
        display_name: `${NOME_GENERE[r.entity_kind]} ${r.institution_label} — serie ${serie}`,
        currency: r.currency, status: "open", confirmation: "proposed",
        origin: "manual", confidence: 0.99, disposition: "needs_confirmation",
        cadence: r.cadence, cadence_status: r.cadence_status,
      }], { fondi: false });

      await spostaDocumenti(id, nuovoId, elenco.map((d) => d.id));
      if (scelte[n]) await modifica("relationship_identifier", `id=eq.${scelte[n]}`, { relationship_id: nuovoId });
      await traccia("relationship.split", "relationship", id,
        `Serie ${serie} separata in un rapporto proprio (${elenco.length} documenti)`);
    }
    if (scelte[0]) await modifica("relationship_identifier", `id=eq.${scelte[0]}`, { relationship_id: id });

    esito(`Separati. Ora sono ${gruppi.length} rapporti distinti.`, true);
    await ricarica();
    setTimeout(disegna, 900);
  } catch (e) { esito(e.message); }
}

/* ── Unire rapporti che sono lo stesso rapporto ────────────────────────────
   Il caso tipico e' la carta che scade e viene rifatta: l'emittente cambia il
   numero, il rapporto resta quello. Tenerli separati spezza in due lo storico
   e fa comparire dal nulla, sul rapporto nuovo, un debito che era gia' li'.
   ─────────────────────────────────────────────────────────────────────────── */

const periodoDi = (id) => {
  const c = dati.copertura.filter((x) => x.relationship_id === id);
  if (!c.length) return { da: null, a: null };
  return { da: c.map((x) => x.start_date).sort()[0], a: c.map((x) => x.end_date).sort().at(-1) };
};

function mostraUnione(id, suggerito = "") {
  const r = perRapporto(id);
  const candidati = dati.rapporti
    .filter((x) => x.id !== id && x.institution_key === r.institution_key && x.confirmation !== "rejected")
    .map((x) => ({ x, p: periodoDi(x.id), docs: documentiDi(x.id).length }))
    .sort((a, b) => (a.p.da ?? "9") < (b.p.da ?? "9") ? -1 : 1);

  if (!candidati.length) {
    box(`<div class="card"><div class="note">Non ci sono altri rapporti di ${esc(r.institution_label)} con cui unirlo.</div></div>`);
    return;
  }

  const mio = periodoDi(id);

  box(`
    <div class="card" style="background:var(--surface-2)">
      <h3>Unisci «${esc(r.display_name)}» a un altro rapporto</h3>
      <p>Diventeranno un rapporto solo. I documenti, i periodi e le scadenze si sommano;
      le carte diventano una successione, ciascuna con il suo periodo di validità.</p>

      <div class="card">
        <h3>Questo <span class="badge mute">${documentiDi(id).length} documenti</span></h3>
        <div class="meta">
          ${mio.da ? `<span>${dataBreve(mio.da)} → ${dataBreve(mio.a)}</span>` : "<span>periodo ignoto</span>"}
          ${strumentiDi(id).map((s) => `<span><code>${esc(s.masked_pan)}</code></span>`).join("")}
        </div>
      </div>

      <p style="color:var(--text);font-size:0.88rem;margin-top:0.8rem"><strong>Da unire con:</strong></p>
      ${candidati.map(({ x, p, docs }) => `
        <label class="card" style="display:block;cursor:pointer">
          <span style="display:flex;gap:0.6rem;align-items:flex-start">
            <input type="checkbox" class="uni" value="${esc(x.id)}"${x.id === suggerito ? " checked" : ""} style="margin-top:0.3rem">
            <span style="flex:1">
              <strong style="font-size:0.93rem">${esc(x.display_name)}</strong>
              <span class="meta" style="margin-top:0.3rem">
                <span>${docs} documenti</span>
                ${p.da ? `<span>${dataBreve(p.da)} → ${dataBreve(p.a)}</span>` : ""}
                ${strumentiDi(x.id).map((s) => `<span><code>${esc(s.masked_pan)}</code></span>`).join("")}
              </span>
            </span>
          </span>
        </label>`).join("")}

      <label class="campo" style="margin-top:0.7rem"><span>Nome del rapporto unito</span>
        <input type="text" id="nome-unito" value="${esc(r.display_name)}"></label>

      <div class="note risk">L'unione non si annulla con un clic: i documenti finiscono tutti sotto un
      rapporto solo e per tornare indietro bisogna separarli. Unisci solo se sei sicuro che siano
      la stessa cosa.</div>
      <div class="actions">
        <button class="act" data-fai-unione="${esc(id)}">Uniscili</button>
        <button class="act ghost" data-chiudi-azione="1">Annulla</button>
      </div>
      <div id="esito-azione"></div>
    </div>`);
}

async function eseguiUnione(id) {
  const assorbiti = [...document.querySelectorAll("input.uni:checked")].map((c) => c.value);
  if (!assorbiti.length) { esito("Non hai scelto nessun rapporto da unire."); return; }
  const nome = (document.getElementById("nome-unito").value || "").trim();
  if (!nome) { esito("Dai un nome al rapporto unito."); return; }

  try {
    esito("Unione in corso…", true);

    // PRIMA di muovere qualunque cosa mi segno da quale rapporto viene ogni
    // carta e che periodo copriva. Dopo l'unione i documenti stanno tutti
    // sotto un rapporto solo e non sarebbe piu' possibile ricostruirlo.
    const periodiCarte = new Map();
    for (const rid of [id, ...assorbiti]) {
      const p = periodoDi(rid);
      for (const s of strumentiDi(rid)) periodiCarte.set(s.id, s.valid_from ? { da: s.valid_from, a: s.valid_to } : p);
    }

    for (const a of assorbiti) {
      await spostaDocumenti(a, id, documentiDi(a).map((d) => d.id));
      // Quello che resta legato al rapporto assorbito passa al principale.
      await modifica("coverage", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("payment_instrument", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("relationship_identifier", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("document_expectation", `relationship_id=eq.${a}`, { relationship_id: id });
      await modifica("relationship", `id=eq.${a}`,
        { confirmation: "rejected", status: "closed", closure_evidence: "user_confirmed",
          updated_at: new Date().toISOString() });
      await traccia("relationship.merge", "relationship", a,
        `Unito a ${nome}: era lo stesso rapporto`);
    }

    // Le carte diventano una successione ordinata nel tempo. I periodi di
    // validita' vengono dai documenti, non da quello che si immagina: ogni
    // carta vale dal primo al giorno prima della successiva; l'ultima resta
    // aperta perche' e' quella in uso.
    await ricarica();
    const carte = strumentiDi(id)
      .map((s) => ({ s, p: periodiCarte.get(s.id) ?? { da: null, a: null } }))
      .sort((a, b) => (a.p.da ?? "9999") < (b.p.da ?? "9999") ? -1 : 1);

    for (let n = 0; n < carte.length; n++) {
      const { s, p } = carte[n];
      const dopo = carte[n + 1];
      await modifica("payment_instrument", `id=eq.${s.id}`, {
        valid_from: p.da ?? null,
        valid_to: dopo ? (dopo.p.da ?? p.a ?? null) : null,
        replaces_id: n > 0 ? carte[n - 1].s.id : null,
        succession_status: "user_confirmed",
        succession_rung: "explicit_document",
        succession_proof: "Successione confermata dall'intestatario: è sempre stata la stessa carta, rifatta alla scadenza",
      });
    }

    await modifica("relationship", `id=eq.${id}`,
      { display_name: nome, confirmation: "user_confirmed", updated_at: new Date().toISOString() });
    await traccia("relationship.merge", "relationship", id,
      `${assorbiti.length} rapporti assorbiti; ${carte.length} carte messe in successione`);

    esito(`Uniti. Ora è un rapporto solo con ${carte.length} carte in successione.`, true);
    await ricarica();
    setTimeout(disegna, 1000);
  } catch (e) { esito(e.message); }
}

/* ── Togliere una carta inserita per sbaglio ───────────────────────────── */

async function rimuoviCarta(idCarta) {
  const s = strumento(idCarta);
  if (!s) return;
  if (!confirm(`Togliere la carta ${s.masked_pan}?\n\nI documenti restano dove sono: sparisce solo la carta dall'elenco.`)) return;
  try {
    // Chi la indicava come propria antenata resta senza antenata, altrimenti
    // il database rifiuta la cancellazione.
    for (const altro of dati.strumenti.filter((x) => x.replaces_id === idCarta)) {
      await modifica("payment_instrument", `id=eq.${altro.id}`, { replaces_id: s.replaces_id ?? null });
    }
    await cancella("payment_instrument", `id=eq.${idCarta}`);
    await traccia("instrument.remove", "payment_instrument", idCarta,
      `Carta ${s.masked_pan} tolta: inserita per sbaglio`);
    await ricarica();
    disegna();
  } catch (e) { alert(`Non è riuscito: ${e.message}`); }
}

async function eseguiSpostamento(id) {
  const a = document.getElementById("destinazione").value;
  if (!a) { esito("Scegli il rapporto di destinazione."); return; }
  const scelti = [...document.querySelectorAll("input.est:checked")].map((c) => c.value);
  if (!scelti.length) { esito("Non hai selezionato nessun documento."); return; }
  try {
    esito("Spostamento in corso…", true);

   Qui vale la regola che tiene in piedi tutto: la spesa e' quella e una sola

   spese — sono lo stesso denaro visto da un'altra parte — e aprendole si
   arriva alla spesa vera.

const EVENTO = {
  expense: { nome: "spesa", badge: "stop" },
  income: { nome: "entrata", badge: "ok" },
  internal_transfer: { nome: "giro interno", badge: "mute" },
  card_settlement: { nome: "saldo carta", badge: "mute" },

const importoSu = (id, filtro) => {
  const s = scrittureDi(id).find((x) => filtro(indice.perConto.get(x.account_id)));
  return s ? BigInt(s.amount_minor) : null;
};
/** L'importo che caratterizza il movimento: quello sul conto o sulla carta. */
const importoMov = (id) => {
  const s = scrittureDi(id).find((x) => ["asset_cash", "liability_credit"].includes(indice.perConto.get(x.account_id)?.kind));
  return s ? BigInt(s.amount_minor) : (BigInt(scrittureDi(id)[0]?.amount_minor ?? 0));
};

  const elenco = dati.movimenti.filter((m) => {
    if (filtroMov.evento && m.event_type !== filtroMov.evento) return false;

    if (filtroMov.conto && !scrittureDi(m.id).some((s) => s.account_id === filtroMov.conto)) return false;
    if (filtroMov.categoria && !contiDi(m.id).some((c) => c.category === filtroMov.categoria)) return false;

    return true;

      const ev = EVENTO[m.event_type] ?? { nome: m.event_type, badge: "mute" };
