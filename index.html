        const ultimo = dati.movimenti.reduce((m, t) => (t.economic_date > m ? t.economic_date : m), "0000-00-00");
        const P = risolviPeriodo(periodoAnalisi, ultimo);
        if (P.dal) { filtroMov.dal = P.dal; filtroMov.al = P.al; }
      }
      if (che === "conto") filtroMov.prodotti = [valore];
      if (che === "evento") filtroMov.evento = valore;
      if (che === "categoria") filtroMov.categorie = [valore];
      if (che === "cerca") filtroMov.cerca = valore;
      bozzaMov = copiaFiltro(filtroMov);
      apertoMov = null;
      location.hash = "#/movimenti";
      return;
    }

    const scheda = e.target.closest("[data-movimento]");
    if (scheda && !e.target.closest("button")) {
      apertoMov = apertoMov === scheda.dataset.movimento ? null : scheda.dataset.movimento;
      disegna();
      if (apertoMov) document.querySelector(`[data-movimento="${apertoMov}"]`)
        ?.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }

    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;

    if (d.conferma) {
      await modifica("relationship", `id=eq.${d.conferma}`,
        { confirmation: "user_confirmed", updated_at: new Date().toISOString() });
      await modifica("relationship_identifier",
        `relationship_id=eq.${d.conferma}&strength=eq.strong`, { status: "verified" });
      await traccia("relationship.confirm", "relationship", d.conferma, "Confermato dall'intestatario");
      await ricarica(); disegna();
    }
    if (d.rifiuta) {
      if (!confirm("Segnare questo rapporto come non tuo? Resterà in archivio, escluso da tutto il resto.")) return;
      await modifica("relationship", `id=eq.${d.rifiuta}`,
        { confirmation: "rejected", updated_at: new Date().toISOString() });
      await traccia("relationship.reject", "relationship", d.rifiuta, "Non riconosciuto dall'intestatario");
      await ricarica(); disegna();
    }
    if (d.separa) mostraSeparazione(d.separa);
    if (d.unisci) mostraUnione(d.unisci, d.con ?? "");
    if (d.faiUnione) await eseguiUnione(d.faiUnione);
    if (d.rimuoviCarta) await rimuoviCarta(d.rimuoviCarta);
    if (d.estranei) mostraEstranei(d.estranei);
    if (d.archivia) mostraArchiviazione(d.archivia);
    if (d.tipo) mostraCambioTipo(d.tipo);
    if (d.chiudiAzione) box("");
    if (d.faiSeparazione) await eseguiSeparazione(d.faiSeparazione);
    if (d.faiSpostamento) await eseguiSpostamento(d.faiSpostamento);
    if (d.faiArchiviazione) await eseguiArchiviazione(d.faiArchiviazione);
    if (d.faiTipo) await eseguiCambioTipo(d.faiTipo);

    if (d.sostituita) document.getElementById(`modulo-${d.sostituita}`).innerHTML = moduloSostituzione(d.sostituita);
    if (d.annulla) document.getElementById(`modulo-${d.annulla}`).innerHTML = "";
    if (d.salvaSostituzione) await registraSostituzione(d.salvaSostituzione);
    if (d.chiuso) await chiudiRapporto(d.chiuso);
    if (d.caricare) {
      document.getElementById(`modulo-${d.caricare}`).innerHTML =
        `<div class="note proof">Va bene: il sollecito resta finché il documento non arriva.
         Caricalo dalla scheda «Carica» quando ce l'hai.</div>`;
    }
  };
}

function mostraAccesso() {
  document.getElementById("app").hidden = true;
  document.getElementById("accesso").hidden = false;
}

async function mostraApp() {
  document.getElementById("accesso").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("sottotitolo").textContent = sessione.utente.email;
  try {
    await ricarica();
  } catch (e) {
    document.getElementById("pagina").innerHTML =
      `<div class="avviso err">Non riesco a leggere i dati: ${esc(e.message)}</div>`;
    return;
  }
  disegna();
}

document.getElementById("modulo-accesso").onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById("pulsante-accesso");
  const avviso = document.getElementById("accesso-avviso");
  b.disabled = true; b.textContent = "Verifico…"; avviso.innerHTML = "";
  try {
    await autentica(document.getElementById("email").value.trim(),
                    document.getElementById("password").value);
    document.getElementById("password").value = "";
    await mostraApp();
  } catch (err) {
    avviso.innerHTML = `<div class="avviso err">${esc(err.message)}</div>`;
  } finally {
    b.disabled = false; b.textContent = "Entra";
  }
};

/* ── Quando la parola d'accesso non si trova ────────────────────────────────
   Non c'è modo di recuperarla — non è salvata da nessuna parte, ed è giusto
   così. Se ne sceglie una nuova, e l'unica prova che si è chi si dice è la
   casella di posta: il link arriva lì e vale una volta sola. */
document.getElementById("scordata").onclick = async (e) => {
  e.preventDefault();
  const avviso = document.getElementById("accesso-avviso");
  const posta = document.getElementById("email").value.trim();
  if (!posta) {
    avviso.innerHTML = `<div class="avviso err">Scrivi prima il tuo indirizzo di posta qui sopra.</div>`;
    document.getElementById("email").focus();
    return;
  }
  avviso.innerHTML = `<div class="avviso">Mando il link…</div>`;
  try {
    const r = await fetch(`${BASE}/auth/v1/recover`, {
      method: "POST",
      headers: { apikey: ANON, "content-type": "application/json" },
      body: JSON.stringify({ email: posta, gotrue_meta_security: {},
        redirect_to: location.origin + location.pathname }),
    });
    /* Supabase risponde 200 anche se quell'indirizzo non esiste: è voluto,
       altrimenti chiunque potrebbe scoprire chi ha un accesso. */
    if (!r.ok) throw new Error(`${r.status} — ${(await r.text()).slice(0, 160)}`);
    avviso.innerHTML = `<div class="avviso ok">Se quell'indirizzo ha un accesso, fra poco ricevi
      una mail con un link. Aprila su questo stesso dispositivo: da lì scegli la parola nuova.</div>`;
  } catch (err) {
    avviso.innerHTML = `<div class="avviso err">Non sono riuscito a mandarlo: ${esc(err.message)}</div>`;
  }
};

document.getElementById("modulo-nuova").onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById("pulsante-nuova");
  const avviso = document.getElementById("nuova-avviso");
  const a = document.getElementById("parola1").value, due = document.getElementById("parola2").value;
  if (a !== due) {
    avviso.innerHTML = `<div class="avviso err">Le due non coincidono.</div>`;
    return;
  }
  b.disabled = true; b.textContent = "Salvo…";
  try {
    const r = await fetch(`${BASE}/auth/v1/user`, {
      method: "PUT",
      headers: { apikey: ANON, authorization: `Bearer ${sessione.access_token}`,
                 "content-type": "application/json" },
      body: JSON.stringify({ password: a }),
    });
    if (!r.ok) throw new Error((await r.text()).slice(0, 200));
    document.getElementById("parola1").value = "";
    document.getElementById("parola2").value = "";
    document.getElementById("nuova-parola").hidden = true;
    location.hash = "#/";
    await mostraApp();
  } catch (err) {
    avviso.innerHTML = `<div class="avviso err">${esc(err.message)}</div>`;
  } finally {
    b.disabled = false; b.textContent = "Salva ed entra";
  }
};

document.getElementById("aggiorna").onclick = async () => {
  const b = document.getElementById("aggiorna");
  b.disabled = true; b.textContent = "…";
  try { await ricarica(); disegna(); } catch { /* la pagina resta com'è */ }
  b.disabled = false; b.textContent = "Aggiorna";
};

window.addEventListener("hashchange", () => { if (sessione) disegna(); });

/* Il link ricevuto per posta torna qui con il gettone nella parte dopo il
   cancelletto — che è anche il posto dove questa app tiene la pagina corrente.
   Va letto e ripulito subito, altrimenti il router lo scambia per un indirizzo
   e il gettone resta scritto nella barra. */
function arrivoDalLink() {
  const h = location.hash.startsWith("#") ? location.hash.slice(1) : "";
  if (!h.includes("access_token=")) return null;
  const p = new URLSearchParams(h);
  const gettone = p.get("access_token"), tipo = p.get("type");
  if (!gettone) return null;
  history.replaceState(null, "", location.pathname);
  return { gettone, ricambio: p.get("refresh_token"), tipo,
           durata: Number(p.get("expires_in") ?? 3600) };
}

const dalLink = arrivoDalLink();
caricaSessione();

if (dalLink) {
  /* Si entra con quel gettone e si mostra soltanto la scelta della parola
     nuova: da un link di recupero non si fa altro. */
  (async () => {
    try {
      const r = await fetch(`${BASE}/auth/v1/user`, {
        headers: { apikey: ANON, authorization: `Bearer ${dalLink.gettone}` } });
      if (!r.ok) throw new Error("il link non è più valido");
      const utente = await r.json();
      salvaSessione({ access_token: dalLink.gettone, refresh_token: dalLink.ricambio,
                      scade: Date.now() + dalLink.durata * 1000, utente });
      if (dalLink.tipo === "recovery") {
        document.getElementById("accesso").hidden = true;
        document.getElementById("nuova-parola").hidden = false;
      } else await mostraApp();
    } catch (err) {
      mostraAccesso();
      document.getElementById("accesso-avviso").innerHTML =
        `<div class="avviso err">${esc(err.message)}. Chiedine un altro.</div>`;
    }
  })();
} else if (!sessione) {
  mostraAccesso();
} else if (Date.now() < sessione.scade - 60000) {
  // Il gettone e' ancora buono: non lo si rinnova.
  // Ogni rinnovo consuma quello di ricambio e ne emette uno nuovo; due
  // rinnovi ravvicinati — due schede, un ricaricamento durante il primo —
  // presentano un ricambio gia' speso e la sessione salta. Rinnovare a ogni
  // apertura era proprio il modo di far cadere una sessione valida.
  mostraApp();
} else {
  rinnova().then(mostraApp).catch(mostraAccesso);
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => { /* l'app funziona lo stesso */ });
}
