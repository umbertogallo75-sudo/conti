<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conti">
<meta name="robots" content="noindex, nofollow">
<title>Conti personali</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icona-180.png">

<style>
/* Nessuna informazione affidata al solo colore: ogni stato ha un'etichetta. */
:root {
  --bg:#f4f6f8; --surface:#fff; --surface-2:#eef1f4; --border:#dbe0e6;
  --text:#14171c; --muted:#5a616e;
  /* Il verde è quello dell'internet banking che gli è familiare: le stesse
     cose devono avere lo stesso colore che hanno sul sito della banca,
     altrimenti ogni pagina va riletta da capo. */
  --brand:#00714a; --brand-2:#009060; --brand-chiaro:#e7f3ee; --su-brand:#fff;
  --accent:var(--brand);
  --ok:#0f7a3d; --warn:#8a5a00; --stop:#a3222a; --radius:14px;
  --ombra:0 1px 2px rgba(16,24,32,0.05), 0 4px 14px rgba(16,24,32,0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0b0d10; --surface:#14181d; --surface-2:#1b2027; --border:#2a313a;
    --text:#e8ecf1; --muted:#9aa4b2;
    --brand:#2fbf85; --brand-2:#57d6a2; --brand-chiaro:#12281f; --su-brand:#06120d;
    --ok:#4ec97f; --warn:#e0b155; --stop:#ff8a8a;
    --ombra:0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.28);
  }
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
a { color:var(--accent); }
.wrap { max-width:860px; margin:0 auto; padding:0 1rem 5rem; }

header.top {
  position:sticky; top:0; z-index:10; background:var(--brand); color:var(--su-brand);
  padding:calc(0.9rem + env(safe-area-inset-top)) 1rem 0.55rem;
}
header.top .riga { display:flex; align-items:baseline; gap:0.6rem; max-width:860px; margin:0 auto; }
header.top h1 { margin:0; font-size:1.05rem; letter-spacing:-0.01em; flex:1; }
header.top p { margin:0.15rem auto 0; max-width:860px; opacity:0.82; font-size:0.82rem; }
header.top .act.ghost { color:var(--su-brand); border-color:rgba(255,255,255,0.45); }
nav.tabs {
  display:flex; gap:0.3rem; overflow-x:auto; margin:0.7rem auto 0; max-width:860px;
  padding-bottom:0.1rem; scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs a {
  flex:0 0 auto; text-decoration:none; color:var(--su-brand); padding:0.4rem 0.8rem;
  border-radius:999px; border:1px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.1);
  font-size:0.86rem; white-space:nowrap;
}
nav.tabs a[aria-current="page"] { background:var(--su-brand); border-color:var(--su-brand); color:var(--brand); font-weight:600; }
nav.tabs a .n {
  display:inline-block; margin-left:0.4rem; padding:0 0.36rem; border-radius:999px;
  background:rgba(255,255,255,0.2); font-size:0.76rem; font-variant-numeric:tabular-nums;
}
nav.tabs a[aria-current="page"] .n { background:var(--brand-chiaro); color:var(--brand); }

/* Al buio la banda verde piena è una lampada: di notte si guarda il telefono
   a letto. La banda diventa scura, e il verde resta dov'è utile — la scheda
   accesa e la riga sotto. */
@media (prefers-color-scheme: dark) {
  header.top { background:var(--surface); color:var(--text); box-shadow:inset 0 -2px 0 var(--brand); }
  header.top .act.ghost { color:var(--text); border-color:var(--border); }
  nav.tabs a { color:var(--text); border-color:var(--border); background:var(--surface-2); }
  nav.tabs a[aria-current="page"] { background:var(--brand); border-color:var(--brand); color:var(--su-brand); }
  nav.tabs a .n { background:var(--bg); color:var(--muted); }
}

h2 { font-size:1rem; margin:1.6rem 0 0.6rem; letter-spacing:-0.01em; }
h2 .sub { font-weight:400; color:var(--muted); font-size:0.84rem; margin-left:0.4rem; }
.card {
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--ombra);
  border-radius:var(--radius); padding:0.85rem 0.95rem; margin-bottom:0.6rem;
}
.card h3 { margin:0 0 0.15rem; font-size:0.95rem; display:flex; gap:0.5rem; align-items:baseline; flex-wrap:wrap; }
.card p { margin:0.3rem 0 0; color:var(--muted); font-size:0.86rem; }
.card .meta {
  margin-top:0.5rem; font-size:0.79rem; color:var(--muted);
  display:flex; flex-wrap:wrap; gap:0.15rem 0.8rem; font-variant-numeric:tabular-nums;
}
.card code { font-size:0.79rem; background:var(--surface-2); padding:0.05rem 0.3rem; border-radius:5px; }

.badge {
  display:inline-block; font-size:0.72rem; font-weight:600; padding:0.12rem 0.5rem;
  border-radius:999px; border:1px solid; letter-spacing:0.01em; white-space:nowrap;
}
.badge.ok{color:var(--ok);border-color:var(--ok)} .badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.stop{color:var(--stop);border-color:var(--stop)} .badge.mute{color:var(--muted);border-color:var(--border)}

.tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:0.55rem; margin-top:0.9rem; }
@media (min-width:620px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:0.7rem 0.8rem; text-decoration:none; color:inherit; display:block;
}
.tile .v { font-size:clamp(1.05rem, 4.4vw, 1.35rem); font-weight:650;
  font-variant-numeric:tabular-nums; letter-spacing:-0.02em; white-space:nowrap; }
.tile .k { font-size:0.78rem; color:var(--muted); }
.tile .k2 { margin-top:0.3rem; }

.empty {
  border:1px dashed var(--border); border-radius:var(--radius);
  padding:1.4rem 1rem; text-align:center; color:var(--muted); font-size:0.88rem;
}
button.act {
  font:inherit; font-size:0.83rem; font-weight:600; cursor:pointer; padding:0.45rem 0.85rem;
  border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff;
}
button.act.ghost { background:transparent; color:var(--text); border-color:var(--border); }
button.act.pericolo { background:transparent; color:var(--stop); border-color:var(--stop); }
button.act[disabled] { opacity:0.5; cursor:default; }
details.filtri > summary {
  list-style:none; cursor:pointer; display:flex; align-items:center; gap:0.7rem;
  margin:-0.85rem -0.95rem; padding:0.85rem 0.95rem;
}
details.filtri > summary::-webkit-details-marker { display:none; }
details.filtri[open] > summary { margin-bottom:0.35rem; border-bottom:1px solid var(--border); }
details.filtri > summary .che {
  flex:1; min-width:0; font-size:0.86rem; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
details.filtri > summary .apri {
  flex:0 0 auto; font-size:0.82rem; font-weight:600; color:var(--brand);
  border:1px solid var(--border); border-radius:999px; padding:0.25rem 0.75rem;
}
details.filtri[open] > summary .apri::after { content:" ▴"; }
details.filtri:not([open]) > summary .apri::after { content:" ▾"; }
.filtri .griglia-filtri {
  display:grid; gap:0.7rem 0.8rem;
  grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
}
.filtri .campo.larga { grid-column:1 / -1; }
.filtri .coppia { display:flex; gap:0.4rem; }
.filtri .coppia > * { flex:1; min-width:0; }
.filtri .azioni-filtri {
  display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap;
  margin-top:0.9rem; padding-top:0.8rem; border-top:1px solid var(--border);
}
.filtri .azioni-filtri .note { flex:1; margin:0; border:0; padding:0; }
details.tendina {
  border:1px solid var(--border); border-radius:8px; background:var(--sfondo-campo, #fff);
}
details.tendina > summary {
  list-style:none; cursor:pointer; padding:0.5rem 0.6rem; font-size:0.9rem;
  display:flex; justify-content:space-between; align-items:center;
}
details.tendina > summary::-webkit-details-marker { display:none; }
details.tendina > summary::after { content:"▾"; color:var(--muted); margin-left:0.5rem; }
details.tendina[open] > summary::after { content:"▴"; }
details.tendina .voci { max-height:14rem; overflow:auto; border-top:1px solid var(--border); padding:0.3rem; }
details.tendina .voce {
  display:flex; align-items:center; gap:0.5rem; padding:0.35rem 0.4rem;
  font-size:0.88rem; border-radius:6px; cursor:pointer;
}
details.tendina .voce:hover { background:var(--riga, rgba(0,0,0,0.04)); }
details.tendina .voce input { width:1rem; height:1rem; flex:0 0 auto; }

/* ── L'elenco dei movimenti, nella forma di un estratto conto ───────────── */
.riga-mov { border-bottom:1px solid var(--border); background:var(--carta, #fff); }
.riga-mov:first-of-type { border-top:1px solid var(--border); }
.riga-mov.aperta { background:var(--riga, rgba(0,0,0,0.02)); }
.riga-mov.provvisoria .testa { background:repeating-linear-gradient(135deg,
  transparent, transparent 8px, rgba(0,0,0,0.02) 8px, rgba(0,0,0,0.02) 16px); }
.riga-mov .testa {
  display:grid; align-items:center; gap:0.6rem; padding:0.7rem 0.6rem; cursor:pointer;
  grid-template-columns:2.6rem minmax(0,1fr) auto;
}
@media (min-width: 760px) {
  .riga-mov .testa { grid-template-columns:3rem minmax(0,1fr) 7rem 9rem auto 1.2rem; }
}
.riga-mov .quando { text-align:center; line-height:1.05; }
.riga-mov .quando b { display:block; font-size:1.15rem; }
.riga-mov .quando span { display:block; font-size:0.66rem; letter-spacing:0.05em; color:var(--muted); }
.riga-mov .quando i { display:block; font-size:0.6rem; font-style:normal; color:var(--muted); opacity:0.7; }
.riga-mov .che-cosa strong { display:block; font-size:0.92rem; font-weight:600; }
.riga-mov .che-cosa .sotto { display:flex; flex-wrap:wrap; gap:0.35rem; align-items:center; margin-top:0.15rem; }
.riga-mov .che-cosa .conto { font-size:0.78rem; color:var(--muted); }
/* La stringa della banca sotto il nome vero: piccola, ma sempre lì. */
.riga-mov .che-cosa .grezzo {
  display:block; font-size:0.72rem; color:var(--muted); margin-top:0.05rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.riga-mov .che-cosa .dubbio { font-size:0.78rem; color:var(--warn); font-weight:400; }
.riga-mov .che-cosa .dubbio.ok { color:var(--ok); }
.riga-mov .settore {
  font-size:0.7rem; padding:0.05rem 0.45rem; border-radius:999px;
  background:var(--brand-chiaro); color:var(--brand); font-weight:600;
}
.riga-mov .etichetta {
  font-size:0.7rem; padding:0.05rem 0.4rem; border-radius:999px;
  border:1px solid var(--accent); color:var(--accent);
}
.riga-mov .istituto { font-size:0.72rem; color:var(--muted); text-align:center; }
.riga-mov .genere { display:flex; align-items:center; gap:0.4rem; min-width:0; }
.riga-mov .genere > span:last-child {
  font-size:0.64rem; letter-spacing:0.03em; color:var(--muted); line-height:1.1;
}
.riga-mov .tondo {
  flex:0 0 auto; width:1.9rem; height:1.9rem; border-radius:999px;
  border:1px solid var(--accent); display:grid; place-items:center;
}
.riga-mov .tondo svg { width:1rem; height:1rem; fill:none; stroke:var(--accent); stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }
.riga-mov .quanto { text-align:right; white-space:nowrap; }
.riga-mov .quanto b { font-size:1rem; font-variant-numeric:tabular-nums; }
.riga-mov .quanto .esce { color:var(--text); }
.riga-mov .quanto .entra { color:var(--ok, #1a7f45); }
.riga-mov .non-contab {
  display:block; font-size:0.6rem; letter-spacing:0.04em; color:var(--warn);
}
.riga-mov .freccia { color:var(--muted); display:none; }
@media (min-width: 760px) { .riga-mov .freccia { display:inline; } .riga-mov .istituto { display:block; } }
@media (max-width: 759px) { .riga-mov .istituto, .riga-mov .genere > span:last-child { display:none; } }
.annota .suddivisione { margin-top:0.8rem; border-top:1px solid var(--border); padding-top:0.7rem; }
.annota .parte { display:flex; gap:0.4rem; margin-bottom:0.35rem; }
.annota .parte .p-importo { flex:0 0 8rem; }
.annota .parte .p-categoria { flex:1; min-width:0; }

/* ── La prima pagina ────────────────────────────────────────────────────── */
.banche { display:flex; gap:0.4rem; overflow-x:auto; padding-bottom:0.3rem; margin-bottom:0.8rem; }
.banche .scheda {
  font:inherit; font-size:0.82rem; font-weight:600; white-space:nowrap; cursor:pointer;
  padding:0.4rem 0.9rem; border-radius:999px; border:1px solid var(--border);
  background:transparent; color:var(--muted);
}
.banche .scheda.viva { background:var(--accent); border-color:var(--accent); color:#fff; }

.allerte { display:grid; gap:0.4rem; margin-bottom:0.9rem; }
.allerta {
  display:block; padding:0.55rem 0.8rem; border-radius:8px; text-decoration:none;
  border:1px solid var(--border); color:var(--text); font-size:0.88rem;
  border-left-width:4px; border-left-color:var(--accent);
}
.allerta b { font-size:1rem; }
.allerta.err { border-left-color:var(--stop); }
.allerta.warn { border-left-color:var(--warn); }

.quadro { display:grid; gap:1.2rem; align-items:start; }
@media (min-width: 760px) { .quadro { grid-template-columns:200px 1fr; } }
.quadro .disegno { position:relative; display:grid; place-items:center; }
.quadro .ciambella { width:min(200px, 62vw); height:auto; }
.quadro .centro { position:absolute; text-align:center; line-height:1.2; }
.quadro .centro span { display:block; font-size:0.68rem; color:var(--muted); }
.quadro .centro strong { display:block; font-size:1.05rem; font-variant-numeric:tabular-nums; }

.voce-conto {
  display:grid; grid-template-columns:0.6rem minmax(0,1fr) auto; gap:0.6rem; align-items:start;
  padding:0.6rem 0.2rem; border-top:1px solid var(--border); text-decoration:none; color:var(--text);
}
/* Il nome può andare a capo — «Conto Sella … · IT74J…» è lungo — e allora il
   pallino e la cifra si tengono sulla PRIMA riga, non a metà del blocco. */
.voce-conto .pallino, .voce-conto .saldo { margin-top:0.2rem; }
@media (min-width: 620px) { .voce-conto { grid-template-columns:0.6rem 1fr 7rem auto; } }
.voce-conto .pallino { width:0.6rem; height:0.6rem; border-radius:999px; }
.voce-conto .nomi strong { display:block; font-size:0.92rem; }
.voce-conto .nomi small { display:block; font-size:0.7rem; color:var(--muted); }
.voce-conto .istituto { font-size:0.74rem; color:var(--muted); }
@media (max-width: 619px) { .voce-conto .istituto { display:none; } }
.voce-conto .saldo { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }

/* Il blocco di una banca: l'intestazione col totale, poi i conti, e sotto ogni
   conto le sue carte, rientrate. La carta non è un rapporto accanto al conto:
   è una cosa che sta sopra quel conto, e il disegno deve dirlo. */
.istituto-blocco { margin-bottom:1rem; }
.istituto-blocco:last-child { margin-bottom:0; }
.istituto-testa {
  display:flex; justify-content:space-between; align-items:baseline; gap:0.6rem;
  padding:0.35rem 0.2rem; border-bottom:2px solid var(--brand);
}
.istituto-testa strong { font-size:0.86rem; letter-spacing:0.01em; }
.istituto-testa span { font-size:0.86rem; font-variant-numeric:tabular-nums; color:var(--muted); }
.voce-conto.figlia { padding:0.45rem 0.2rem; border-top:0; }
.voce-conto.figlia .nomi strong { font-size:0.85rem; font-weight:500; }
.voce-conto.figlia .ramo {
  width:0.6rem; height:1.5rem; border-left:2px solid var(--border);
  border-bottom:2px solid var(--border); border-bottom-left-radius:6px;
  margin:-0.9rem 0 0 0.25rem;
}
.voce-conto.figlia .saldo { font-weight:500; font-size:0.86rem; color:var(--muted); }


.carte { display:grid; gap:0.7rem; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); }
.carta {
  display:block; padding:0.8rem; border:1px solid var(--border); border-radius:var(--radius);
  text-decoration:none; color:var(--text); background:var(--carta, #fff);
}
.carta .banda { height:1.5rem; border-radius:4px; background:linear-gradient(100deg, #334155, #64748b); margin-bottom:0.6rem; }
.carta strong { display:block; font-size:0.88rem; }
.carta .istituto { display:block; font-size:0.72rem; color:var(--muted); margin-bottom:0.4rem; }
.carta .k { display:block; font-size:0.68rem; color:var(--muted); }
.carta .v { display:block; font-size:1.05rem; font-weight:600; font-variant-numeric:tabular-nums; }
button.act:focus-visible, nav.tabs a:focus-visible, .tile:focus-visible, input:focus-visible {
  outline:3px solid var(--accent); outline-offset:2px;
}
.actions { display:flex; gap:0.5rem; margin-top:0.7rem; flex-wrap:wrap; }
.note { border-left:3px solid var(--border); padding:0.15rem 0 0.15rem 0.7rem; margin-top:0.55rem; color:var(--muted); font-size:0.83rem; }
.note.proof{border-left-color:var(--ok)} .note.risk{border-left-color:var(--warn)} .note.stop{border-left-color:var(--stop)}

input[type=email],input[type=password],input[type=text],select {
  font:inherit; width:100%; padding:0.6rem 0.7rem; border-radius:8px;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
}
label.campo { display:block; margin-bottom:0.7rem; font-size:0.84rem; color:var(--muted); }
label.campo span { display:block; margin-bottom:0.2rem; }

#zona {
  border:2px dashed var(--border); border-radius:var(--radius); padding:2rem 1rem;
  text-align:center; color:var(--muted); background:var(--surface);
}
#zona.sopra { border-color:var(--accent); color:var(--text); background:var(--surface-2); }

.avviso { padding:0.6rem 0.8rem; border-radius:8px; border:1px solid; font-size:0.86rem; margin-bottom:0.7rem; }
.avviso.err { color:var(--stop); border-color:var(--stop); }
.avviso.ok  { color:var(--ok);  border-color:var(--ok); }

.riga-progresso { height:4px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:0.5rem; }
.riga-progresso i { display:block; height:100%; background:var(--accent); width:0; transition:width 0.2s; }

#accesso { max-width:340px; margin:14vh auto 0; padding:0 1.2rem; }
#accesso h1 { font-size:1.2rem; margin:0 0 0.2rem; }
#accesso p.sotto { color:var(--muted); font-size:0.86rem; margin:0 0 1.4rem; }

table.dati { width:100%; border-collapse:collapse; font-size:0.84rem; font-variant-numeric:tabular-nums; }
table.dati th { text-align:left; color:var(--muted); font-weight:600; padding:0.3rem 0.5rem 0.3rem 0; }
table.dati td { padding:0.3rem 0.5rem 0.3rem 0; border-top:1px solid var(--border); }
table.dati td.num { text-align:right; }
.scorri { overflow-x:auto; }


/* ═══ Il linguaggio comune a tutte le pagine ════════════════════════════════
   Fino a ieri ogni pagina aveva un suo modo di presentarsi: una aveva le
   schede in cima, una i riquadri, una soltanto un titolo. Cambiare pagina
   voleva dire rimparare dove guardare.

   Qui sotto ci sono i pochi pezzi che ogni pagina usa — la testata col numero
   grande, le pillole del periodo, il titolo di sezione, il pannello — perché
   le stesse cose si trovino sempre nello stesso posto.
   ═════════════════════════════════════════════════════════════════════════ */

.testata {
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--ombra);
  border-radius:var(--radius); padding:1rem 1.05rem; margin:0.9rem 0 0.9rem;
}
.testata .occhiello {
  font-size:0.72rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted);
}
.testata .grande {
  font-size:clamp(1.9rem, 8vw, 2.6rem); font-weight:680; letter-spacing:-0.03em;
  font-variant-numeric:tabular-nums; line-height:1.12; margin:0.1rem 0 0;
}

   Intl con it-IT non raggruppa i numeri di quattro cifre: 1234,56 invece di
   1.234,56. Il raggruppamento è fatto a mano. Gli importi arrivano in centesimi
   e restano interi fino alla stampa.
   ═══════════════════════════════════════════════════════════════════════════ */

function formattaCentesimi(centesimi, valuta = "EUR") {
  if (centesimi === null || centesimi === undefined) return "—";
  const n = BigInt(centesimi);
  const negativo = n < 0n;
  const assoluto = negativo ? -n : n;
  const intero = (assoluto / 100n).toString();
  const decimali = (assoluto % 100n).toString().padStart(2, "0");
  let gruppi = "";
  for (let i = 0; i < intero.length; i++) {
    if (i > 0 && (intero.length - i) % 3 === 0) gruppi += ".";
    gruppi += intero[i];
  }
  const simbolo = { EUR: "€", USD: "$", GBP: "£", CNY: "¥" }[valuta] ?? valuta;
  return `${negativo ? "−" : ""}${gruppi},${decimali} ${simbolo}`;
}

const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno",

function dataBreve(iso) {
  if (!iso) return "—";
  const [a, m, g] = iso.slice(0, 10).split("-");
  return `${g}.${m}.${a}`;
}
function dataLunga(iso) {
  if (!iso) return "—";
  const [a, m, g] = iso.slice(0, 10).split("-");

}

}
function giorniFra(da, a) {

   ═══════════════════════════════════════════════════════════════════════════ */

let sessione = null;

  try {

  } catch { sessione = null; }
}
function salvaSessione(s) {
  sessione = s;
  try {
    if (s) localStorage.setItem(CHIAVE_SESSIONE, JSON.stringify(s));

}

async function autentica(email, password) {
  const r = await fetch(`${BASE}/auth/v1/token?grant_type=password`, {
    method: "POST", cache: "no-store",
    headers: { apikey: ANON, "content-type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Accesso non riuscito");
  salvaSessione({
    access_token: j.access_token, refresh_token: j.refresh_token,
    scade: Date.now() + (j.expires_in ?? 3600) * 1000,
    utente: { id: j.user.id, email: j.user.email },
  });
  return sessione;
}

async function rinnova() {
  if (!sessione?.refresh_token) throw new Error("nessuna sessione");
  const r = await fetch(`${BASE}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST", cache: "no-store",
    headers: { apikey: ANON, "content-type": "application/json" },
    body: JSON.stringify({ refresh_token: sessione.refresh_token }),
  });
  if (!r.ok) { salvaSessione(null); throw new Error("sessione scaduta"); }
  const j = await r.json();
  salvaSessione({
    access_token: j.access_token, refresh_token: j.refresh_token,
    scade: Date.now() + (j.expires_in ?? 3600) * 1000,
    utente: { id: j.user.id, email: j.user.email },
  });
  return sessione;
}

async function token() {
  if (!sessione) throw new Error("nessuna sessione");
  if (Date.now() > sessione.scade - 60000) await rinnova();
  return sessione.access_token;
}

async function chiama(percorso, opzioni = {}) {
  const t = await token();
  const r = await fetch(`${BASE}${percorso}`, {
    ...opzioni, cache: "no-store",
    headers: {
      apikey: ANON, authorization: `Bearer ${t}`,
      "cache-control": "no-store", ...(opzioni.headers ?? {}),

/**
 * Legge una tabella per intero.
 *
 * Il database restituisce al massimo mille righe per volta. Fermarsi li'
 * significherebbe mostrare i primi mille movimenti e chiamarli «tutti»: i
 * totali sarebbero sbagliati senza che niente lo segnali. Si legge a blocchi
 * finche' non arriva un blocco corto.
 */
async function leggi(tabella, query = "") {
  const BLOCCO = 1000;
  const tutto = [];
  for (let da = 0; ; da += BLOCCO) {
    const r = await chiama(`/rest/v1/${tabella}?${query}`, {
      headers: { range: `${da}-${da + BLOCCO - 1}`, "range-unit": "items" },
    });
    if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
    const blocco = await r.json();
    tutto.push(...blocco);
    if (blocco.length < BLOCCO) return tutto;
    if (da > 200000) return tutto;   // rete di sicurezza contro un ciclo infinito
  }
}

async function scrivi(tabella, righe, { fondi = true, conflitto = "" } = {}) {
  if (!righe.length) return 0;
  let scritte = 0;
  for (let i = 0; i < righe.length; i += 200) {
    const blocco = righe.slice(i, i + 200);
    const q = conflitto ? `?on_conflict=${conflitto}` : "";
    const r = await chiama(`/rest/v1/${tabella}${q}`, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        prefer: fondi ? "resolution=merge-duplicates,return=minimal" : "return=minimal",
      },
      body: JSON.stringify(blocco),
    });
    if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
    scritte += blocco.length;
  }
  return scritte;
}

async function modifica(tabella, filtro, campi) {
  const r = await chiama(`/rest/v1/${tabella}?${filtro}`, {
    method: "PATCH",
    headers: { "content-type": "application/json", prefer: "return=minimal" },
    body: JSON.stringify(campi),
  });
  if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
}

async function cancella(tabella, filtro) {
  const r = await chiama(`/rest/v1/${tabella}?${filtro}`, {
    method: "DELETE", headers: { prefer: "return=minimal" },
  });
  if (!r.ok) throw new Error(`${tabella}: ${await r.text()}`);
}

    ]);
  Object.assign(dati, { rapporti, identificativi, strumenti, documenti, file, copertura, attese, legami, sconosciuti,
    conti, movimenti, scritture, nessi, note, controparti });

  indice.perNota = new Map(note.map((n) => [n.transaction_id, n]));

  BSD: "dollari delle Bahamas", GBP: "sterline", CHF: "franchi svizzeri",
  JPY: "yen", CAD: "dollari canadesi", AUD: "dollari australiani",
  SEK: "corone svedesi", NOK: "corone norvegesi", DKK: "corone danesi",
  PLN: "zloty", HUF: "fiorini", RON: "lei",
};

function inValuta(m) {
  if (!m || !m.original_currency) return "";
  const v = m.original_currency;
  const nome = NOME_VALUTA[v] ?? v;
  const q = m.original_amount_minor != null && m.original_amount_minor !== "0"
    ? formattaCentesimi(BigInt(m.original_amount_minor), "").trim() : null;
  const pezzi = [];
  if (q) pezzi.push(`Operazione di ${q} ${nome} (${v})`);
  else pezzi.push(`Operazione in ${nome} (${v})`);
  if (m.fx_rate) pezzi.push(`cambio ${m.fx_rate}`);
  if (m.fx_fee_minor && m.fx_fee_minor !== "0")
    pezzi.push(`commissione ${formattaCentesimi(BigInt(m.fx_fee_minor))}`);
  pezzi.push(m.fx_source === "documento"
    ? "cambio dichiarato dalla banca sul documento"
    : m.fx_source === "cambio_storico"
      ? "convertito al cambio del giorno dell'operazione"
      : "cambio non disponibile: l'euro qui non è confermato da nessun documento");
  const titolo = pezzi.join(" · ");
  const colore = m.fx_source === "non_disponibile" ? "var(--stop)" : "var(--muted)";
  return `<abbr title="${esc(titolo)}" style="text-decoration:none;cursor:help;color:${colore};font-weight:700">*</abbr>`;
}

/* ── Che fine ha fatto ogni documento ───────────────────────────────────────
   Le banche cambiano il formato degli export senza dirlo. Quando succede, il
   lettore non va in errore: smette semplicemente di trovare le righe, e il
   totale scende. Un numero più basso del vero è il guasto peggiore, perché
   sembra giusto.
   Per questo ogni documento porta un esito, e gli esiti che significano
   «non è entrato» diventano un avviso che non si può non vedere.
   ─────────────────────────────────────────────────────────────────────────── */

const ESITO = {
  importato:          { nome: "Letto e importato", badge: "ok", guarda: false,
    spiega: "Le sue righe sono nel libro mastro." },
  senza_movimenti:    { nome: "Senza movimenti", badge: "mute", guarda: false,
    spiega: "È un documento informativo: non contiene movimenti, e non deve contenerne." },
  usato_per_verifica: { nome: "Usato per verifica", badge: "mute", guarda: false,
    spiega: "Serve a confermare i totali di un altro documento." },
  gia_sul_conto:      { nome: "Già sul conto", badge: "mute", guarda: false,
    spiega: "Le operazioni sono già sul conto corrente. Caricarle anche da qui vorrebbe dire contarle due volte." },
  gia_altrove:        { nome: "Già in un altro documento", badge: "mute", guarda: false,
    spiega: "Le stesse operazioni sono in un'estrazione più ampia dello stesso rapporto." },
  conto_vuoto:        { nome: "Conto fermo", badge: "mute", guarda: false,
    spiega: "Nel periodo non c'è nessuna operazione. Il conto esiste ma non è stato usato." },
  doppione:           { nome: "Doppione", badge: "mute", guarda: false,
    spiega: "Stesso contenuto di un altro file già letto. Non viene contato due volte." },
  non_quadra:         { nome: "Non quadra", badge: "warn", guarda: true,
    spiega: "Il documento è stato riconosciuto, ma le righe lette non ricostruiscono i totali che dichiara. "
          + "È stato tenuto fuori apposta: meglio un periodo in meno che un periodo sbagliato." },
  formato_sconosciuto:{ nome: "Formato non riconosciuto", badge: "err", guarda: true,
    spiega: "Nessun formato conosciuto riconosce questo documento. Se è un estratto conto, "
          + "la banca ha cambiato l'export e serve un lettore nuovo." },
  illeggibile:        { nome: "Illeggibile", badge: "err", guarda: true,
    spiega: "Non se ne ricava testo: può essere la scansione di un foglio, o un file protetto." },
  archiviato:         { nome: "Messo da parte", badge: "mute", guarda: false,
    spiega: "L'hai archiviato tu: non è un documento di transazioni." },
  null:               { nome: "Non ancora esaminato", badge: "mute", guarda: false,
    spiega: "Questo file non è ancora passato dal controllo di lettura." },
};
/* «Conto Intesa 5044» e' esatto e non dice niente. «Conto di casa» dice tutto.
   Il nome tecnico non si butta — serve a ritrovare il conto sui documenti —
   ma passa in secondo piano. */
const nomeConto = (c) => (c && (c.alias || c.name)) || "—";
const nomeRapporto = (r) => (r && (r.alias || r.display_name)) || "—";

const esitoDi = (f) => ESITO[f.read_outcome] ?? ESITO.null;
/* Un contratto caricato per sbaglio non e' un guasto del lettore: e' un
   documento che non c'entra. Archiviarlo lo toglie dagli avvisi senza
   cancellarlo — resta in archivio, con scritto perche' e' li'. */
const daGuardare = () => dati.file.filter((f) => esitoDi(f).guarda && !f.archived_at);
const archiviati = () => dati.file.filter((f) => f.archived_at);

function paginaLetture() {
  const buchi = periodiMancanti();
  const problemi = daGuardare();
  /* Un file archiviato non e' piu' «formato non riconosciuto»: e' un
     documento messo da parte. Continuare a contarlo per il vecchio esito
     lasciava l'avviso in cima alla pagina anche dopo averlo tolto. */
  const perEsito = new Map();
  for (const f of dati.file) {
    const k = f.archived_at ? "archiviato" : (f.read_outcome ?? "null");
    perEsito.set(k, (perEsito.get(k) ?? 0) + 1);
  }

  const chiesti = problemi.filter((f) => f.reprocess_requested_at).length;
  const dentro = dati.file.filter((f) => !f.archived_at &&
    ["importato", "usato_per_verifica", "gia_sul_conto", "gia_altrove", "doppione",
     "senza_movimenti", "conto_vuoto"].includes(f.read_outcome)).length;

  return `
    ${testata({
      occhiello: "Esiti di lettura",
      grande: `${dentro.toLocaleString("it-IT")} <span style="font-size:0.5em;font-weight:400;color:var(--muted)">su ${dati.file.length.toLocaleString("it-IT")}</span>`,
      sotto: problemi.length === 0

    })}

    <div class="card">

      lettura di tutti i ${dati.file.length} file dell'archivio: quelli in fondo alla lista
      sono quelli su cui vale la pena guardare.</p>
      <div class="meta">${[...perEsito.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([k, n]) => `<span>${esc((ESITO[k] ?? ESITO.null).nome)} <strong>${n}</strong></span>`).join("")}</div>
    </div>

    ${problemi.length ? `
      <div class="avviso ${problemi.some((f) => esitoDi(f).badge === "err") ? "err" : "warn"}">

        Finché restano fuori, le spese e le entrate di quei periodi sono più basse del vero.

          <div class="meta">
            <span>${(f.byte_length / 1024).toFixed(0)} kB</span>
            ${f.read_note ? `<span>formato riconosciuto: ${esc(f.read_note)}</span>` : ""}
            ${f.reprocess_requested_at ? `<span>rielaborazione chiesta il ${dataBreve(f.reprocess_requested_at.slice(0, 10))}</span>` : ""}
          </div>
          <p class="note risk">${esc(e.spiega)}</p>
          <div class="actions">
            ${f.reprocess_requested_at
              ? `<span class="badge ok">rielaborazione chiesta</span>`
              : `<button class="act ghost" data-rielabora="${esc(f.id)}">Chiedi di riprovare a leggerlo</button>`}
            <button class="act ghost" data-archivia="${esc(f.id)}">Non è un estratto: archivia</button>
          </div>
          ${f.reprocess_requested_at
            ? `<div class="note proof">Segnato. Quando il lettore sarà pronto, questo documento rientra da solo:
               è già nell'archivio, non devi ricaricarlo.</div>` : ""}
        </div>`;
      }).join("")}

      <div class="card">
        <h3>La richiesta da mandare</h3>
        <p class="note">Questo testo dice esattamente che cosa non si riesce a leggere.

        <textarea id="richiesta" rows="${Math.min(14, problemi.length + 4)}" readonly
          style="width:100%;font-family:ui-monospace,monospace;font-size:0.8rem">${esc(testoRichiesta(problemi))}</textarea>
        <div class="actions"><button class="act ghost" id="copia-richiesta">Copia la richiesta</button></div>
      </div>

      <div class="avviso ok">

    ${buchi.length ? `
      <h2>Periodi senza documenti <span class="sub">gli ultimi due anni</span></h2>
      <div class="avviso warn">
        <strong>${buchi.length} rapport${buchi.length === 1 ? "o ha" : "i hanno"} dei mesi scoperti.</strong>
        In quei mesi le spese risultano zero — e non è che non hai speso: è che manca il documento.
      </div>
      ${buchi.map((b) => `
        <div class="card">
          <h3>${esc(nomeConto(b.conto))}</h3>
          ${b.mancanti.length ? `
            <p class="note risk">Nessun movimento in ${b.mancanti.length} mes${b.mancanti.length === 1 ? "e" : "i"},
            fra periodi che invece ci sono: ${esc(b.mancanti.slice(0, 18).map(meseEsteso).join(", "))}${
              b.mancanti.length > 18 ? " …" : ""}.</p>` : ""}
          ${b.fermoDa ? `<p class="note">L'ultimo movimento è di ${esc(meseEsteso(b.fermoDa))}.
            Se il conto è chiuso o fermo va bene così; se non lo è, manca l'ultimo estratto.</p>` : ""}
        </div>`).join("")}
    ` : `<div class="avviso ok"><strong>Nessun periodo scoperto negli ultimi due anni.</strong>
         Ogni mese di ogni rapporto ha almeno un movimento.</div>`}

    ${archiviati().length ? `
      <h2>Archiviati <span class="sub">non sono estratti conto</span></h2>
      <div class="card">
        <p class="note">Questi documenti li hai messi da parte tu: restano nell'archivio
        e non compaiono più fra gli avvisi. Se ti sei sbagliato, puoi rimetterli in lista.</p>
        <div class="scorri"><table class="dati">
          <thead><tr><th>Documento</th><th>Messo da parte il</th><th></th></tr></thead>
          <tbody>${archiviati().map((f) => `
            <tr><td>${esc(f.display_name)}</td>
                <td>${dataBreve(f.archived_at.slice(0, 10))}</td>
                <td><button class="act ghost" data-riprendi="${esc(f.id)}">Rimetti in lista</button></td></tr>`).join("")}
          </tbody>
        </table></div>

}

function testoRichiesta(problemi) {
  const righe = [
    "Documenti che il programma non riesce a portare nei conti.",
    `Archivio di ${dati.file.length} file, aggiornato al ${new Date().toISOString().slice(0, 10)}.`,
    "",
  ];
  for (const f of problemi) {
    const e = esitoDi(f);
    righe.push(`- [${e.nome}] ${f.display_name}${f.read_note ? `  (formato: ${f.read_note})` : ""}`);
    righe.push(`  ${e.spiega}`);
  }
  return righe.join("\n");
}

async function archiviaDocumento(idFile, riprendi = false) {
  const f = dati.file.find((x) => x.id === idFile);
  if (!f) return;
  const quando = riprendi ? null : new Date().toISOString();
  await modifica("source_file", `id=eq.${idFile}`,
    { archived_at: quando, archived_reason: riprendi ? null : "Non è un documento di transazioni" });
  await traccia(riprendi ? "document.unarchived" : "document.archived", "source_file", idFile,
    `${riprendi ? "Rimesso in lista" : "Archiviato"}: «${f.display_name}»`);
  f.archived_at = quando;
  disegna();
}

async function chiediRielaborazione(idFile) {
  const f = dati.file.find((x) => x.id === idFile);
  if (!f) return;
  await modifica("source_file", `id=eq.${idFile}`, { reprocess_requested_at: new Date().toISOString() });
  await traccia("document.reprocess_requested", "source_file", idFile,
    `Chiesta la rielaborazione di «${f.display_name}» (${f.read_outcome})`);
  f.reprocess_requested_at = new Date().toISOString();
  disegna();
}

/* ── Situazione ─────────────────────────────────────────────────────────── */

let bancaAperta = "";

/* Ogni conto il suo colore: la ciambella e l'elenco devono dire la stessa cosa
   nello stesso ordine, altrimenti il disegno è decorazione e non informazione. */
const COLORI = ["#2563eb", "#16a34a", "#f59e0b", "#db2777", "#0891b2", "#7c3aed",
                "#dc2626", "#65a30d", "#0284c7", "#c026d3", "#ea580c", "#059669"];

/** Una ciambella disegnata a mano: nessuna libreria, nessuna richiesta di rete. */
function ciambella(fette, totale) {
  if (!fette.length || totale === 0n) return "";
  const r = 62, c = 2 * Math.PI * r;
  let acc = 0;
  const archi = fette.map((f, i) => {
    const quota = Number(f.valore) / Number(totale);
    const lung = Math.max(quota * c - 2, 0);
    const cerchio = `<circle r="${r}" cx="80" cy="80" fill="none" stroke="${f.colore}"
      stroke-width="22" stroke-dasharray="${lung} ${c - lung}"
      stroke-dashoffset="${-acc * c}" transform="rotate(-90 80 80)"><title>${esc(f.nome)}</title></circle>`;
    acc += quota;
    return cerchio;
  }).join("");
  return `<svg viewBox="0 0 160 160" class="ciambella" role="img" aria-label="ripartizione dei saldi">
    ${archi}</svg>`;
}

/* ═══ I pezzi che ogni pagina usa ═════════════════════════════════════════ */

/** La testata: che cosa stai guardando, quanto vale, e rispetto a che cosa. */
function testata({ occhiello, grande, sotto = "", delta = "", azioni = "" }) {
  return `<div class="testata">
    <div class="capo">
      <div>
        <div class="occhiello">${esc(occhiello)}</div>
        <p class="grande">${grande}</p>
        ${sotto ? `<p class="sotto">${sotto}</p>` : ""}
      </div>
      ${delta ? `<div>${delta}</div>` : ""}
    </div>
    ${azioni ? `<div style="margin-top:0.8rem">${azioni}</div>` : ""}
  </div>`;
}

/** Il titolo di una sezione, con eventuale scorciatoia a destra. */
function sezione(titolo, sub = "", vaia = null) {
  return `<div class="sezione">
    <h2>${esc(titolo)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</h2>
    ${vaia ? `<a class="vaia" href="${vaia.href}"${vaia.dato ? ` data-vai="${esc(vaia.dato)}"` : ""}>${esc(vaia.testo)} ›</a>` : ""}
  </div>`;
}

/* Il confronto col periodo precedente. Due avvertenze, tutte e due imparate
   guardando numeri che sembravano dire una cosa e ne dicevano un'altra:

   - «+340%» rispetto a zero non vuol dire niente: se prima non c'era niente,
     si dice che prima non c'era niente.
   - salire non è sempre peggio. Sulle spese sì, sulle entrate no: il colore
     segue il significato, non il segno. */
function chipDelta(ora, prima, { buonoSeSale = false, comeCosa = "il periodo prima" } = {}) {
  if (prima === 0n && ora === 0n) return "";
  if (prima === 0n)
    return `<span class="delta pari" title="Nel ${esc(comeCosa)} non c'era niente da confrontare">nuovo</span>`;
  const q = Number(((ora - prima) * 1000n) / (prima < 0n ? -prima : prima)) / 10;
  const verso = q > 0.05 ? "su" : q < -0.05 ? "giu" : "pari";
  const freccia = verso === "su" ? "▲" : verso === "giu" ? "▼" : "=";
  const segno = q > 0 ? "+" : "";
  return `<span class="delta ${buonoSeSale ? "buono " : ""}${verso}"
    title="Rispetto a ${esc(comeCosa)}: ${formattaCentesimi(prima)}">${freccia} ${segno}${q.toFixed(1)}%</span>`;
}

/* ── L'andamento nel tempo, disegnato a mano ───────────────────────────────
   Entrate in su, uscite in giù, e la linea del saldo che le attraversa.
   Nessuna libreria: un grafico è un po' di aritmetica e dei rettangoli, e una
   libreria di trecento kilobyte per farlo sarebbe una richiesta di rete in più
   su una pagina che non deve farne nessuna.

   La scala è la stessa sopra e sotto, altrimenti una barra alta e una bassa
   direbbero cose non confrontabili. ─────────────────────────────────────── */
function istogramma(serie, { altezza = 100 } = {}) {
  if (!serie.length) return "";
  const L = 100 / serie.length;
  const massimo = serie.reduce((m, x) => {
    const a = x.entrate > m ? x.entrate : m;
    return x.uscite > a ? x.uscite : a;
  }, 1n);
  const alt = (v) => Number((v * 1000n) / massimo) / 1000 * (altezza / 2 - 2);
  const mezzo = altezza / 2;

  const colonne = serie.map((x, i) => {
    const larg = Math.max(L * 0.6, 0.4), off = (L - larg) / 2;
    const hs = alt(x.entrate), hg = alt(x.uscite);
    return `<g class="colonna">
      <title>${esc(x.etichetta)} — entrate ${formattaCentesimi(x.entrate)}, uscite ${formattaCentesimi(x.uscite)}</title>
      <rect class="su" x="${(i * L + off).toFixed(3)}" y="${(mezzo - hs).toFixed(3)}"
        width="${larg.toFixed(3)}" height="${Math.max(hs, 0.15).toFixed(3)}"></rect>
      <rect class="giu" x="${(i * L + off).toFixed(3)}" y="${mezzo}"
        width="${larg.toFixed(3)}" height="${Math.max(hg, 0.15).toFixed(3)}"></rect>
    </g>`;
  }).join("");

  /* Le etichette si diradano da sole: dodici ci stanno, settantotto no, e
     stampate tutte diventano una riga nera. */
  const passo = Math.ceil(serie.length / 12);
  const sotto = serie.map((x, i) =>
    `<span>${i % passo === 0 ? esc(x.breve ?? x.etichetta) : ""}</span>`).join("");

  return `<div class="grafico">
    <svg class="istogramma" viewBox="0 0 100 ${altezza}" preserveAspectRatio="none"
        role="img" aria-label="andamento di entrate e uscite nel tempo">
      ${colonne}
      <line class="asse" x1="0" y1="${mezzo}" x2="100" y2="${mezzo}"></line>
    </svg>
    <div class="mesi-sotto">${sotto}</div>
  </div>`;
}

/** Una riga di categoria: pallino, nome, barra, cifra. */
function rigaCategoria({ nome, colore, valore, totale, sotto = "", vai = null }) {
  const q = totale === 0n ? 0 : Number((valore < 0n ? -valore : valore) * 1000n / (totale < 0n ? -totale : totale)) / 10;
  return `<div class="riga-cat"${vai ? ` data-vai="${esc(vai)}"` : ""}>
    <span class="pallino" style="background:${colore}"></span>
    <span class="mezzo">
      <span class="nome">${esc(nome)}</span>
      <span class="barretta"><i style="width:${Math.min(100, q).toFixed(1)}%;background:${colore}"></i></span>
      ${sotto ? `<span class="quota">${esc(sotto)}</span>` : ""}
    </span>
    <span class="cifra">${formattaCentesimi(valore)}<small>${q.toFixed(1)}%</small></span>
  </div>`;
}

/* ═══ La forma vera dei rapporti ════════════════════════════════════════════
   Non è un elenco: è un albero, e l'albero è quello che ha detto lui.

     - le CARTE non sono rapporti a sé: ricadono sul conto che le paga, e vanno
       viste lì sotto. Vale anche per l'American Express, che ha un suo
       estratto e un suo debito ma si salda dal conto Intesa;
     - le PREPAGATE — HYPE, Revolut, Wise, Trade Republic — vivono per conto
       loro e stanno accanto ai conti;
     - PAYPAL non è nessuna delle due cose. È un modo di pagare: si ricarica
       dal conto nel momento in cui serve e un saldo non ce l'ha. Sommarlo al
       patrimonio farebbe contare due volte gli stessi soldi — una volta sul
       conto e una in PayPal.

   Dove il legame è scritto nei documenti l'ha ricavato il libro mastro; dove
   non è scritto l'ha dichiarato lui. In nessun caso è indovinato dal nome.
   ═════════════════════════════════════════════════════════════════════════ */

const NATURE = {
  conto: { nome: "conto corrente", patrimonio: true },
  prepagata: { nome: "prepagata", patrimonio: true },
  titoli: { nome: "titoli e fondi", patrimonio: true },
  contanti: { nome: "contanti prelevati", patrimonio: true },
  carta: { nome: "carta di credito", patrimonio: false },
  carta_debito: { nome: "carta di debito", patrimonio: false },
  passante: { nome: "modo di pagare", patrimonio: false },
  transito: { nome: "conto tecnico", patrimonio: false },
  sospeso: { nome: "da attribuire", patrimonio: false },
};
const naturaDi = (c) => c.nature ?? (
  c.kind === "liability_credit" ? "carta" :
  c.kind === "asset_securities" ? "titoli" :
  c.kind === "suspense" ? "sospeso" :
  /paypal/i.test(c.name) ? "passante" :
  /contanti/i.test(c.name) ? "contanti" :
  /hype|revolut|wise|trade republic/i.test(c.name) ? "prepagata" : "conto");

const istitutoDi = (c) => {
  if (c.institution) return c.institution;
  return c.name.match(/Intesa|Sella|HYPE|Revolut|Trade Republic|Wise|PayPal|American Express/i)?.[0] ?? "Altro";
};

/** L'albero: istituti, sotto ognuno i suoi conti, sotto ogni conto le sue carte. */
function alberoDeiRapporti() {
  const per = new Map(dati.conti.map((c) => [c.id, c]));
  const radiceDi = (c) => {
    let x = c, giri = 0;
    while (x.parent_account_id && per.has(x.parent_account_id) && giri++ < 6) x = per.get(x.parent_account_id);
    return x;
  };
  const rapporti = dati.conti.filter((c) => !["expense", "income", "equity_opening"].includes(c.kind));
  const figli = new Map();
  for (const c of rapporti) {
    if (!c.parent_account_id || !per.has(c.parent_account_id)) continue;
    if (!figli.has(c.parent_account_id)) figli.set(c.parent_account_id, []);
    figli.get(c.parent_account_id).push(c);
  }

  const istituti = new Map();
  for (const c of rapporti) {
    if (c.parent_account_id && per.has(c.parent_account_id)) continue;   // è una carta: sta sotto il suo conto
    const nat = naturaDi(c);
    /* Fuori dall'elenco dei conti: i conti tecnici e il passante. Il passante
       non è un conto — sommarlo o anche solo metterlo in fila con gli altri
       farebbe sembrare patrimonio dei soldi che sono già contati sul conto. */
    if (["transito", "sospeso", "passante"].includes(nat)) continue;
    const ist = istitutoDi(radiceDi(c));
    if (!istituti.has(ist)) istituti.set(ist, []);
    istituti.get(ist).push({
      c, natura: nat, saldo: saldoConto(c.id),
      carte: (figli.get(c.id) ?? []).map((f) => ({ c: f, natura: naturaDi(f), saldo: saldoConto(f.id) }))
        .sort((a, b) => a.c.name.localeCompare(b.c.name)),
    });
  }

  const fuori = [];
  for (const c of rapporti) {
    const nat = naturaDi(c);
    if (!["transito", "sospeso"].includes(nat)) continue;
    const saldo = saldoConto(c.id);
    if (saldo === 0n) continue;
    fuori.push({ c, natura: nat, saldo });
  }

  /* L'ordine: prima le banche con più soldi, e i conti tecnici sempre in
     fondo. Un elenco che cambia ordine da solo non si impara mai. */
  const totale = (v) => v.reduce((s, x) => s + (NATURE[x.natura]?.patrimonio ? x.saldo : 0n), 0n);
  /* I contanti non sono una banca: sono l'ultima riga, dopo le banche. */
  const peso = (g) => (g.voci.every((v) => v.natura === "contanti") ? 1 : 0);
  return {
    istituti: [...istituti.entries()]
      .map(([nome, voci]) => ({ nome, voci: voci.sort((a, b) => Number(b.saldo - a.saldo)), totale: totale(voci) }))
      .sort((a, b) => peso(a) - peso(b) || Number(b.totale - a.totale)),
    tecnici: fuori.sort((a, b) => Number(b.saldo - a.saldo)),
  };
}

/** Una voce dell'albero: il conto, e sotto le sue carte. */
function voceRapporto(v, colore) {
  const [nome, iban] = nomeConto(v.c).split(" · ");
  const nat = NATURE[v.natura] ?? { nome: v.natura };
  const passante = v.natura === "passante";
  return `
    <a class="voce-conto" href="#/movimenti" data-vai="conto:${esc(v.c.id)}">
      <span class="pallino" style="background:${colore ?? "var(--brand)"}"></span>
      <span class="nomi"><strong>${esc(nome)}</strong>
        <small>${esc(nat.nome)}${iban ? ` · ${esc(iban)}` : ""}</small></span>
      <span class="saldo">${passante && v.saldo === 0n ? "—" : formattaCentesimi(v.saldo)}</span>
    </a>
    ${(v.carte ?? []).map((f) => {
      const n = NATURE[f.natura] ?? { nome: f.natura };
      const suo = istitutoDi(f.c);
      return `<a class="voce-conto figlia" href="#/movimenti" data-vai="conto:${esc(f.c.id)}">
        <span class="ramo" aria-hidden="true"></span>
        <span class="nomi"><strong>${esc(nomeConto(f.c))}</strong>
          <small>${esc(n.nome)}${suo && suo !== istitutoDi(v.c) ? ` · ${esc(suo)}` : ""}${
            f.natura === "carta_debito" ? " · le spese sono sul conto" : ""}</small></span>
        <span class="saldo">${f.natura === "carta_debito" ? "—"
          : f.saldo < 0n ? `${formattaCentesimi(-f.saldo)} da saldare` : formattaCentesimi(f.saldo)}</span>
      </a>`;
    }).join("")}`;
}

function paginaSituazione() {
  const inRitardo = scadute();
  const nonConfermati = daConfermare();
  const nonLetti = daGuardare();
  const buchi = periodiMancanti();

  const albero = alberoDeiRapporti();
  const banche = albero.istituti.map((i) => i.nome);
  const mostrati = bancaAperta ? albero.istituti.filter((i) => i.nome === bancaAperta) : albero.istituti;

  /* Il patrimonio è quello che c'è, non quello che si è visto passare: i
     debiti delle carte si sottraggono, e PayPal — che è un modo di pagare —
     non si somma affatto. */
  const voci = mostrati.flatMap((i) => i.voci);
  const patrimonio = voci.reduce((s, v) => s + (NATURE[v.natura]?.patrimonio ? v.saldo : 0n), 0n);
  const debiti = voci.flatMap((v) => v.carte ?? []).reduce((s, f) => s + (f.saldo < 0n ? -f.saldo : 0n), 0n);

  const fette = voci.filter((v) => NATURE[v.natura]?.patrimonio && v.saldo > 0n)
    .sort((a, b) => Number(b.saldo - a.saldo))
    .map((v, i) => ({ ...v, colore: COLORI[i % COLORI.length] }));
  const paypal = dati.conti.find((c) => naturaDi(c) === "passante");

  return `
    <div class="banche">
      <button class="scheda${bancaAperta === "" ? " viva" : ""}" data-banca="">Tutto</button>
      ${banche.map((b) => `<button class="scheda${bancaAperta === b ? " viva" : ""}" data-banca="${esc(b)}">${esc(b)}</button>`).join("")}
    </div>

    ${nonLetti.length || buchi.length || inRitardo.length || nonConfermati.length ? `
      <div class="allerte">
        ${nonLetti.length ? `<a class="allerta err" href="#/letture">
          <b>${nonLetti.length}</b> document${nonLetti.length === 1 ? "o non è entrato" : "i non sono entrati"} nei conti</a>` : ""}
        ${buchi.length ? `<a class="allerta warn" href="#/letture">
          <b>${buchi.length}</b> rapport${buchi.length === 1 ? "o ha" : "i hanno"} mesi senza documenti</a>` : ""}
        ${inRitardo.length ? `<a class="allerta warn" href="#/solleciti">
          <b>${inRitardo.length}</b> document${inRitardo.length === 1 ? "o" : "i"} in ritardo</a>` : ""}
        ${nonConfermati.length ? `<a class="allerta" href="#/rapporti">
          <b>${nonConfermati.length}</b> rapport${nonConfermati.length === 1 ? "o" : "i"} da confermare</a>` : ""}
      </div>` : `<div class="avviso ok">Tutto quadra: nessun documento fuori, nessun periodo scoperto.</div>`}

    ${testata({
      occhiello: bancaAperta || "Tutti i rapporti",
      grande: formattaCentesimi(patrimonio),
      sotto: `disponibile fra conti, prepagate e titoli${debiti > 0n
        ? ` · <strong>${formattaCentesimi(debiti)}</strong> di carte ancora da saldare` : ""}`,
    })}

    <div class="card quadro">
      <div class="disegno">
        ${ciambella(fette.map((v) => ({ nome: nomeConto(v.c), valore: v.saldo, colore: v.colore })), patrimonio)}
        <div class="centro"><span>disponibile</span><strong>${formattaCentesimi(patrimonio)}</strong></div>
      </div>
      <div class="elenco">
        ${mostrati.length ? mostrati.map((i) => `
          <div class="istituto-blocco">
            <div class="istituto-testa">
              <strong>${esc(i.nome)}</strong>
              <span>${formattaCentesimi(i.totale)}</span>
            </div>
            ${i.voci.map((v) => voceRapporto(v, fette.find((f) => f.c.id === v.c.id)?.colore)).join("")}
          </div>`).join("") : vuoto("Nessun rapporto per questa scelta.")}
      </div>
    </div>

    ${paypal && (!bancaAperta || bancaAperta === istitutoDi(paypal)) ? `
      ${sezione(nomeConto(paypal), "non è un conto: è un modo di pagare")}
      <div class="card" data-vai="conto:${esc(paypal.id)}" style="cursor:pointer">
        <h3 style="justify-content:space-between"><span>Quanto ci è passato dentro</span>
          <span style="font-variant-numeric:tabular-nums">${formattaCentesimi(saldoConto(paypal.id))}</span></h3>
        <div class="note ${saldoConto(paypal.id) === 0n ? "proof" : "risk"}">
          Si ricarica dal conto nel momento in cui serve e non tiene un saldo: quello che entra
          esce subito verso il negoziante. Per questo <strong>non è sommato al patrimonio</strong> —
          sarebbero gli stessi soldi contati due volte.
          ${saldoConto(paypal.id) === 0n
            ? "Il residuo è zero: ogni ricarica ha trovato la sua spesa."
            : `Il residuo di ${formattaCentesimi(saldoConto(paypal.id))} non è denaro fermo lì: è la misura
               di quanto manca all'appello. Sono ricariche di cui non ho ancora il documento che dice
               dove sono finite, oppure spese di cui non ho la ricarica. Caricando gli estratti PayPal
               dei periodi scoperti, questa cifra scende.`}
        </div>
      </div>` : ""}

    ${albero.tecnici.length && !bancaAperta ? `
      ${sezione("Conti tecnici", "esistono per non contare due volte")}
      <div class="card">
        ${albero.tecnici.map((t) => `
          <a class="voce-conto" href="#/movimenti" data-vai="conto:${esc(t.c.id)}">
            <span class="pallino" style="background:var(--muted)"></span>
            <span class="nomi"><strong>${esc(nomeConto(t.c))}</strong>
              <small>${esc((NATURE[t.natura] ?? {}).nome ?? t.natura)}</small></span>
            <span class="saldo">${formattaCentesimi(t.saldo)}</span>
          </a>`).join("")}
        <div class="note risk">Un conto di transito tiene insieme i due documenti della stessa carta —
        la riga sul conto e la riga sull'estratto della carta — perché lo stesso pagamento non venga
        registrato due volte. Quello che resta è esattamente il periodo di cui manca uno dei due
        documenti: sceso a zero, i conti si toccano.</div>
      </div>` : ""}

    <h2>Documenti</h2>
    <div class="tiles">
      <a class="tile" href="#/rapporti"><div class="v">${dati.rapporti.length}</div><div class="k">rapporti</div></a>
      <a class="tile" href="#/documenti"><div class="v">${dati.documenti.length}</div><div class="k">documenti in archivio</div></a>
      <a class="tile" href="#/movimenti"><div class="v">${dati.movimenti.length}</div><div class="k">movimenti</div></a>
      <a class="tile" href="#/letture"><div class="v">${nonLetti.length}</div><div class="k">non letti</div></a>
    </div>
  `;
}

/* ── Rapporti: elenco, diagnosi, dettaglio ──────────────────────────────── */

const GENERE = {
  cash_account: "conto", credit_facility: "carta di credito",
  securities_dossier: "dossier titoli", payment_instrument: "strumento di pagamento",
  insurance_policy: "polizza", loan: "finanziamento",
};

const ETICHETTA_IDENT = {
  iban: "IBAN", account_number: "numero di conto", contract_number: "numero di contratto",
  dossier_number: "numero di dossier", card_masked_pan: "carta",
  issuer_statement_id: "serie di estratto conto",
};

/* Quali documenti ci si aspetta di trovare sotto un rapporto di ciascun
   genere. Un documento fuori da questo insieme non prova che il rapporto sia
   sbagliato, ma e' il segnale che qualcosa e' finito nel posto sbagliato. */
const TIPI_ATTESI = {
  cash_account: new Set(["bank_account_statement", "debit_card_movement_list", "transfer_receipt",
    "summary_document", "service_notice", "contract_change", "tax_receipt", "unknown"]),
  credit_facility: new Set(["credit_card_statement", "card_settlement_notice", "expense_summary",
    "debit_card_movement_list", "summary_document", "service_notice", "contract_change", "unknown"]),
  securities_dossier: new Set(["securities_statement", "securities_order_note", "advisory_report",
    "summary_document", "service_notice", "contract_change", "tax_receipt", "unknown"]),
};

/* Documenti che, da soli, non bastano a dimostrare che esista un rapporto.
   Il documento di sintesi in particolare viene emesso per OGNI prodotto —
   conto, carta, dossier, fido — quindi trovarne uno non significa aver
   trovato un conto. */
const PROVE_DEBOLI = new Set(["summary_document", "service_notice", "contract_change",
  "transfer_receipt", "tax_receipt", "unknown"]);

const identDi = (id) => dati.identificativi.filter((i) => i.relationship_id === id);
const strumentiDi = (id) => dati.strumenti.filter((s) => s.relationship_id === id);
const strumento = (id) => dati.strumenti.find((s) => s.id === id);
const documentiDi = (id) => {
  const ids = new Set(dati.legami.filter((l) => l.relationship_id === id).map((l) => l.document_id));
  return dati.documenti.filter((d) => ids.has(d.id));
};
const fileDi = (idDocumento) => dati.file.find((f) => f.id === idDocumento);
const nomeFile = (d) => dati.file.find((f) => f.id === d.source_file_id)?.display_name ?? "—";
const serieDi = (d) => (d.issuer_statement_id ? d.issuer_statement_id.slice(0, 2) : null);

function raggruppa(elenco, chiave) {
  const m = new Map();
  for (const x of elenco) {
    const k = chiave(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
}

/**
 * Cosa non torna in questo rapporto.
 *
 * Non decide niente: espone le contraddizioni fra quello che il rapporto
 * dichiara di essere e le prove che ha sotto. La decisione resta all'intestatario.
 */
function diagnosi(r) {
  const avvisi = [];
  const ident = identDi(r.id);
  const docs = documentiDi(r.id);

  // Piu' identificativi FORTI dello stesso tipo: quasi sempre due rapporti
  // distinti tenuti insieme per errore. E' l'errore piu' grave dei due,
  // perche' somma fra loro conti che non c'entrano niente.
  for (const [tipo, elenco] of raggruppa(ident.filter((i) => i.strength === "strong"), (i) => i.type)) {
    if (elenco.length > 1) {
      avvisi.push({
        gravita: "stop", genere: "fusione",
        titolo: `Tiene insieme ${elenco.length} ${ETICHETTA_IDENT[tipo] ?? tipo} diversi`,
        dettaglio: elenco.map((i) => i.masked).join("  ·  "),
        spiegazione: "Se sono conti distinti, qui sono stati sommati in uno solo: ogni numero che ne uscirebbe sarebbe la somma di due conti diversi.",
      });
    }
  }

  // Piu' serie di estratto conto sotto lo stesso rapporto: stessa cosa,
  // vista dal lato dei documenti invece che degli identificativi.
  const serie = raggruppa(docs.filter((d) => d.document_type === "bank_account_statement" && serieDi(d)),
    (d) => serieDi(d));
  if (serie.size > 1) {
    avvisi.push({
      gravita: "stop", genere: "serie",
      titolo: `Gli estratti conto appartengono a ${serie.size} serie diverse`,
      dettaglio: [...serie.entries()].map(([s, e]) => `serie ${s}: ${e.length} documenti`).join("  ·  "),
      spiegazione: "Una banca numera gli estratti conto per rapporto. Serie diverse quasi sempre vogliono dire rapporti diversi.",
    });
  }

  // Un solo documento, e per giunta di quelli che non provano granche'.
  if (docs.length === 1 && PROVE_DEBOLI.has(docs[0].document_type)) {
    avvisi.push({
      gravita: "warn", genere: "fantasma",
      titolo: `Poggia su un solo ${TIPI[docs[0].document_type] ?? docs[0].document_type}`,
      dettaglio: nomeFile(docs[0]),
      spiegazione: docs[0].document_type === "summary_document"
        ? "Il documento di sintesi viene emesso per ogni prodotto — conto, carta, dossier — non solo per i conti. Trovarne uno non dimostra che esista un conto a sé."
        : "Un documento di questo tipo cita un numero di rapporto, ma non basta a dimostrare che sia un rapporto separato.",
    });
  }

  // Una successione di carte che ATTRAVERSA due rapporti: il motore ha
  // riconosciuto che la carta nuova continua quella vecchia, ma le due carte
  // stanno sotto rapporti diversi. Se e' davvero la stessa linea di credito,
  // tenerli separati spezza in due lo storico e fa comparire dal nulla un
  // debito che invece era gia' li'.
  for (const s of strumentiDi(r.id)) {
    const prec = s.replaces_id ? strumento(s.replaces_id) : null;
    if (prec && prec.relationship_id && prec.relationship_id !== r.id) {
      avvisi.push({
        gravita: "stop", genere: "successione", altroId: prec.relationship_id,
        titolo: `La carta ${s.masked_pan} continua ${prec.masked_pan}, che sta in un altro rapporto`,
        dettaglio: perRapporto(prec.relationship_id)?.display_name ?? "—",
        spiegazione: s.succession_proof || "Le due serie si susseguono senza sovrapposizione.",
      });
    }
  }
  for (const s of dati.strumenti) {
    const prec = s.replaces_id ? strumento(s.replaces_id) : null;
    if (prec && prec.relationship_id === r.id && s.relationship_id && s.relationship_id !== r.id) {
      avvisi.push({
        gravita: "stop", genere: "successione", altroId: s.relationship_id,
        titolo: `La carta ${prec.masked_pan} sembra proseguire in ${s.masked_pan}, sotto un altro rapporto`,
        dettaglio: perRapporto(s.relationship_id)?.display_name ?? "—",
        spiegazione: s.succession_proof || "Le due serie si susseguono senza sovrapposizione.",
      });
    }
  }

  // Documenti che non c'entrano con il genere dichiarato.
  const attesi = TIPI_ATTESI[r.entity_kind];
  const estranei = attesi ? docs.filter((d) => !attesi.has(d.document_type)) : [];
  if (estranei.length) {
    avvisi.push({
      gravita: "warn", genere: "estranei",
      titolo: `${estranei.length} document${estranei.length === 1 ? "o" : "i"} di tipo estraneo`,
      dettaglio: [...new Set(estranei.map((d) => TIPI[d.document_type] ?? d.document_type))].join(", "),
      spiegazione: `Sotto un ${GENERE[r.entity_kind]} non ci si aspetta questi documenti: appartengono probabilmente a un altro rapporto.`,
    });
  }

  return avvisi;
}

let filtroRap = { istituto: "", genere: "", stato: "", cerca: "" };

function paginaRapporti() {
  if (!dati.rapporti.length) return vuoto("Nessun rapporto. Carica dei documenti per cominciare.");

  const istituti = [...new Set(dati.rapporti.map((r) => r.institution_label || r.institution_key))].sort();
  const generi = [...new Set(dati.rapporti.map((r) => r.entity_kind))].sort();

  const conDiagnosi = dati.rapporti.map((r) => ({
    r, avvisi: diagnosi(r), docs: documentiDi(r.id).length,
  }));

  const elenco = conDiagnosi.filter(({ r, avvisi }) =>
    (!filtroRap.istituto || (r.institution_label || r.institution_key) === filtroRap.istituto) &&
    (!filtroRap.genere || r.entity_kind === filtroRap.genere) &&
    (filtroRap.stato !== "confermati" || r.confirmation === "user_confirmed") &&
    (filtroRap.stato !== "da_confermare" || r.confirmation === "proposed") &&
    (filtroRap.stato !== "da_rivedere" || avvisi.length > 0) &&
    (!filtroRap.cerca || `${r.display_name} ${identDi(r.id).map((i) => i.masked).join(" ")}`
      .toLowerCase().includes(filtroRap.cerca.toLowerCase())));

  elenco.sort((a, b) => b.docs - a.docs || a.r.display_name.localeCompare(b.r.display_name));

  const daRivedere = conDiagnosi.filter((x) => x.avvisi.length).length;

  return `
    <div class="card">
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
        <select id="f-istituto" style="flex:1;min-width:145px">
          <option value="">Tutti gli istituti</option>
          ${istituti.map((i) => `<option value="${esc(i)}"${filtroRap.istituto === i ? " selected" : ""}>${esc(i)}</option>`).join("")}
        </select>
        <select id="f-genere" style="flex:1;min-width:145px">
          <option value="">Tutti i tipi</option>
          ${generi.map((g) => `<option value="${esc(g)}"${filtroRap.genere === g ? " selected" : ""}>${esc(GENERE[g] ?? g)}</option>`).join("")}
        </select>
        <select id="f-stato" style="flex:1;min-width:145px">
          <option value="">Tutti gli stati</option>
          <option value="da_rivedere"${filtroRap.stato === "da_rivedere" ? " selected" : ""}>Da rivedere (${daRivedere})</option>
          <option value="da_confermare"${filtroRap.stato === "da_confermare" ? " selected" : ""}>Da confermare</option>
          <option value="confermati"${filtroRap.stato === "confermati" ? " selected" : ""}>Confermati</option>
        </select>
      </div>
      <input type="text" id="f-cerca" placeholder="Cerca per nome o per numero…" value="${esc(filtroRap.cerca)}">
      <div class="meta"><span>${elenco.length} di ${dati.rapporti.length}</span>
        ${daRivedere ? `<span>${daRivedere} con qualcosa che non torna</span>` : ""}</div>
    </div>

    ${elenco.length ? elenco.map(({ r, avvisi, docs }) => {
      const ident = identDi(r.id);
      const strum = dati.strumenti.filter((s) => s.relationship_id === r.id);
      const cop = dati.copertura.filter((c) => c.relationship_id === r.id);
      const inizi = cop.map((c) => c.start_date).sort();
      const fini = cop.map((c) => c.end_date).sort();

      const stato = r.confirmation === "user_confirmed" ? '<span class="badge ok">confermato</span>'
        : r.confirmation === "rejected" ? '<span class="badge mute">archiviato</span>'
        : r.disposition === "preselected" ? '<span class="badge warn">da confermare</span>'
        : '<span class="badge stop">da verificare a mano</span>';

      const peggiore = avvisi.some((a) => a.gravita === "stop") ? "stop" : avvisi.length ? "warn" : null;

      return `
        <div class="card">
          <h3>${esc(nomeRapporto(r))} ${stato}
            ${r.status === "closed" ? '<span class="badge mute">chiuso</span>' : ""}
            ${peggiore ? `<span class="badge ${peggiore}">${avvisi.length} da rivedere</span>` : ""}</h3>
          <p>${esc(r.institution_label || r.institution_key)} · ${esc(GENERE[r.entity_kind] ?? r.entity_kind)}${
            r.currency ? ` · ${esc(r.currency)}` : ""}</p>
          <div class="meta">
            <span>${docs} document${docs === 1 ? "o" : "i"}</span>
            ${inizi.length ? `<span>${dataBreve(inizi[0])} → ${dataBreve(fini[fini.length - 1])}</span>` : ""}
            ${r.cadence ? `<span>cadenza ${esc(CADENZA[r.cadence] ?? r.cadence)}</span>` : ""}
          </div>
          ${ident.length ? `<div class="meta">${ident.slice(0, 6).map((i) =>
            `<span><code>${esc(i.masked)}</code></span>`).join("")}${
            ident.length > 6 ? `<span>e altri ${ident.length - 6}</span>` : ""}</div>` : ""}
          ${strum.length ? `<div class="note proof">Carte: ${strum.map((s) => esc(s.masked_pan)).join(" → ")}</div>` : ""}
          ${avvisi.map((a) => `<div class="note ${a.gravita === "stop" ? "stop" : "risk"}"><strong>${esc(a.titolo)}</strong> — ${esc(a.dettaglio)}</div>`).join("")}
          <div class="actions">
            <a class="tile" style="padding:0.45rem 0.85rem;border-color:var(--accent);color:var(--accent);font-weight:600;font-size:0.83rem;display:inline-block"
               href="#/rapporto/${esc(r.id)}">Apri e verifica</a>
          </div>
        </div>`;
    }).join("") : vuoto("Nessun rapporto con questi filtri.")}

    ${dati.sconosciuti.length && !filtroRap.istituto && !filtroRap.genere && !filtroRap.stato ? `
      <h2>Nominati ma senza documenti <span class="sub">${dati.sconosciuti.length}</span></h2>
      ${dati.sconosciuti.map((s) => `
        <div class="card">
          <h3>${esc(s.identifier_mask)} <span class="badge mute">nessun documento</span></h3>
          <p>${esc(s.institution_key)} · citato in ${s.mentioned_in} documenti di altri rapporti</p>
          <div class="note">${esc(s.rationale)}</div>
        </div>`).join("")}` : ""}
  `;
}

const CADENZA = { monthly: "mensile", quarterly: "trimestrale", yearly: "annuale", irregular: "irregolare" };

/* ── Dettaglio di un rapporto: tutte le prove, e le azioni per rimetterlo a posto ── */

function paginaRapporto(id) {
  const r = perRapporto(id);
  if (!r) return vuoto("Rapporto non trovato.");

  const ident = identDi(id);
  const docs = documentiDi(id);
  const avvisi = diagnosi(r);
  const strum = dati.strumenti.filter((s) => s.relationship_id === id);
  const cop = dati.copertura.filter((c) => c.relationship_id === id);
  const attese = dati.attese.filter((a) => a.relationship_id === id);

  const perTipo = raggruppa(docs, (d) => d.document_type);
  const attesi = TIPI_ATTESI[r.entity_kind];

  return `
    <div class="actions" style="margin-top:0.9rem">
      <a class="tile" style="padding:0.4rem 0.8rem;font-size:0.83rem;display:inline-block" href="#/rapporti">← Tutti i rapporti</a>
    </div>

    <h2>${esc(nomeRapporto(r))}</h2>
    <div class="card">
      <div class="meta">
        <span>${esc(r.institution_label || r.institution_key)}</span>
        <span>${esc(GENERE[r.entity_kind] ?? r.entity_kind)}</span>
        ${r.currency ? `<span>${esc(r.currency)}</span>` : ""}
        <span>${docs.length} documenti</span>
        <span>attendibilità ${(r.confidence * 100).toFixed(0)}%</span>
        <span>${esc(r.origin === "strong_key" ? "riconosciuto da identificativo forte" : r.origin === "medium_key" ? "riconosciuto da identificativo medio" : "inserito a mano")}</span>
      </div>
      ${r.confirmation === "proposed" ? `
        <div class="actions">
          <button class="act" data-conferma="${esc(r.id)}">Confermo, è mio</button>
          <button class="act ghost" data-rifiuta="${esc(r.id)}">Non è mio</button>
        </div>` : `<div class="note proof">Stato: ${esc(
          r.confirmation === "user_confirmed" ? "confermato da te" : "archiviato")}</div>`}
      <div class="actions">
        <button class="act ghost" data-unisci="${esc(r.id)}">Unisci a un altro rapporto</button>
        <button class="act ghost" data-tipo="${esc(r.id)}">Cambia tipo</button>
      </div>
    </div>
    <div id="modulo-azione"></div>

    ${avvisi.length ? `
      <h2>Cosa non torna <span class="sub">${avvisi.length}</span></h2>
      ${avvisi.map((a) => `
        <div class="card">
          <h3>${esc(a.titolo)} <span class="badge ${a.gravita}">${esc(a.gravita === "stop" ? "grave" : "da rivedere")}</span></h3>
          <p>${esc(a.dettaglio)}</p>
          <div class="note ${a.gravita === "stop" ? "stop" : "risk"}">${esc(a.spiegazione)}</div>
          ${a.genere === "fusione" || a.genere === "serie" ? `
            <div class="actions"><button class="act" data-separa="${esc(r.id)}">Separali</button></div>` : ""}
          ${a.genere === "successione" ? `
            <div class="actions"><button class="act" data-unisci="${esc(r.id)}" data-con="${esc(a.altroId)}">Sì, è lo stesso rapporto</button></div>` : ""}
          ${a.genere === "estranei" ? `
            <div class="actions"><button class="act" data-estranei="${esc(r.id)}">Sposta i documenti estranei</button></div>` : ""}
          ${a.genere === "fantasma" ? `
            <div class="actions">
              <button class="act ghost" data-archivia="${esc(r.id)}">Non è un rapporto a sé, archivialo</button>
              <button class="act ghost" data-tipo="${esc(r.id)}">È un altro tipo di rapporto</button>
            </div>` : ""}
        </div>`).join("")}
    ` : `<div class="note proof" style="margin-top:1rem">Nessuna contraddizione fra quello che questo rapporto dichiara di essere e i documenti che ha sotto.</div>`}

    <h2>Identificativi <span class="sub">${ident.length}</span></h2>
    <div class="card"><div class="scorri"><table class="dati">
      <thead><tr><th>Tipo</th><th>Valore</th><th>Forza</th><th>Stato</th></tr></thead>
      <tbody>${ident.map((i) => `<tr>
        <td>${esc(ETICHETTA_IDENT[i.type] ?? i.type)}</td>
        <td><code>${esc(i.masked)}</code></td>
        <td>${esc(i.strength === "strong" ? "forte" : i.strength === "medium" ? "medio" : "debole")}</td>
        <td>${esc(i.status === "verified" ? "verificato" : i.status === "user_confirmed" ? "confermato" : "dedotto")}</td>
      </tr>`).join("")}</tbody>
    </table></div></div>

    ${strum.length ? `
      <h2>Carte <span class="sub">${strum.length}</span></h2>
      ${strum.map((s) => `<div class="card">
        <h3><code>${esc(s.masked_pan)}</code> ${s.succession_status === "user_confirmed" ? '<span class="badge ok">sostituzione confermata</span>' : ""}</h3>
        <div class="meta">
          ${s.valid_from ? `<span>dal ${dataBreve(s.valid_from)}</span>` : ""}

          ${s.replaces_id ? `<span>sostituisce <code>${esc(dati.strumenti.find((x) => x.id === s.replaces_id)?.masked_pan ?? "—")}</code></span>` : ""}

    <h2>Documenti <span class="sub">${docs.length}</span></h2>
    ${docs.length ? [...perTipo.entries()]
      .sort((a, b) => b[1].length - a[1].length)
      .map(([tipo, elenco]) => {
        const estraneo = attesi && !attesi.has(tipo);
        const perSerie = raggruppa(elenco, (d) => serieDi(d) ?? "—");
        return `
          <div class="card">
            <h3>${esc(TIPI[tipo] ?? tipo)} <span class="badge ${estraneo ? "stop" : "mute"}">${elenco.length}</span>
